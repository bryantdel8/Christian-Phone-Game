    {t:"mc", ref:"Malachi 3:8", q:"Malachi accuses the people of \"robbing\" God by withholding what?", opts:["Tithes and offerings","Sabbath rest","Their firstborn sons","Their prayers"], a:"Tithes and offerings"},
    {t:"mc", ref:"Malachi 2:14-16", q:"Malachi 2:14-16 rebukes the men of Judah for being faithless to whom, calling it a covenant violation?", opts:["The wife of their youth","Their business partners","Their own parents","Their fellow priests"], a:"The wife of their youth"},
    {t:"mc", ref:"Malachi 2:7", q:"Malachi 2:7 says the lips of a priest should guard what, since people seek it from his mouth?", opts:["Knowledge/instruction","Wealth","Blessings only","Political power"], a:"Knowledge/instruction"},
    {t:"mc", ref:"Malachi 3:5", q:"Malachi 3:5 lists sorcerers, adulterers, and those who swear falsely among those God will judge, alongside those who oppress the hired worker, the widow, and whom else?", opts:["The fatherless and the sojourner","The wealthy landowners","The foreign kings","The corrupt judges alone"], a:"The fatherless and the sojourner"},
    {t:"mc", ref:"Malachi 1:11", q:"Malachi 1:11 declares that from the rising of the sun to its setting, God's name will be great among whom?", opts:["The nations","The priests alone","Israel alone","The angels"], a:"The nations"},
    {t:"mc", ref:"Malachi 2:17", q:"Malachi 2:17 says the people wearied the LORD by claiming that everyone who does evil is what in his sight?", opts:["Good","Forgiven","Unnoticed","Blessed"], a:"Good"},
    {t:"mc", ref:"Malachi 3:10", q:"Malachi 3:10 invites the people to test God by bringing the full tithe, promising he will open what?", opts:["The windows of heaven","The gates of Jerusalem","The doors of the Temple","The storehouses of Egypt"], a:"The windows of heaven"},
    {t:"mc", ref:"Malachi 3:17", q:"Malachi 3:17 says the LORD will spare his treasured people as a man spares whom?", opts:["His son who serves him","A stranger","His servant","A hired worker"], a:"His son who serves him"},
    {t:"mc", ref:"Malachi 1:4", q:"Malachi 1:4 responds to Edom's boast of rebuilding its ruins by declaring what?", opts:["\"They may build, but I will tear down\"","\"They will prosper forever\"","\"I will bless their efforts\"","\"I will forget their sin\""], a:"\"They may build, but I will tear down\""},
    {t:"order", ref:"Malachi 3:6", verse:"For I the LORD do not change; therefore you, O children of Jacob, are not consumed.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Malachi 3:6", q:"\"For I the LORD do not change; therefore you, O children of Jacob, are not ___.\"", opts:["consumed","forsaken","forgotten","destroyed"], a:"consumed"},
    {t:"order", ref:"Malachi 3:7", verse:"Return to me, and I will return to you, says the LORD of hosts.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Malachi 3:7", q:"\"Return to me, and I will return to you, says the LORD of ___.\"", opts:["hosts","Israel","glory","all"], a:"hosts"},
    {t:"order", ref:"Malachi 3:16", verse:"Then those who feared the LORD spoke with one another. The LORD paid attention and heard them, and a book of remembrance was written before him of those who feared the LORD and esteemed his name.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Malachi 3:16", q:"\"Then those who feared the LORD spoke with one another. The LORD paid attention and heard them, and a book of remembrance was written before him of those who feared the LORD and esteemed his ___.\"", opts:["name","word","covenant","glory"], a:"name"},
    {t:"order", ref:"Malachi 4:5", verse:"Behold, I will send you Elijah the prophet before the great and awesome day of the LORD comes.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Malachi 4:5", q:"\"Behold, I will send you Elijah the prophet before the great and awesome day of the LORD ___.\"", opts:["comes","arrives","dawns","begins"], a:"comes"},
    {t:"order", ref:"Malachi 4:6", verse:"And he will turn the hearts of fathers to their children and the hearts of children to their fathers,", q:"Arrange the verse in order:"},
  ], hard: [
    {t:"mc", ref:"Malachi", q:"Malachi rebukes the priests for offering God what kind of sacrifices?", opts:["Blemished/defective animals","Too many sacrifices","No sacrifices at all","Sacrifices at the wrong time"], a:"Blemished/defective animals"},
    {t:"mc", ref:"Malachi 4:5-6,Matthew 17", q:"Malachi's prophecy of Elijah's return before the \"great and awesome day of the LORD\" is connected in the Gospels to which figure?", opts:["John the Baptist","Peter","Moses","Zechariah the priest"], a:"John the Baptist"},
    {t:"mc", ref:"Malachi", q:"The name \"Malachi\" itself means what, fitting the book's theme of a coming messenger?", opts:["\"My messenger\"","\"God's judge\"","\"The faithful one\"","\"Servant of the LORD\""], a:"\"My messenger\""},
    {t:"mc", ref:"Malachi 2:4-6", q:"Malachi 2:4-6 recalls a covenant of life and peace God made with which priestly line, now being corrupted?", opts:["Levi","Aaron alone","Zadok","Melchizedek"], a:"Levi"},
    {t:"mc", ref:"Malachi", q:"Malachi's book is structured largely as a series of what literary device between the LORD and the people?", opts:["Disputations (accusation, objection, and rebuttal)","Unbroken narrative history","Songs of lament","Genealogical records"], a:"Disputations (accusation, objection, and rebuttal)"},
    {t:"mc", ref:"Malachi 3:6", q:"Malachi 3:6 grounds the call to return to God in what unchanging attribute of the LORD?", opts:["\"I the LORD do not change\"","\"I the LORD forget quickly\"","\"I the LORD am distant\"","\"I the LORD delay judgment\""], a:"\"I the LORD do not change\""},
    {t:"mc", ref:"Malachi 4:1", q:"Malachi 4:1 describes the coming day as burning like an oven, leaving the arrogant and evildoers with neither root nor what?", opts:["Branch","Seed","Fruit","Shade"], a:"Branch"},
    {t:"mc", ref:"Malachi", q:"As the final book of the Old Testament in most Christian canons, Malachi's closing themes of a coming messenger and Elijah's return set up anticipation for what New Testament opening?", opts:["The Gospel accounts of John the Baptist and Jesus","The book of Acts","Paul's missionary journeys","The book of Revelation"], a:"The Gospel accounts of John the Baptist and Jesus"},
    {t:"mc", ref:"Malachi 2:15", q:"Malachi 2:15 asks what God was seeking in making husband and wife \"one,\" as grounds for marital faithfulness?", opts:["Godly offspring","Political alliances","Economic security","Social status"], a:"Godly offspring"},
    {t:"mc", ref:"Malachi 3:14-15", q:"Malachi 3:14-15 records the people's cynical complaint that serving God is vain because whom do they see prospering?", opts:["The arrogant and evildoers","Only the priests","Only foreign kings","No one at all"], a:"The arrogant and evildoers"},
    {t:"order", ref:"Malachi 1:2-3", verse:"I have loved you, says the LORD. Yet I have loved Jacob but Esau I have hated.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Malachi 1:2-3", q:"\"I have loved you, says the LORD. Yet I have loved Jacob but Esau I have ___.\"", opts:["hated","rejected","forgotten","cursed"], a:"hated"},
    {t:"order", ref:"Malachi 2:16", verse:"For the man who does not love his wife but divorces her, says the LORD, the God of Israel, covers his garment with violence, says the LORD of hosts.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Malachi 2:16", q:"\"For the man who does not love his wife but divorces her, says the LORD, the God of Israel, covers his garment with ___, says the LORD of hosts.\"", opts:["violence","shame","sin","guilt"], a:"violence"},
    {t:"order", ref:"Malachi 4:1", verse:"For behold, the day is coming, burning like an oven, when all the arrogant and all evildoers will be stubble.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Malachi 4:1", q:"\"For behold, the day is coming, burning like an oven, when all the arrogant and all evildoers will be ___.\"", opts:["stubble","ashes","dust","chaff"], a:"stubble"},
    {t:"order", ref:"Malachi 1:14", verse:"Cursed be the cheat who has a male in his flock, and vows it, and yet sacrifices to the Lord what is blemished.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Malachi 1:14", q:"\"Cursed be the cheat who has a male in his flock, and vows it, and yet sacrifices to the Lord what is ___.\"", opts:["blemished","unclean","worthless","defective"], a:"blemished"},
    {t:"order", ref:"Malachi 2:7", verse:"For the lips of a priest should guard knowledge, and people should seek instruction from his mouth, for he is the messenger of the LORD of hosts.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Malachi 2:7", q:"\"For the lips of a priest should guard knowledge, and people should seek instruction from his mouth, for he is the messenger of the LORD of ___.\"", opts:["hosts","glory","Israel","all"], a:"hosts"},
  ]},
"2 Corinthians": { easy: [
    {t:"mc", ref:"2 Corinthians", q:"2 Corinthians was written by whom?", opts:["Paul","Peter","John","Timothy"], a:"Paul"},
    {t:"fill", ref:"2 Corinthians 5:7", q:"\"...for we walk by ___, not by sight.\"", opts:["faith","hope","the Spirit","grace"], a:"faith"},
    {t:"fill", ref:"2 Corinthians 1:3", q:"\"Blessed be the God and Father of our Lord Jesus Christ, the Father of mercies and God of all ___.\"", opts:["comfort","grace","hope","peace"], a:"comfort"},
    {t:"fill", ref:"2 Corinthians 5:17", q:"\"...if anyone is in Christ, he is a new ___. The old has passed away.\"", opts:["creation","person","life","spirit"], a:"creation"},
    {t:"fill", ref:"2 Corinthians 9:7", q:"\"...for God loves a cheerful ___.\"", opts:["giver","heart","servant","worker"], a:"giver"},
    {t:"mc", ref:"2 Corinthians 1:1", q:"2 Corinthians 1:1 identifies Paul as an apostle of Christ Jesus and names which co-sender alongside him?", opts:["Timothy","Silas","Titus","Barnabas"], a:"Timothy"},
    {t:"mc", ref:"2 Corinthians 1:20", q:"2 Corinthians 1:20 says all of God's promises find what in Christ?", opts:["Their \"Yes\"","Their delay","Their fulfillment only in Israel","Their mystery"], a:"Their \"Yes\""},
    {t:"mc", ref:"2 Corinthians 4:7", q:"2 Corinthians 4:7 says believers carry a treasure, the gospel, in what kind of humble container?", opts:["Jars of clay","Golden vessels","Wooden boxes","Silver chests"], a:"Jars of clay"},
    {t:"mc", ref:"2 Corinthians 6:14", q:"2 Corinthians 6:14 warns believers not to do what with unbelievers?", opts:["Be unequally yoked together","Speak to them at all","Share meals with them","Live in the same city"], a:"Be unequally yoked together"},
    {t:"mc", ref:"2 Corinthians 8:9", q:"2 Corinthians 8:9 says that though Christ was rich, he became what for our sake?", opts:["Poor","A servant only","Hidden","Silent"], a:"Poor"},
    {t:"mc", ref:"2 Corinthians 1:3-4", q:"2 Corinthians 1:3-4 says God comforts believers in affliction so that they can do what?", opts:["Comfort others in their affliction","Forget their own suffering","Avoid all future trials","Judge others' weaknesses"], a:"Comfort others in their affliction"},
    {t:"mc", ref:"2 Corinthians 13:14", q:"2 Corinthians ends with a benediction naming the grace of Christ, the love of God, and the fellowship of whom?", opts:["The Holy Spirit","The apostles","The church at Corinth","The angels"], a:"The Holy Spirit"},
    {t:"mc", ref:"2 Corinthians 3:18", q:"2 Corinthians 3:18 says believers are being transformed into Christ's image with ever-increasing what?", opts:["Glory","Wisdom","Wealth","Authority"], a:"Glory"},
    {t:"mc", ref:"2 Corinthians 4:16-17", q:"2 Corinthians 4:16-17 calls present sufferings a \"light and momentary\" affliction compared to what?", opts:["An eternal weight of glory","A permanent burden","Nothing at all","A distant memory"], a:"An eternal weight of glory"},
    {t:"order", ref:"2 Corinthians 4:17", verse:"For this light momentary affliction is preparing for us an eternal weight of glory beyond all comparison,", q:"Arrange the verse in order:"},
    {t:"fill", ref:"2 Corinthians 4:17", q:"\"For this light momentary affliction is preparing for us an eternal weight of ___ beyond all comparison,\"", opts:["glory","joy","peace","hope"], a:"glory"},
    {t:"order", ref:"2 Corinthians 9:8", verse:"And God is able to make all grace abound to you, so that having all sufficiency in all things at all times, you may abound in every good work.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"2 Corinthians 9:8", q:"\"And God is able to make all grace abound to you, so that having all sufficiency in all things at all times, you may abound in every good ___.\"", opts:["work","deed","gift","way"], a:"work"},
    {t:"order", ref:"2 Corinthians 13:11", verse:"comfort one another, agree with one another, live in peace; and the God of love and peace will be with you.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"2 Corinthians 13:11", q:"\"...comfort one another, agree with one another, live in peace; and the God of love and ___ will be with you.\"", opts:["peace","joy","hope","grace"], a:"peace"},
  ], medium: [
    {t:"mc", ref:"2 Corinthians 12", q:"Paul describes receiving a \"thorn in the flesh\" to keep him humble. What does he call it?", opts:["A messenger of Satan","A demon","A disease","A curse from enemies"], a:"A messenger of Satan"},
    {t:"fill", ref:"2 Corinthians 4:16", q:"\"...Though our outer self is wasting away, our inner self is being ___ day by day.\"", opts:["renewed","restored","strengthened","reborn"], a:"renewed"},
    {t:"fill", ref:"2 Corinthians 12:9", q:"\"...My grace is sufficient for you, for my power is made perfect in ___.\"", opts:["weakness","suffering","trial","humility"], a:"weakness"},
    {t:"mc", ref:"2 Corinthians 9:6", q:"What does Paul say about generous giving in 2 Corinthians 9, comparing it to farming?", opts:["Whoever sows bountifully will also reap bountifully","Giving has no real reward","Sowing sparingly is wiser","Only the wealthy should give"], a:"Whoever sows bountifully will also reap bountifully"},
    {t:"mc", ref:"2 Corinthians 5:21", q:"2 Corinthians 5:21 says Christ, who knew no sin, became what for our sake?", opts:["Sin, so we might become the righteousness of God","A servant","A curse only","A sacrifice without purpose"], a:"Sin, so we might become the righteousness of God"},
    {t:"mc", ref:"2 Corinthians 3:6", q:"2 Corinthians 3:6 contrasts the old and new covenants by saying the letter kills, but what gives life?", opts:["The Spirit","The law","Faith alone","Circumcision"], a:"The Spirit"},
    {t:"mc", ref:"2 Corinthians 4:8-9", q:"2 Corinthians 4:8-9 says believers are afflicted but not crushed, perplexed but not driven to what?", opts:["Despair","Silence","Anger","Exile"], a:"Despair"},
    {t:"mc", ref:"2 Corinthians 5:14-15", q:"2 Corinthians 5:14-15 says what \"controls\" or compels believers, since Christ died for all?", opts:["The love of Christ","Fear of judgment","Duty to the law","Loyalty to Paul"], a:"The love of Christ"},
    {t:"mc", ref:"2 Corinthians 6:2", q:"2 Corinthians 6:2 declares \"now is the acceptable time\" and now is what \"day\"?", opts:["The day of salvation","The day of judgment","The day of rest","The day of wrath"], a:"The day of salvation"},
    {t:"mc", ref:"2 Corinthians 10:5", q:"2 Corinthians 10:5 instructs believers to take every thought captive to obey whom?", opts:["Christ","The apostles","The law","Their conscience alone"], a:"Christ"},
    {t:"mc", ref:"2 Corinthians 13:4", q:"2 Corinthians 13:4 says Christ was crucified in weakness but lives by what?", opts:["The power of God","His own strength alone","The Roman government's decree","The apostles' faith"], a:"The power of God"},
    {t:"mc", ref:"2 Corinthians 2:14-16", q:"2 Corinthians 2:14-16 describes believers spreading the gospel as being like what pleasing sensory image to God?", opts:["The aroma/fragrance of Christ","A trumpet blast","A written scroll","A bright light"], a:"The aroma/fragrance of Christ"},
    {t:"order", ref:"2 Corinthians 1:4", verse:"who comforts us in all our affliction, so that we may be able to comfort those who are in any affliction, with the comfort with which we ourselves are comforted by God.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"2 Corinthians 1:4", q:"\"who comforts us in all our affliction, so that we may be able to comfort those who are in any affliction, with the comfort with which we ourselves are comforted by ___.\"", opts:["God","the Lord","the Spirit","Christ"], a:"God"},
    {t:"order", ref:"2 Corinthians 5:14", verse:"For the love of Christ controls us, because we have concluded this: that one has died for all, therefore all have died;", q:"Arrange the verse in order:"},
    {t:"fill", ref:"2 Corinthians 5:14", q:"\"For the love of Christ ___ us, because we have concluded this: that one has died for all, therefore all have died;\"", opts:["controls","compels","sustains","moves"], a:"controls"},
    {t:"order", ref:"2 Corinthians 6:2", verse:"Behold, now is the favorable time; behold, now is the day of salvation.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"2 Corinthians 6:2", q:"\"Behold, now is the favorable time; behold, now is the day of ___.\"", opts:["salvation","grace","the Lord","mercy"], a:"salvation"},
    {t:"order", ref:"2 Corinthians 2:15", verse:"For we are the aroma of Christ to God among those who are being saved and among those who are perishing,", q:"Arrange the verse in order:"},
    {t:"fill", ref:"2 Corinthians 2:15", q:"\"For we are the ___ of Christ to God among those who are being saved and among those who are perishing,\"", opts:["aroma","fragrance","light","voice"], a:"aroma"},
  ], hard: [
    {t:"mc", ref:"2 Corinthians 5", q:"2 Corinthians 5 describes believers becoming what \"in Christ\"?", opts:["A new creation","Perfect immediately","Angels","Priests only"], a:"A new creation"},
    {t:"fill", ref:"2 Corinthians 12:10", q:"\"...For when I am weak, then I am ___.\"", opts:["strong","content","free","victorious"], a:"strong"},
    {t:"mc", ref:"2 Corinthians 4:18", q:"What contrast does 2 Corinthians 4:18 draw between what is seen and unseen?", opts:["The seen is transient, the unseen is eternal","The seen is more valuable to believers","Both are equally eternal","Only the seen matters for faith"], a:"The seen is transient, the unseen is eternal"},
    {t:"mc", ref:"2 Corinthians", q:"2 Corinthians is largely a defense of Paul's apostolic ministry against what kind of opponents in Corinth?", opts:["False/rival apostles questioning his authority","Roman officials","Jewish Sanhedrin leaders","Gnostic philosophers"], a:"False/rival apostles questioning his authority"},
    {t:"mc", ref:"2 Corinthians 8-9", q:"2 Corinthians 8-9 primarily deals with what practical church matter, encouraging generosity?", opts:["A collection/offering for the poor believers in Jerusalem","Building a new temple","Funding Paul's travels","Paying off Corinth's civic debts"], a:"A collection/offering for the poor believers in Jerusalem"},
    {t:"mc", ref:"2 Corinthians 11:24-27", q:"2 Corinthians 11 lists Paul's extensive sufferings for the gospel, including how many lashes received at once?", opts:["Forty lashes minus one","Exactly fifty","Ten only","One hundred"], a:"Forty lashes minus one"},
    {t:"mc", ref:"2 Corinthians 12:2-4", q:"2 Corinthians 12:2-4 describes Paul being caught up to what realm, hearing things not to be told?", opts:["The third heaven/Paradise","Mount Sinai","The heavenly Jerusalem","The throne room of Rome"], a:"The third heaven/Paradise"},
    {t:"mc", ref:"2 Corinthians 3:14-16", q:"2 Corinthians 3:14-16 says a veil lies over Israel's minds when reading Moses, but it is removed for those who turn to whom?", opts:["Christ","The Spirit alone","The apostles","Moses himself"], a:"Christ"},
    {t:"mc", ref:"2 Corinthians 1:8-9", q:"2 Corinthians 1:8-9 describes an affliction in Asia so severe that Paul despaired of what?", opts:["Life itself","His ministry only","His reputation","His finances"], a:"Life itself"},
    {t:"mc", ref:"2 Corinthians 11:14", q:"2 Corinthians 11:14 warns that Satan disguises himself as what, to deceive believers?", opts:["An angel of light","A roaring lion","A wise teacher","A humble servant"], a:"An angel of light"},
    {t:"mc", ref:"2 Corinthians 3:3", q:"2 Corinthians 3:3 describes the Corinthian believers themselves as a letter from Christ, written not with ink but with what?", opts:["The Spirit of the living God","Blood","Gold","Fire"], a:"The Spirit of the living God"},
    {t:"order", ref:"2 Corinthians 4:18", verse:"as we look not to the things that are seen but to the things that are unseen. For the things that are seen are transient, but the things that are unseen are eternal.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"2 Corinthians 4:18", q:"\"...For the things that are seen are transient, but the things that are unseen are ___.\"", opts:["eternal","holy","unending","perfect"], a:"eternal"},
    {t:"order", ref:"2 Corinthians 3:3", verse:"And you show that you are a letter from Christ delivered by us, written not with ink but with the Spirit of the living God, not on tablets of stone but on tablets of human hearts.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"2 Corinthians 3:3", q:"\"And you show that you are a letter from Christ delivered by us, written not with ink but with the Spirit of the living God, not on tablets of stone but on tablets of human ___.\"", opts:["hearts","minds","souls","lives"], a:"hearts"},
    {t:"order", ref:"2 Corinthians 11:14", verse:"And no wonder, for even Satan disguises himself as an angel of light.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"2 Corinthians 11:14", q:"\"And no wonder, for even Satan disguises himself as an angel of ___.\"", opts:["light","glory","mercy","hope"], a:"light"},
    {t:"order", ref:"2 Corinthians 1:8-9", verse:"we were so utterly burdened beyond our strength that we despaired of life itself. Indeed, we felt that we had received the sentence of death.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"2 Corinthians 1:8-9", q:"\"...we were so utterly burdened beyond our strength that we despaired of life itself. Indeed, we felt that we had received the sentence of ___.\"", opts:["death","doom","judgment","ruin"], a:"death"},
    {t:"order", ref:"2 Corinthians 10:17", verse:"Let the one who boasts, boast in the Lord.", q:"Arrange the verse in order:"},
  ]},
Colossians: { easy: [
    {t:"mc", ref:"Colossians", q:"Colossians was written by whom?", opts:["Paul","Peter","James","John"], a:"Paul"},
    {t:"fill", ref:"Colossians 3:17", q:"\"And whatever you do, in word or deed, do everything in the name of the Lord ___.\"", opts:["Jesus","Almighty","of hosts","our God"], a:"Jesus"},
    {t:"fill", ref:"Colossians 1:15", q:"\"He is the image of the invisible God, the ___ of all creation.\"", opts:["firstborn","image alone","ruler","glory"], a:"firstborn"},
    {t:"fill", ref:"Colossians 1:17", q:"\"And he is before all things, and in him all things hold ___.\"", opts:["together","firm","in place","in order"], a:"together"},
    {t:"fill", ref:"Colossians 3:23", q:"\"Whatever you do, work heartily, as for the Lord and not for ___.\"", opts:["men","yourself","reward","praise"], a:"men"},
    {t:"mc", ref:"Colossians 1:16-17", q:"Colossians 1 describes Christ as supreme over what, being before all things and holding them together?", opts:["All creation","Only the church","Only Israel","Only the angels"], a:"All creation"},
    {t:"mc", ref:"Colossians 1:1", q:"Colossians 1:1 identifies Paul as an apostle, writing alongside which co-sender?", opts:["Timothy","Titus","Silas","Barnabas"], a:"Timothy"},
    {t:"mc", ref:"Colossians 1:13-14", q:"Colossians 1:13-14 says God delivered believers from the domain of darkness and transferred them into what?", opts:["The kingdom of his beloved Son","A new set of laws","The Roman Empire","A distant paradise"], a:"The kingdom of his beloved Son"},
    {t:"mc", ref:"Colossians 1:18", q:"Colossians 1:18 says Christ is the head of what body?", opts:["The church","Israel","The angels","Creation alone"], a:"The church"},
    {t:"mc", ref:"Colossians 2:6-7", q:"Colossians 2:6-7 tells believers, having received Christ, to do what in him?", opts:["Walk, rooted and built up in him","Wait passively for his return","Argue his teachings publicly","Separate from all others"], a:"Walk, rooted and built up in him"},
    {t:"mc", ref:"Colossians 3:9-10", q:"Colossians 3:9-10 instructs believers to put off the old self and put on what?", opts:["The new self, being renewed in knowledge","A new name only","New clothing as a symbol","A new set of feast days"], a:"The new self, being renewed in knowledge"},
    {t:"mc", ref:"Colossians 4:2", q:"Colossians 4:2 tells believers to continue steadfastly in what, being watchful with thanksgiving?", opts:["Prayer","Fasting","Giving","Preaching"], a:"Prayer"},
    {t:"mc", ref:"Colossians 1:23", q:"Colossians 1:23 urges believers to continue in the faith, being stable and steadfast, not shifting from what?", opts:["The hope of the gospel","Their own traditions","Their national identity","Their teacher's opinions"], a:"The hope of the gospel"},
    {t:"mc", ref:"Colossians 4:5", q:"Colossians 4:5 tells believers to walk in wisdom toward outsiders, making the best use of what?", opts:["Their time","Their wealth","Their words alone","Their influence"], a:"Their time"},
  ], medium: [
    {t:"mc", ref:"Colossians 1", q:"Colossians emphasizes the supremacy of whom over all creation?", opts:["Christ","Moses","The angels","The emperor"], a:"Christ"},
    {t:"fill", ref:"Colossians 3:1", q:"\"If then you have been raised with Christ, seek the things that are above, where Christ is, seated at the right hand of ___.\"", opts:["God","the Father alone","glory","majesty"], a:"God"},
    {t:"fill", ref:"Colossians 3:2", q:"\"Set your minds on things that are above, not on things that are on ___.\"", opts:["earth","the flesh","this world","the ground"], a:"earth"},
    {t:"fill", ref:"Colossians 3:12", q:"\"Put on then, as God's chosen ones, holy and beloved, compassionate hearts, kindness, humility, meekness, and ___.\"", opts:["patience","love","joy","peace"], a:"patience"},
    {t:"fill", ref:"Colossians 3:15", q:"\"And let the peace of Christ ___ in your hearts, to which indeed you were called in one body.\"", opts:["rule","dwell","reign","abide"], a:"rule"},
    {t:"mc", ref:"Colossians 1:9-10", q:"Colossians 1:9-10 says Paul prays believers would be filled with knowledge of God's will so they might do what?", opts:["Walk worthy of the Lord","Avoid all suffering","Become wealthy","Rule over others"], a:"Walk worthy of the Lord"},
    {t:"mc", ref:"Colossians 1:20", q:"Colossians 1:20 says God reconciled all things to himself through Christ, making peace by what?", opts:["The blood of his cross","A new covenant sign","The Law of Moses","The Temple sacrifices"], a:"The blood of his cross"},
    {t:"mc", ref:"Colossians 2:8", q:"Colossians 2:8 warns believers to see to it that no one takes them captive by what?", opts:["Empty philosophy and human tradition","Generosity","Simple faith","Honest labor"], a:"Empty philosophy and human tradition"},
    {t:"mc", ref:"Colossians 2:14", q:"Colossians 2:14 says Christ canceled the record of debt against us by doing what?", opts:["Nailing it to the cross","Burning it in the Temple","Hiding it in heaven","Giving it to the angels"], a:"Nailing it to the cross"},
    {t:"mc", ref:"Colossians 2:16-17", q:"Colossians 2:16-17 says regulations about food and festivals are what, compared to the substance found in Christ?", opts:["A shadow of things to come","More important than Christ","Unrelated to faith","Permanently binding"], a:"A shadow of things to come"},

    {t:"fill", ref:"Hebrews 4:16", q:"\"Let us then with confidence draw near to the throne of grace, that we may receive mercy and find grace to help in time of ___.\"", opts:["need","trouble","weakness","prayer"], a:"need"},
    {t:"fill", ref:"Hebrews 13:8", q:"\"Jesus Christ is the same yesterday and today and ___.\"", opts:["forever","always","for all time","unchanging"], a:"forever"},
    {t:"fill", ref:"Hebrews 13:5", q:"\"...for he has said, 'I will never leave you nor ___.'\"", opts:["forsake","abandon","fail","betray"], a:"forsake"},
    {t:"mc", ref:"Hebrews 5-7", q:"Hebrews argues Jesus is superior to angels, Moses, and which mysterious Old Testament priestly figure?", opts:["Melchizedek","Aaron alone","Samuel","Elijah"], a:"Melchizedek"},
    {t:"mc", ref:"Hebrews 1:1-2", q:"Hebrews 1:1-2 says God spoke long ago by the prophets, but in these last days has spoken by whom?", opts:["His Son","The angels","Moses again","The apostles"], a:"His Son"},
    {t:"mc", ref:"Hebrews 2:1", q:"Hebrews 2:1 warns believers to pay close attention to what they have heard, so as not to do what?", opts:["Drift away","Grow wealthy","Become teachers","Lose their memory"], a:"Drift away"},
    {t:"mc", ref:"Hebrews 4:14-15", q:"Hebrews 4:14-15 describes Jesus as a great high priest who sympathizes with our weaknesses because he was what?", opts:["Tempted in every way, yet without sin","Born without a human body","Exempt from all suffering","Only symbolically human"], a:"Tempted in every way, yet without sin"},
    {t:"mc", ref:"Hebrews 9:22", q:"Hebrews 9:22 says under the law nearly everything is purified with blood, and without the shedding of blood there is no what?", opts:["Forgiveness","Peace","Wisdom","Life"], a:"Forgiveness"},
    {t:"mc", ref:"Hebrews 12:6", q:"Hebrews 12:6 says the Lord disciplines whom?", opts:["The one he loves","Only the wicked","Only unbelievers","No one directly"], a:"The one he loves"},
    {t:"mc", ref:"Hebrews 12:14", q:"Hebrews 12:14 urges believers to strive for peace with everyone and for what else?", opts:["Holiness","Wealth","Recognition","Comfort"], a:"Holiness"},
    {t:"mc", ref:"Hebrews 13:15", q:"Hebrews 13:15 says believers should continually offer through Jesus a sacrifice of what?", opts:["Praise","Grain","Silver","Incense alone"], a:"Praise"},
    {t:"mc", ref:"Hebrews 4:16", q:"Hebrews 4:16 encourages believers to draw near to the throne of grace with what attitude?", opts:["Confidence","Fear alone","Reluctance","Formal ritual"], a:"Confidence"},
  ], medium: [
    {t:"mc", ref:"Hebrews 11", q:"Hebrews 11 is often called the \"Hall of ___\" for its list of examples of trust in God.", opts:["Faith","Fame","Heroes","Kings"], a:"Faith"},
    {t:"fill", ref:"Hebrews 4:12", q:"\"...the word of God is living and active, sharper than any two-edged ___.\"", opts:["sword","blade","weapon","spear"], a:"sword"},
    {t:"fill", ref:"Hebrews 10:24", q:"\"And let us consider how to stir up one another to love and good ___.\"", opts:["works","deeds alone","faith","hope"], a:"works"},
    {t:"fill", ref:"Hebrews 10:25", q:"\"...not neglecting to meet together, as is the habit of some, but encouraging one another, and all the more as you see the ___ drawing near.\"", opts:["Day","end","judgment","hour"], a:"Day"},
    {t:"mc", ref:"Hebrews 12:1", q:"Hebrews 12:1 pictures the Christian life as a race watched by a great what?", opts:["\"Cloud of witnesses\"","Army of angels","Crowd of prophets","Congregation of saints"], a:"\"Cloud of witnesses\""},
    {t:"fill", ref:"Hebrews 12:2", q:"\"...looking to Jesus, the founder and perfecter of our faith, who for the joy that was set before him endured the ___...\"", opts:["cross","shame","suffering","trial"], a:"cross"},
    {t:"mc", ref:"Hebrews 6:19-20", q:"Hebrews 6:19-20 describes hope as what for the soul, sure and steadfast?", opts:["An anchor","A shield","A lamp","A crown"], a:"An anchor"},
    {t:"mc", ref:"Hebrews 11:8", q:"Hebrews 11:8 says by faith Abraham obeyed and went out, not knowing what?", opts:["Where he was going","His own future wealth","His son's name","His final age"], a:"Where he was going"},
    {t:"mc", ref:"Hebrews 11:24-27", q:"Hebrews 11:24-27 says by faith Moses refused to be called Pharaoh's son, choosing instead to do what?", opts:["Suffer with God's people rather than enjoy Egypt's treasures","Rule Egypt righteously","Hide his identity forever","Return to Pharaoh's court later"], a:"Suffer with God's people rather than enjoy Egypt's treasures"},
    {t:"mc", ref:"Hebrews 12:11", q:"Hebrews 12:11 says discipline seems painful at the time but later yields what?", opts:["The peaceful fruit of righteousness","Immediate relief","Public honor","Nothing of lasting value"], a:"The peaceful fruit of righteousness"},
    {t:"mc", ref:"Hebrews 13:4", q:"Hebrews 13:4 says what institution should be honored among all, with the marriage bed kept undefiled?", opts:["Marriage","The priesthood","The Sabbath","The church"], a:"Marriage"},
    {t:"mc", ref:"Hebrews 5:12-14", q:"Hebrews 5:12-14 rebukes its readers for still needing what, instead of solid spiritual food?", opts:["Milk","Bread alone","Water alone","Honey"], a:"Milk"},
    {t:"mc", ref:"Hebrews 8:6", q:"Hebrews 8:6 says Christ mediates a better covenant, established on what?", opts:["Better promises","A stronger army","Greater wealth","A new Temple"], a:"Better promises"},
    {t:"mc", ref:"Hebrews 9:15", q:"Hebrews 9:15 says Christ is the mediator of a new covenant so that those called may receive what?", opts:["An eternal inheritance","Only earthly blessing","A new set of rules","Temporary forgiveness"], a:"An eternal inheritance"},
  ], hard: [
    {t:"fill", ref:"Hebrews 11:1", q:"\"Now faith is the assurance of things hoped for, the conviction of things not ___.\"", opts:["seen","known","certain","proven"], a:"seen"},
    {t:"fill", ref:"Hebrews 11:6", q:"\"And without ___ it is impossible to please him.\"", opts:["faith","works","prayer","obedience"], a:"faith"},
    {t:"mc", ref:"Hebrews 7:3", q:"Hebrews describes Melchizedek as a mysterious king-priest with no recorded what, unlike other priests?", opts:["Beginning or end (genealogy)","Wealth or land","Army or kingdom","Sacrifice or offering"], a:"Beginning or end (genealogy)"},
    {t:"mc", ref:"Hebrews 9:27", q:"What does Hebrews 9:27 say is appointed for every person, followed by judgment?", opts:["Death","Suffering","Old age","Testing"], a:"Death"},
    {t:"mc", ref:"Hebrews 13:2", q:"Hebrews 13:2 instructs hospitality to strangers, noting some who did so unknowingly entertained whom?", opts:["Angels","Prophets","Kings","Apostles"], a:"Angels"},
    {t:"mc", ref:"Hebrews 1:3", q:"Hebrews 1:3 describes Christ as the radiance of God's glory and the exact imprint of what?", opts:["His nature","His throne","His law","His Temple"], a:"His nature"},
    {t:"mc", ref:"Hebrews 9:11-14", q:"Hebrews 9:11-14 says Christ entered the greater, heavenly tent not made with hands, offering what once for all?", opts:["His own blood","A lamb without blemish","Incense and gold","The tablets of the law"], a:"His own blood"},
    {t:"mc", ref:"Hebrews 10:1", q:"Hebrews 10:1 says the law is only a shadow of the good things to come, not what?", opts:["The true form/substance itself","A permanent covenant","A source of comfort","A path to wisdom"], a:"The true form/substance itself"},
    {t:"mc", ref:"Hebrews 12:29", q:"Hebrews 12:29 closes a warning about reverent worship by declaring that our God is what?", opts:["\"A consuming fire\"","\"A gentle whisper\"","\"A distant king\"","\"A silent judge\""], a:"\"A consuming fire\""},
    {t:"mc", ref:"Hebrews 13:20-21", q:"Hebrews 13:20-21 closes with a benediction calling God the \"God of peace\" who brought back Jesus from the dead as what, through the eternal covenant?", opts:["The great Shepherd of the sheep","The final High Priest alone","The eternal King alone","The last sacrifice"], a:"The great Shepherd of the sheep"},
    {t:"mc", ref:"Hebrews 4:13", q:"Hebrews 4:13 says nothing is hidden from God's sight, but all things are what before his eyes?", opts:["Naked and exposed","Forgiven already","Written in a book","Judged instantly"], a:"Naked and exposed"},
    {t:"mc", ref:"Hebrews 6:4-6", q:"Hebrews 6:4-6 gives a severe warning about those who fall away after once tasting what?", opts:["The heavenly gift and the goodness of God's word","Only earthly wealth","A brief moment of doubt","Minor persecution"], a:"The heavenly gift and the goodness of God's word"},
  ]},
"1 Peter": { easy: [
    {t:"mc", ref:"1 Peter", q:"1 Peter was written to encourage believers facing what?", opts:["Suffering and persecution","Wealth and temptation","Famine","Civil war"], a:"Suffering and persecution"},
    {t:"fill", ref:"1 Peter 1:3", q:"\"...he has caused us to be born again to a living ___ through the resurrection of Jesus Christ from the dead.\"", opts:["hope","faith","promise","joy"], a:"hope"},
    {t:"fill", ref:"1 Peter 4:8", q:"\"Above all, keep loving one another earnestly, since love covers a multitude of ___.\"", opts:["sins","faults","wrongs","failures"], a:"sins"},
    {t:"mc", ref:"1 Peter 5:8", q:"1 Peter compares the devil to what predator, prowling and seeking someone to devour?", opts:["A roaring lion","A cunning serpent","A hunting wolf","A circling vulture"], a:"A roaring lion"},
    {t:"mc", ref:"1 Peter 1:1", q:"1 Peter was written to encourage believers scattered where, facing persecution?", opts:["Throughout the Roman provinces of Asia Minor","In Jerusalem alone","In Rome exclusively","Throughout Egypt"], a:"Throughout the Roman provinces of Asia Minor"},
    {t:"mc", ref:"1 Peter 1:6-7", q:"1 Peter 1:6-7 compares trials to a refining process for faith, like what precious metal tested by fire?", opts:["Gold","Silver","Bronze","Iron"], a:"Gold"},
    {t:"mc", ref:"1 Peter 1:8", q:"1 Peter 1:8 says believers love Christ and rejoice in him even though they have never done what?", opts:["Seen him","Heard his voice","Met an apostle","Read Scripture"], a:"Seen him"},
    {t:"mc", ref:"1 Peter 2:2", q:"1 Peter 2:2 tells believers to long for pure spiritual milk like whom?", opts:["Newborn infants","Wise elders","Trained soldiers","Skilled farmers"], a:"Newborn infants"},
    {t:"mc", ref:"1 Peter 2:21", q:"1 Peter 2:21 says Christ suffered for believers, leaving them what?", opts:["An example to follow in his steps","A written law to obey","A ritual to repeat","A prophecy to fulfill"], a:"An example to follow in his steps"},
    {t:"mc", ref:"1 Peter 3:8", q:"1 Peter 3:8 urges believers to have unity of mind, sympathy, brotherly love, and what kind of heart?", opts:["A tender heart","A fearless heart","A silent heart","A judging heart"], a:"A tender heart"},
    {t:"mc", ref:"1 Peter 5:6", q:"1 Peter 5:6 tells believers to humble themselves under God's mighty hand so that he may do what in due time?", opts:["Exalt them","Test them further","Forget their sin","Reward only the strong"], a:"Exalt them"},
    {t:"mc", ref:"1 Peter 4:12-13", q:"1 Peter 4:12-13 tells believers not to be surprised at fiery trials, but to rejoice because they share in what?", opts:["Christ's sufferings","A temporary trial only","Their own foolishness","An unrelated hardship"], a:"Christ's sufferings"},
  ], medium: [
    {t:"fill", ref:"1 Peter 5:7", q:"\"...casting all your anxieties on him, because he ___ for you.\"", opts:["cares","provides","watches","waits"], a:"cares"},
    {t:"fill", ref:"1 Peter 2:9", q:"\"But you are a chosen race, a royal priesthood, a holy nation, a people for his own ___...\"", opts:["possession","glory","kingdom","purpose"], a:"possession"},
    {t:"fill", ref:"1 Peter 5:8", q:"\"Be sober-minded; be watchful. Your adversary the devil prowls around like a roaring ___, seeking someone to devour.\"", opts:["lion","wolf","bear","serpent"], a:"lion"},
    {t:"mc", ref:"1 Peter 3:15", q:"1 Peter 3:15 instructs believers to always be ready to do what, regarding their hope in Christ?", opts:["Give a reasoned defense/answer to anyone who asks","Debate publicly with skeptics","Remain silent about their faith","Only answer religious leaders"], a:"Give a reasoned defense/answer to anyone who asks"},
    {t:"mc", ref:"1 Peter 3:1-7", q:"1 Peter 3 instructs wives and husbands about their relationship, emphasizing what quality especially for wives?", opts:["A gentle and quiet spirit","Public leadership","Financial independence","Silence in all matters"], a:"A gentle and quiet spirit"},
    {t:"mc", ref:"1 Peter 1:18-19", q:"1 Peter 1:18-19 says believers were ransomed not with silver or gold but with what?", opts:["The precious blood of Christ","Their own good works","A written promise","The prayers of the saints"], a:"The precious blood of Christ"},
    {t:"mc", ref:"1 Peter 2:24", q:"1 Peter 2:24 says Christ himself bore our sins in his body on the tree so that believers might do what?", opts:["Die to sin and live to righteousness","Escape all suffering","Become priests themselves","Return to the law"], a:"Die to sin and live to righteousness"},
    {t:"mc", ref:"1 Peter 4:10", q:"1 Peter 4:10 says each believer has received a gift to be used in serving others as what?", opts:["Good stewards of God's grace","Independent teachers","Silent observers","Paid professionals"], a:"Good stewards of God's grace"},
    {t:"mc", ref:"1 Peter 5:2-3", q:"1 Peter 5:2-3 instructs elders to shepherd God's flock not domineering over them but being what?", opts:["Examples to the flock","Distant rulers","Silent overseers","Financial managers"], a:"Examples to the flock"},
    {t:"mc", ref:"1 Peter 2:12", q:"1 Peter 2:12 tells believers to keep their conduct honorable among outsiders so that they may see good deeds and do what?", opts:["Glorify God","Join the church immediately","Stop persecuting them","Repay them financially"], a:"Glorify God"},
    {t:"mc", ref:"1 Peter 4:7", q:"1 Peter 4:7 says the end of all things is at hand, so believers should be self-controlled and sober-minded for what?", opts:["Prayers","Battle","Feasting","Silence"], a:"Prayers"},
    {t:"mc", ref:"1 Peter 1:15-16", q:"1 Peter 1:15-16 calls believers to be holy in all conduct, quoting the command \"be holy, for\" what?", opts:["\"I am holy\"","\"I am merciful\"","\"the day is near\"","\"you are chosen\""], a:"\"I am holy\""},
    {t:"mc", ref:"1 Peter 4:9", q:"1 Peter 4:9 instructs believers to show hospitality to one another in what manner?", opts:["Without grumbling","Only to relatives","With great expense","Once a year"], a:"Without grumbling"},
  ], hard: [
    {t:"mc", ref:"1 Peter 2", q:"1 Peter 2 describes believers collectively as what kind of priesthood?", opts:["A royal priesthood","A Levitical priesthood","A prophetic order","A kingly dynasty"], a:"A royal priesthood"},
    {t:"mc", ref:"1 Peter 3:15", q:"1 Peter 3:15 says believers should make their defense of the faith with what attitude?", opts:["Gentleness and respect","Force and confidence","Anger at unbelief","Silence and avoidance"], a:"Gentleness and respect"},
    {t:"mc", ref:"1 Peter 5:13", q:"1 Peter is traditionally understood to have been written from where, referred to symbolically as \"Babylon\"?", opts:["Rome","Jerusalem","Babylon itself","Ephesus"], a:"Rome"},
    {t:"mc", ref:"1 Peter 5:12", q:"Who is named as Peter's companion in writing this letter, mentioned at its end?", opts:["Silvanus (Silas)","Timothy","Mark","Barnabas"], a:"Silvanus (Silas)"},
    {t:"mc", ref:"1 Peter 2:6-7", q:"1 Peter 2 describes Jesus, using imagery from Isaiah, as what kind of stone rejected by builders?", opts:["A cornerstone (living stone)","A capstone only","A stumbling stone only","A foundation of sand"], a:"A cornerstone (living stone)"},
    {t:"mc", ref:"1 Peter 3:18-20", q:"1 Peter 3:18-20 describes Christ proclaiming a message to \"spirits in prison,\" connected to the days of whom?", opts:["Noah","Abraham","Moses","Elijah"], a:"Noah"},
    {t:"mc", ref:"1 Peter 3:21", q:"1 Peter 3:21 describes baptism not as a removal of dirt from the body but as what?", opts:["An appeal to God for a good conscience","A magical cleansing ritual","A requirement for church membership only","A symbol with no real meaning"], a:"An appeal to God for a good conscience"},
    {t:"mc", ref:"1 Peter 1:10-12", q:"1 Peter 1:10-12 says even what beings long to look into the things now announced in the gospel?", opts:["Angels","Kings","Demons","The dead"], a:"Angels"},
    {t:"mc", ref:"1 Peter 2:9", q:"1 Peter 2:9 says believers are a chosen people so that they may proclaim what, having been called out of darkness?", opts:["The excellencies of him who called them","Only their own testimony","The Roman law","A new set of commandments"], a:"The excellencies of him who called them"},
    {t:"mc", ref:"1 Peter 4:6", q:"1 Peter 4:6 makes the difficult statement that the gospel was preached even to whom, so they might live in the spirit?", opts:["Those who are dead","The Gentiles alone","The Roman soldiers","The false prophets"], a:"Those who are dead"},
  ]},
"2 Peter": { easy: [
    {t:"mc", ref:"2 Peter", q:"2 Peter warns believers about the danger of what?", opts:["False teachers","Foreign invasion","Famine","Persecution by Rome only"], a:"False teachers"},
    {t:"fill", ref:"2 Peter 1:3", q:"\"His divine power has granted to us all things that pertain to life and godliness, through the knowledge of him who called us to his own glory and ___.\"", opts:["excellence","mercy","truth","power"], a:"excellence"},
    {t:"fill", ref:"2 Peter 3:18", q:"\"But grow in the grace and knowledge of our Lord and Savior Jesus Christ. To him be the ___ both now and to the day of eternity.\"", opts:["glory","honor","praise","kingdom"], a:"glory"},
    {t:"mc", ref:"2 Peter 1:5-7", q:"2 Peter 1 urges believers to add to their faith a chain of virtues, starting with what quality?", opts:["Virtue/goodness","Wealth","Fame","Power"], a:"Virtue/goodness"},
    {t:"mc", ref:"2 Peter 1:1", q:"2 Peter 1:1 identifies its author as Simeon (Simon) Peter, describing himself as a servant and what?", opts:["Apostle of Jesus Christ","Elder of the church","Fellow prisoner","Deacon of Rome"], a:"Apostle of Jesus Christ"},
    {t:"mc", ref:"2 Peter 1:4", q:"2 Peter 1:4 says through God's promises believers may become \"partakers\" of what?", opts:["The divine nature","Eternal wealth","Angelic power","Priestly authority"], a:"The divine nature"},
    {t:"mc", ref:"2 Peter 1:19", q:"2 Peter 1:19 compares the prophetic word to what, shining in a dark place?", opts:["A lamp","The sun at noon","A fire on a hill","A star overhead"], a:"A lamp"},
    {t:"mc", ref:"2 Peter 2:5", q:"2 Peter 2:5 says God did not spare the ancient world but preserved whom, bringing a flood on the ungodly?", opts:["Noah","Abraham","Lot","Enoch"], a:"Noah"},
    {t:"mc", ref:"2 Peter 2:6", q:"2 Peter 2:6 says God condemned which two cities as an example of what is coming to the ungodly?", opts:["Sodom and Gomorrah","Nineveh and Tyre","Babylon and Nineveh","Jericho and Ai"], a:"Sodom and Gomorrah"},
    {t:"mc", ref:"2 Peter 3:13", q:"2 Peter 3:13 says believers wait for new heavens and a new earth where what dwells?", opts:["Righteousness","Peace alone","Gold and silver","The angels"], a:"Righteousness"},
    {t:"mc", ref:"2 Peter 1:14", q:"2 Peter 1:14 says Peter knows the \"putting off\" of his body is coming soon, as who made clear to him?", opts:["The Lord Jesus Christ","An angel","Paul","John"], a:"The Lord Jesus Christ"},
    {t:"mc", ref:"2 Peter 2:4", q:"2 Peter 2:4 says God did not spare the angels who sinned, but cast them into what?", opts:["Hell (Tartarus), held for judgment","Immediate destruction","A distant planet","Eternal silence"], a:"Hell (Tartarus), held for judgment"},
  ], medium: [
    {t:"mc", ref:"2 Peter 3", q:"2 Peter 3 addresses scoffers who doubt what future event?", opts:["Christ's return","The resurrection of Jesus","The Temple's rebuilding","Peter's death"], a:"Christ's return"},
    {t:"fill", ref:"2 Peter 3:10", q:"\"...the day of the Lord will come like a thief in the ___.\"", opts:["night","dark","end","last days"], a:"night"},
    {t:"fill", ref:"2 Peter 1:20", q:"\"...that no prophecy of Scripture comes from someone's own ___.\"", opts:["interpretation","desire","wisdom","authority"], a:"interpretation"},
    {t:"fill", ref:"2 Peter 3:9", q:"\"...but is patient toward you, not wishing that any should ___, but that all should reach repentance.\"", opts:["perish","fall","fail","stumble"], a:"perish"},
    {t:"mc", ref:"2 Peter 3:4", q:"What do the scoffers in the last days mockingly ask, doubting Christ's promised return?", opts:["\"Where is the promise of his coming?\"","\"Why has judgment not come sooner?\"","\"Who gave Peter this authority?\"","\"Has Christ already returned?\""], a:"\"Where is the promise of his coming?\""},
    {t:"mc", ref:"2 Peter 2", q:"2 Peter 2 compares false teachers to what, describing their destructive influence?", opts:["Irrational animals/beasts driven by instinct","Wolves in sheep's clothing only","Blind guides only","Thieves in the night"], a:"Irrational animals/beasts driven by instinct"},
    {t:"mc", ref:"2 Peter 2:1", q:"2 Peter 2:1 warns that false teachers will secretly bring in destructive heresies, even denying whom?", opts:["The Master who bought them","The apostles' authority","The Old Testament prophets","Their own congregations"], a:"The Master who bought them"},
    {t:"mc", ref:"2 Peter 2:9", q:"2 Peter 2:9 says the Lord knows how to rescue the godly from trials and to keep the unrighteous for what?", opts:["Punishment","A second chance","Exile","Silence"], a:"Punishment"},
    {t:"mc", ref:"2 Peter 2:22", q:"2 Peter 2:22 applies a proverb to false teachers returning to sin, comparing them to a dog that does what?", opts:["Returns to its own vomit","Chases its own tail","Barks at strangers","Buries its bone"], a:"Returns to its own vomit"},
    {t:"mc", ref:"2 Peter 3:5-6", q:"2 Peter 3:5-6 says the ancient world was destroyed by what, formed and later judged by God's word?", opts:["A flood of water","A great fire","A famine","An earthquake"], a:"A flood of water"},
    {t:"mc", ref:"2 Peter 3:16", q:"2 Peter 3:16 says Paul's letters contain some things hard to understand, which the \"untaught and unstable\" do what with?", opts:["Twist them to their own destruction","Ignore them completely","Correct them publicly","Burn them as heretical"], a:"Twist them to their own destruction"},
    {t:"mc", ref:"2 Peter 1:12-13", q:"2 Peter 1:12-13 says Peter feels it right to keep stirring up his readers' memory as long as he remains in what, meaning his body?", opts:["This tent","This exile","This trial","This ministry"], a:"This tent"},
    {t:"mc", ref:"2 Peter 1:16", q:"2 Peter 1:16 insists the apostles did not follow \"cleverly devised myths\" but were eyewitnesses of what?", opts:["Christ's majesty","The Old Testament prophets","Angelic visions alone","Roman history"], a:"Christ's majesty"},
  ], hard: [
    {t:"mc", ref:"2 Peter 1", q:"2 Peter 1 says prophecy did not come by human will but as men were carried along by whom?", opts:["The Holy Spirit","Angels","Kings","Priests"], a:"The Holy Spirit"},
    {t:"fill", ref:"2 Peter 3:8", q:"\"...that with the Lord one day is as a thousand years, and a ___ years as one day.\"", opts:["thousand","hundred","million","single"], a:"thousand"},
    {t:"mc", ref:"2 Peter 1:16-18", q:"2 Peter 1 describes Peter as an eyewitness to what event, cited to validate his authority?", opts:["The Transfiguration","The Resurrection","The Ascension","Pentecost"], a:"The Transfiguration"},
    {t:"mc", ref:"2 Peter 3:10", q:"2 Peter 3 describes the coming Day of the Lord using what dramatic image?", opts:["The heavens dissolved and the elements melted with fire","A great flood covering the earth again","A total eclipse of the sun","An army of angels descending"], a:"The heavens dissolved and the elements melted with fire"},
    {t:"mc", ref:"2 Peter 3:15-16", q:"2 Peter references another apostle's letters, admitting some parts are hard to understand. Whose letters are meant?", opts:["Paul's","James's","John's","Jude's"], a:"Paul's"},
    {t:"mc", ref:"2 Peter 2:15-16", q:"2 Peter 2:15-16 compares false teachers to Balaam, whose own what famously rebuked him?", opts:["Donkey","Servant","Son","Priest"], a:"Donkey"},
    {t:"mc", ref:"2 Peter 3:3", q:"2 Peter 3:3 warns that in the last days scoffers will come, following what?", opts:["Their own sinful desires","The apostles' teaching","A new prophet","Roman law"], a:"Their own sinful desires"},
    {t:"mc", ref:"2 Peter 3:12", q:"2 Peter 3:12 urges believers to be waiting for and \"hastening\" the coming of what?", opts:["The day of God","Peter's return","A new Temple","The final famine"], a:"The day of God"},
    {t:"mc", ref:"2 Peter 2:20-21", q:"2 Peter 2:20-21 warns that those who escape the world's corruption and then return to it become how?", opts:["Worse off than before","Exactly as they were","Immune to further sin","Automatically forgiven"], a:"Worse off than before"},
    {t:"mc", ref:"2 Peter 1:17-18", q:"2 Peter 1:17-18 recalls Peter personally hearing a voice from heaven declare \"This is my beloved Son\" during what event?", opts:["The Transfiguration","The baptism of Jesus","The Last Supper","The Ascension"], a:"The Transfiguration"},
    {t:"mc", ref:"2 Peter", q:"2 Peter's overall purpose combines a warning against moral corruption from false teachers with a defense of what doctrine that scoffers denied?", opts:["Christ's promised return (the Parousia)","The virgin birth","The Trinity","Baptism by immersion"], a:"Christ's promised return (the Parousia)"},
  ]},
"1 John": { easy: [
    {t:"order", ref:"1 John 4:8", verse:"God is love.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"1 John 1:9", q:"\"If we confess our sins, he is faithful and just to forgive us our sins and to cleanse us from all ___.\"", opts:["unrighteousness","wickedness","evil","sin alone"], a:"unrighteousness"},
    {t:"fill", ref:"1 John 4:19", q:"\"We love because he first ___ us.\"", opts:["loved","chose","saved","called"], a:"loved"},
    {t:"fill", ref:"1 John 3:16", q:"\"By this we know love, that he laid down his life for us, and we ought to lay down our lives for the ___.\"", opts:["brothers","lost","world","weak"], a:"brothers"},
    {t:"mc", ref:"1 John", q:"1 John repeatedly emphasizes love for one another and what else, against false teachers?", opts:["Right belief that Jesus came in the flesh","Strict dietary rules","Political loyalty to Rome","Financial generosity alone"], a:"Right belief that Jesus came in the flesh"},
    {t:"mc", ref:"1 John 1:5", q:"1 John 1:5 declares that God is light, and in him is what?", opts:["No darkness at all","A little darkness, but mostly light","A hidden darkness only he sees","Both light and darkness equally"], a:"No darkness at all"},
    {t:"mc", ref:"1 John 1:9", q:"1 John 1:9 promises that if we confess our sins, God is faithful and just to do what?", opts:["Forgive our sins and cleanse us","Delay judgment only","Remember them anyway","Forgive only the smallest sins"], a:"Forgive our sins and cleanse us"},
    {t:"mc", ref:"1 John 2:1", q:"1 John 2:1 says that if anyone sins, believers have an advocate with the Father, identified as whom?", opts:["Jesus Christ the righteous","The Holy Spirit alone","An unnamed angel","The apostle John"], a:"Jesus Christ the righteous"},

function bookHasType(book, type){
  const b = BANK[book];
  if(!b) return false;
  return ["easy","medium","hard"].some(d => (b[d]||[]).some(q=>q.t===type));
}

/* =========================================================
   SAVE STATE
   ========================================================= */
const SAVE_KEY = "scriptureQuestSave_v2";
function loadSave(){
  try{ const raw = localStorage.getItem(SAVE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return {stars:{}, xp:0, coins:0, streak:0, lastPlayDate:null};
}
function writeSave(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }
let save = loadSave();
function todayStr(){ return new Date().toISOString().slice(0,10); }
function bumpStreak(){
  const today = todayStr();
  if(save.lastPlayDate === today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yesterday = y.toISOString().slice(0,10);
  save.streak = (save.lastPlayDate === yesterday) ? save.streak+1 : 1;
  save.lastPlayDate = today; writeSave();
}
function refreshTopbar(){
  document.getElementById('streakVal').textContent = save.streak;
  document.getElementById('coinVal').textContent = save.coins;
  const level = Math.floor(save.xp/100)+1;
  document.getElementById('xpLevelVal').textContent = level;
  document.getElementById('xpFill').style.width = (save.xp%100)+'%';
}
refreshTopbar();
function starsToStr(n){ return n>0 ? "⭐".repeat(n) : ""; }
function saveKey(book,mode,diff){ return book+'||'+mode+'||'+diff; }

/* =========================================================
   STEP NAVIGATION
   ========================================================= */
let chosenBook=null, chosenMode=null, chosenDiff=null;
const screens = ['stepBook','stepMode','stepDiff','game','result'];
function showScreen(id){ screens.forEach(s=>document.getElementById(s).classList.toggle('hidden', s!==id)); }

const bookGrid = document.getElementById('bookGrid');
ALL_BOOKS.forEach(b=>{
  const btn = document.createElement('button');
  btn.className = 'book-chip';
  btn.textContent = b;
  const best = Object.keys(save.stars).filter(k=>k.startsWith(b+'||')).reduce((m,k)=>Math.max(m, save.stars[k]),0);
  if(best>0){ const s = document.createElement('span'); s.className='badge'; s.textContent = '⭐'+best; btn.appendChild(s); }
  btn.onclick = ()=> selectBook(b);
  bookGrid.appendChild(btn);
});
function selectBook(b){
  chosenBook = b;
  document.getElementById('modeBookLabel').textContent = b;
  document.getElementById('modeTrivia').classList.remove('disabled');
  document.getElementById('modeTrivia').disabled = false;
  const fillOk = bookHasType(b,'fill');
  const orderOk = bookHasType(b,'order');
  document.getElementById('modeFill').classList.toggle('disabled', !fillOk);
  document.getElementById('modeFill').disabled = !fillOk;
  document.getElementById('modeOrder').classList.toggle('disabled', !orderOk);
  document.getElementById('modeOrder').disabled = !orderOk;
  showScreen('stepMode');
}
document.getElementById('backToBook').onclick = ()=> showScreen('stepBook');

function selectMode(mode){
  chosenMode = mode;
  document.getElementById('diffLabel').textContent = `${chosenBook} · ${mode==='trivia'?'Trivia':mode==='fill'?'Fill in the Blank':'Verse Builder'}`;
  document.querySelectorAll('#diffChips .chip').forEach(c=>{
    c.classList.remove('selected');
    const d = c.dataset.diff;
    const st = save.stars[saveKey(chosenBook,mode,d)] || 0;
    let mini = c.querySelector('.mini-star'); if(mini) mini.remove();
    if(st>0){ const m=document.createElement('span'); m.className='mini-star'; m.textContent=starsToStr(st); c.appendChild(m); }
  });
  chosenDiff = null;
  document.getElementById('playBtn').disabled = true;
  document.getElementById('aiStatus').textContent = '';
  showScreen('stepDiff');
}
document.getElementById('modeTrivia').onclick = ()=>{ if(!document.getElementById('modeTrivia').disabled) selectMode('trivia'); };
document.getElementById('modeFill').onclick = ()=>{ if(!document.getElementById('modeFill').disabled) selectMode('fill'); };
document.getElementById('modeOrder').onclick = ()=>{ if(!document.getElementById('modeOrder').disabled) selectMode('order'); };
document.getElementById('backToMode').onclick = ()=> showScreen('stepMode');

document.querySelectorAll('#diffChips .chip').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('#diffChips .chip').forEach(c=>c.classList.remove('selected'));
    btn.classList.add('selected'); chosenDiff = btn.dataset.diff;
    document.getElementById('playBtn').disabled = false;
  };
});
document.getElementById('playBtn').onclick = async ()=>{ await beginLevel(); };

/* =========================================================
   GAMEPLAY ENGINE  (fully static question bank — no AI at play time)
   ========================================================= */
let quiz = [], idx = 0, lives = 3, combo = 0, correctCount = 0, coinsThisRound = 0, xpThisRound = 0;

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function matchesMode(q){ return q.t===chosenMode || (chosenMode==='trivia' && q.t==='mc'); }

function buildPool(){
  const book = BANK[chosenBook];
  if(!book) return [];
  let pool = (book[chosenDiff]||[]).filter(matchesMode).map(q=>({...q}));
  if(pool.length===0){
    // fall back to any difficulty for this book/mode if the chosen tier is thin
    ["easy","medium","hard"].forEach(d=>{ (book[d]||[]).forEach(q=>{ if(matchesMode(q)) pool.push({...q}); }); });
  }
  return pool;
}

async function beginLevel(){
  document.getElementById('aiStatus').textContent = '';
  let pool = buildPool();
  if(pool.length===0){
    document.getElementById('aiStatus').textContent = '⚠️ No questions available for this combination yet.';
    return;
  }
  shuffle(pool);
  quiz = pool.slice(0, Math.min(8, pool.length));
  idx=0; lives=3; combo=0; correctCount=0; coinsThisRound=0; xpThisRound=0;
  showScreen('game');
  renderQ();
}

function renderQ(){
  const q = quiz[idx];
  document.getElementById('progress').textContent = `Q${idx+1}/${quiz.length}`;
  document.getElementById('livesLive').textContent = '❤️'.repeat(Math.max(lives,0)) + '🖤'.repeat(3-Math.max(lives,0));
  document.getElementById('comboLine').textContent = combo>=2 ? `🔥 Combo x${combo}` : '';
  document.getElementById('qref').textContent = q.ref + (q.t==='fill' ? ' — fill in the blank' : '');
  document.getElementById('qtext').textContent = q.q;
  document.getElementById('feedback').textContent='';
  document.getElementById('nextBtn').classList.add('hidden');

  const mcArea = document.getElementById('mcArea');
  const orderArea = document.getElementById('orderArea');
  if(q.t === 'order'){
    mcArea.classList.add('hidden'); orderArea.classList.remove('hidden');
    renderOrderQ(q);
  } else {
    orderArea.classList.add('hidden'); mcArea.classList.remove('hidden');
    mcArea.innerHTML = '';
    shuffle([...q.opts]).forEach(o=>{
      const b = document.createElement('button');
      b.className='opt'; b.textContent=o;
      b.onclick=()=>answer(o===q.a, b, q);
      mcArea.appendChild(b);
    });
  }
}

let orderPlaced = [];
function renderOrderQ(q){
  const tokens = q.verse.split(' ').map((w,i)=>({w, id:i, used:false}));
  orderPlaced = [];
  function redraw(){
    const strip = document.getElementById('orderStrip');
    const bank = document.getElementById('orderBank');
    strip.innerHTML=''; bank.innerHTML='';
    orderPlaced.forEach(tok=>{
      const b = document.createElement('button'); b.className='tok placed'; b.textContent=tok.w;
      b.onclick=()=>{ orderPlaced = orderPlaced.filter(t=>t.id!==tok.id); tokens.find(t=>t.id===tok.id).used=false; redraw(); };
      strip.appendChild(b);
    });
    tokens.filter(t=>!t.used).forEach(tok=>{
      const b = document.createElement('button'); b.className='tok'; b.textContent=tok.w;
      b.onclick=()=>{ tok.used=true; orderPlaced.push(tok); redraw(); };
      bank.appendChild(b);
    });
    document.getElementById('orderCheckBtn').disabled = orderPlaced.length !== tokens.length;
  }
  shuffle(tokens);
  redraw();
  document.getElementById('orderCheckBtn').onclick = ()=>{
    const built = orderPlaced.map(t=>t.w).join(' ');
    answer(built === q.verse, null, q, built);
  };
}

function answer(correct, btnEl, q){
  document.querySelectorAll('#mcArea .opt').forEach(b=>{
    b.disabled = true;
    if(b.textContent===q.a) b.classList.add('right');
    else if(b===btnEl) b.classList.add('wrong');
  });
  document.querySelectorAll('#orderBank .tok, #orderStrip .tok').forEach(b=>b.disabled=true);
  document.getElementById('orderCheckBtn').disabled = true;
  registerResult(correct, q);
  if(correct){
    document.getElementById('feedback').textContent = combo>=2 ? `✅ Correct! 🔥 x${combo} combo` : '✅ Correct!';
  } else {
    document.getElementById('feedback').textContent = `❌ Correct: ${q.t==='order' ? q.verse : q.a}`;
  }
  document.getElementById('nextBtn').classList.remove('hidden');
}

function registerResult(correct, q){
  if(correct){
    combo++; correctCount++;
    const mult = 1 + Math.min(combo-1, 4)*0.25;
    coinsThisRound += Math.round(10*mult);
    xpThisRound += 5;
  } else {
    combo = 0; lives--;
  }
  document.getElementById('livesLive').textContent = '❤️'.repeat(Math.max(lives,0)) + '🖤'.repeat(3-Math.max(lives,0));
}

document.getElementById('nextBtn').onclick = ()=>{
  idx++;
  if(lives<=0){ finishLevel(false); }
  else if(idx>=quiz.length){ finishLevel(true); }
  else { renderQ(); }
};

function finishLevel(passed){
  showScreen('result');
  bumpStreak();
  let stars = 0;
  if(passed){
    const pct = correctCount/quiz.length;
    if(lives===3 && pct===1) stars = 3;
    else if(pct>=0.7) stars = 2;
    else stars = 1;
  }
  if(passed && stars>0){
    const key = saveKey(chosenBook, chosenMode, chosenDiff);
    save.stars[key] = Math.max(save.stars[key]||0, stars);
  }
  save.coins += coinsThisRound;
  save.xp += xpThisRound + (passed ? 20 : 0);
  writeSave();
  refreshTopbar();

  const emoji = !passed ? '💔' : stars===3 ? '👑' : stars===2 ? '🎉' : '🙂';
  const title = !passed ? 'Out of hearts — try again!' : stars===3 ? 'Perfect!' : stars===2 ? 'Well done!' : 'Level cleared!';
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultStars').textContent = passed ? (starsToStr(stars) || '⭐') : '';
  document.getElementById('finalScore').textContent = `${correctCount} / ${quiz.length} correct`;
  document.getElementById('coinsEarnedLine').textContent = `🪙 +${coinsThisRound}`;
  document.getElementById('xpEarnedLine').textContent = `✨ +${xpThisRound + (passed?20:0)} XP`;
  document.getElementById('resultSub').textContent = `${chosenBook} · ${chosenMode==='trivia'?'Trivia':chosenMode==='fill'?'Fill in the Blank':'Verse Builder'} · ${chosenDiff}`;
}
document.getElementById('playAgainBtn').onclick = ()=> beginLevel();
document.getElementById('chooseAnotherBtn').onclick = ()=> showScreen('stepBook');
</script>
