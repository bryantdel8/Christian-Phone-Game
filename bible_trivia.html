    {t:"mc", ref:"1 John 2:18-19", q:"1 John warns of \"antichrists.\" What characterizes them according to the letter?", opts:["They deny Jesus is the Christ and left the community","They openly worship Rome's emperor","They claim to be apostles of Paul","They refuse to eat meat offered to idols"], a:"They deny Jesus is the Christ and left the community"},
    {t:"mc", ref:"1 John 3:8", q:"1 John 3:8 says the reason the Son of God appeared was to do what regarding the devil's works?", opts:["Destroy them","Expose them publicly","Delay them","Study them"], a:"Destroy them"},
  ]},
"2 John": { easy: [
    {t:"mc", ref:"2 John", q:"2 John is written to which recipient?", opts:["An elect lady and her children","The church at Corinth","Timothy","The seven churches"], a:"An elect lady and her children"},
    {t:"fill", ref:"2 John 1:6", q:"\"And this is love, that we walk according to his ___.\"", opts:["commandments","truth","word","Spirit"], a:"commandments"},
  ], medium: [
    {t:"mc", ref:"2 John", q:"2 John, like 1 John, warns strongly against what?", opts:["Deceivers who deny Christ","Idle believers","Church leaders","Foreign nations"], a:"Deceivers who deny Christ"},
  ], hard: [
    {t:"mc", ref:"2 John", q:"2 John is one of the shortest books in the Bible, along with which other letter of John?", opts:["3 John","1 John","Jude","Philemon"], a:"3 John"},
  ]},
"3 John": { easy: [
    {t:"mc", ref:"3 John", q:"3 John is addressed to an individual named whom?", opts:["Gaius","Timothy","Titus","Philemon"], a:"Gaius"},
  ], medium: [
    {t:"mc", ref:"3 John", q:"3 John commends Gaius for showing hospitality to whom?", opts:["Traveling missionaries/brothers","Roman officials","Foreign kings","Widows only"], a:"Traveling missionaries/brothers"},
    {t:"fill", ref:"3 John 1:4", q:"\"I have no greater joy than to hear that my children are walking in the ___.\"", opts:["truth","faith","light","Spirit"], a:"truth"},
  ], hard: [
    {t:"mc", ref:"3 John", q:"3 John also criticizes a church leader named whom for his pride and unkindness?", opts:["Diotrephes","Demetrius","Onesimus","Sanballat"], a:"Diotrephes"},
  ]},
Jude: { easy: [
    {t:"mc", ref:"Jude", q:"Jude, a short letter, warns the church mainly about what?", opts:["False teachers who had crept in","Foreign invasion","Famine","Persecution by Rome"], a:"False teachers who had crept in"},
    {t:"fill", ref:"Jude 1:3", q:"\"...I found it necessary to write appealing to you to contend for the ___ that was once for all delivered to the saints.\"", opts:["faith","truth","gospel","hope"], a:"faith"},
  ], medium: [
    {t:"mc", ref:"Jude", q:"Jude identifies himself as a servant of Jesus Christ and brother of which other New Testament writer?", opts:["James","Peter","John","Paul"], a:"James"},
    {t:"mc", ref:"Jude 1:13", q:"Jude compares false teachers to several natural images, including waterless clouds and fruitless trees. What does he call unstable ones in the sky?", opts:["Wandering stars","Falling meteors","Dark moons","Hidden comets"], a:"Wandering stars"},
  ], hard: [
    {t:"mc", ref:"Jude", q:"Jude's letter ends with a well-known doxology praising God's ability to do what?", opts:["Keep believers from stumbling","Judge the nations","Rebuild the Temple","Defeat Rome"], a:"Keep believers from stumbling"},
    {t:"fill", ref:"Jude 1:24", q:"\"Now to him who is able to keep you from ___...\"", opts:["stumbling","falling away","sinning","doubting"], a:"stumbling"},
    {t:"fill", ref:"Jude 1:21", q:"\"...keep yourselves in the love of ___, waiting for the mercy of our Lord Jesus Christ that leads to eternal life.\"", opts:["God","Christ","the Spirit","the Father"], a:"God"},
    {t:"mc", ref:"Jude 1:9", q:"Jude references a dispute between the archangel Michael and the devil over whose body?", opts:["Moses'","Adam's","Elijah's","Enoch's"], a:"Moses'"},
  ]}
};
const ALL_BOOKS = ["Genesis","Exodus","Leviticus","Numbers","Deuteronomy","Joshua","Judges","Ruth","1 Samuel","2 Samuel","1 Kings","2 Kings","1 Chronicles","2 Chronicles","Ezra","Nehemiah","Esther","Job","Psalms","Proverbs","Ecclesiastes","Song of Solomon","Isaiah","Jeremiah","Lamentations","Ezekiel","Daniel","Hosea","Joel","Amos","Obadiah","Jonah","Micah","Nahum","Habakkuk","Zephaniah","Haggai","Zechariah","Malachi","Matthew","Mark","Luke","John","Acts","Romans","1 Corinthians","2 Corinthians","Galatians","Ephesians","Philippians","Colossians","1 Thessalonians","2 Thessalonians","1 Timothy","2 Timothy","Titus","Philemon","Hebrews","James","1 Peter","2 Peter","1 John","2 John","3 John","Jude","Revelation"];

function bookHasType(book, type){
  const b = BANK[book];
  if(!b) return false;
  return ["easy","medium","hard"].some(d => (b[d]||[]).some(q=>q.t===type));
}

/* =========================================================
   SAVE STATE
   ========================================================= */
const SAVE_KEY = "scriptureQuestSave_v2";
function loadSave(){
  try{ const raw = localStorage.getItem(SAVE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return {stars:{}, xp:0, coins:0, streak:0, lastPlayDate:null};
}
function writeSave(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }
let save = loadSave();
function todayStr(){ return new Date().toISOString().slice(0,10); }
function bumpStreak(){
  const today = todayStr();
  if(save.lastPlayDate === today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yesterday = y.toISOString().slice(0,10);
  save.streak = (save.lastPlayDate === yesterday) ? save.streak+1 : 1;
  save.lastPlayDate = today; writeSave();
}
function refreshTopbar(){
  document.getElementById('streakVal').textContent = save.streak;
  document.getElementById('coinVal').textContent = save.coins;
  const level = Math.floor(save.xp/100)+1;
  document.getElementById('xpLevelVal').textContent = level;
  document.getElementById('xpFill').style.width = (save.xp%100)+'%';
}
refreshTopbar();
function starsToStr(n){ return n>0 ? "⭐".repeat(n) : ""; }
function saveKey(book,mode,diff){ return book+'||'+mode+'||'+diff; }

/* =========================================================
   STEP NAVIGATION
   ========================================================= */
let chosenBook=null, chosenMode=null, chosenDiff=null;
const screens = ['stepBook','stepMode','stepDiff','game','result'];
function showScreen(id){ screens.forEach(s=>document.getElementById(s).classList.toggle('hidden', s!==id)); }

const bookGrid = document.getElementById('bookGrid');
ALL_BOOKS.forEach(b=>{
  const btn = document.createElement('button');
  btn.className = 'book-chip';
  btn.textContent = b;
  const best = Object.keys(save.stars).filter(k=>k.startsWith(b+'||')).reduce((m,k)=>Math.max(m, save.stars[k]),0);
  if(best>0){ const s = document.createElement('span'); s.className='badge'; s.textContent = '⭐'+best; btn.appendChild(s); }
  btn.onclick = ()=> selectBook(b);
  bookGrid.appendChild(btn);
});
function selectBook(b){
  chosenBook = b;
  document.getElementById('modeBookLabel').textContent = b;
  document.getElementById('modeTrivia').classList.remove('disabled');
  document.getElementById('modeTrivia').disabled = false;
  const fillOk = bookHasType(b,'fill');
  const orderOk = bookHasType(b,'order');
  document.getElementById('modeFill').classList.toggle('disabled', !fillOk);
  document.getElementById('modeFill').disabled = !fillOk;
  document.getElementById('modeOrder').classList.toggle('disabled', !orderOk);
  document.getElementById('modeOrder').disabled = !orderOk;
  showScreen('stepMode');
}
document.getElementById('backToBook').onclick = ()=> showScreen('stepBook');

function selectMode(mode){
  chosenMode = mode;
  document.getElementById('diffLabel').textContent = `${chosenBook} · ${mode==='trivia'?'Trivia':mode==='fill'?'Fill in the Blank':'Verse Builder'}`;
  document.querySelectorAll('#diffChips .chip').forEach(c=>{
    c.classList.remove('selected');
    const d = c.dataset.diff;
    const st = save.stars[saveKey(chosenBook,mode,d)] || 0;
    let mini = c.querySelector('.mini-star'); if(mini) mini.remove();
    if(st>0){ const m=document.createElement('span'); m.className='mini-star'; m.textContent=starsToStr(st); c.appendChild(m); }
  });
  chosenDiff = null;
  document.getElementById('playBtn').disabled = true;
  document.getElementById('aiStatus').textContent = '';
  showScreen('stepDiff');
}
document.getElementById('modeTrivia').onclick = ()=>{ if(!document.getElementById('modeTrivia').disabled) selectMode('trivia'); };
document.getElementById('modeFill').onclick = ()=>{ if(!document.getElementById('modeFill').disabled) selectMode('fill'); };
document.getElementById('modeOrder').onclick = ()=>{ if(!document.getElementById('modeOrder').disabled) selectMode('order'); };
document.getElementById('backToMode').onclick = ()=> showScreen('stepMode');

document.querySelectorAll('#diffChips .chip').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('#diffChips .chip').forEach(c=>c.classList.remove('selected'));
    btn.classList.add('selected'); chosenDiff = btn.dataset.diff;
    document.getElementById('playBtn').disabled = false;
  };
});
document.getElementById('playBtn').onclick = async ()=>{ await beginLevel(); };

/* =========================================================
   GAMEPLAY ENGINE  (fully static question bank — no AI at play time)
   ========================================================= */
let quiz = [], idx = 0, lives = 3, combo = 0, correctCount = 0, coinsThisRound = 0, xpThisRound = 0;

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function matchesMode(q){ return q.t===chosenMode || (chosenMode==='trivia' && q.t==='mc'); }

function buildPool(){
  const book = BANK[chosenBook];
  if(!book) return [];
  let pool = (book[chosenDiff]||[]).filter(matchesMode).map(q=>({...q}));
  if(pool.length===0){
    // fall back to any difficulty for this book/mode if the chosen tier is thin
    ["easy","medium","hard"].forEach(d=>{ (book[d]||[]).forEach(q=>{ if(matchesMode(q)) pool.push({...q}); }); });
  }
  return pool;
}

async function beginLevel(){
  document.getElementById('aiStatus').textContent = '';
  let pool = buildPool();
  if(pool.length===0){
    document.getElementById('aiStatus').textContent = '⚠️ No questions available for this combination yet.';
    return;
  }
  shuffle(pool);
  quiz = pool.slice(0, Math.min(8, pool.length));
  idx=0; lives=3; combo=0; correctCount=0; coinsThisRound=0; xpThisRound=0;
  showScreen('game');
  renderQ();
}

function renderQ(){
  const q = quiz[idx];
  document.getElementById('progress').textContent = `Q${idx+1}/${quiz.length}`;
  document.getElementById('livesLive').textContent = '❤️'.repeat(Math.max(lives,0)) + '🖤'.repeat(3-Math.max(lives,0));
  document.getElementById('comboLine').textContent = combo>=2 ? `🔥 Combo x${combo}` : '';
  document.getElementById('qref').textContent = q.ref + (q.t==='fill' ? ' — fill in the blank' : '');
  document.getElementById('qtext').textContent = q.q;
  document.getElementById('feedback').textContent='';
  document.getElementById('nextBtn').classList.add('hidden');

  const mcArea = document.getElementById('mcArea');
  const orderArea = document.getElementById('orderArea');
  if(q.t === 'order'){
    mcArea.classList.add('hidden'); orderArea.classList.remove('hidden');
    renderOrderQ(q);
  } else {
    orderArea.classList.add('hidden'); mcArea.classList.remove('hidden');
    mcArea.innerHTML = '';
    shuffle([...q.opts]).forEach(o=>{
      const b = document.createElement('button');
      b.className='opt'; b.textContent=o;
      b.onclick=()=>answer(o===q.a, b, q);
      mcArea.appendChild(b);
    });
  }
}

let orderPlaced = [];
function renderOrderQ(q){
  const tokens = q.verse.split(' ').map((w,i)=>({w, id:i, used:false}));
  orderPlaced = [];
  function redraw(){
    const strip = document.getElementById('orderStrip');
    const bank = document.getElementById('orderBank');
    strip.innerHTML=''; bank.innerHTML='';
    orderPlaced.forEach(tok=>{
      const b = document.createElement('button'); b.className='tok placed'; b.textContent=tok.w;
      b.onclick=()=>{ orderPlaced = orderPlaced.filter(t=>t.id!==tok.id); tokens.find(t=>t.id===tok.id).used=false; redraw(); };
      strip.appendChild(b);
    });
    tokens.filter(t=>!t.used).forEach(tok=>{
      const b = document.createElement('button'); b.className='tok'; b.textContent=tok.w;
      b.onclick=()=>{ tok.used=true; orderPlaced.push(tok); redraw(); };
      bank.appendChild(b);
    });
    document.getElementById('orderCheckBtn').disabled = orderPlaced.length !== tokens.length;
  }
  shuffle(tokens);
  redraw();
  document.getElementById('orderCheckBtn').onclick = ()=>{
    const built = orderPlaced.map(t=>t.w).join(' ');
    answer(built === q.verse, null, q, built);
  };
}

function answer(correct, btnEl, q){
  document.querySelectorAll('#mcArea .opt').forEach(b=>{
    b.disabled = true;
    if(b.textContent===q.a) b.classList.add('right');
    else if(b===btnEl) b.classList.add('wrong');
  });
  document.querySelectorAll('#orderBank .tok, #orderStrip .tok').forEach(b=>b.disabled=true);
  document.getElementById('orderCheckBtn').disabled = true;
  registerResult(correct, q);
  if(correct){
    document.getElementById('feedback').textContent = combo>=2 ? `✅ Correct! 🔥 x${combo} combo` : '✅ Correct!';
  } else {
    document.getElementById('feedback').textContent = `❌ Correct: ${q.t==='order' ? q.verse : q.a}`;
  }
  document.getElementById('nextBtn').classList.remove('hidden');
}

function registerResult(correct, q){
  if(correct){
    combo++; correctCount++;
    const mult = 1 + Math.min(combo-1, 4)*0.25;
    coinsThisRound += Math.round(10*mult);
    xpThisRound += 5;
  } else {
    combo = 0; lives--;
  }
  document.getElementById('livesLive').textContent = '❤️'.repeat(Math.max(lives,0)) + '🖤'.repeat(3-Math.max(lives,0));
}

document.getElementById('nextBtn').onclick = ()=>{
  idx++;
  if(lives<=0){ finishLevel(false); }
  else if(idx>=quiz.length){ finishLevel(true); }
  else { renderQ(); }
};

function finishLevel(passed){
  showScreen('result');
  bumpStreak();
  let stars = 0;
  if(passed){
    const pct = correctCount/quiz.length;
    if(lives===3 && pct===1) stars = 3;
    else if(pct>=0.7) stars = 2;
    else stars = 1;
  }
  if(passed && stars>0){
    const key = saveKey(chosenBook, chosenMode, chosenDiff);
    save.stars[key] = Math.max(save.stars[key]||0, stars);
  }
  save.coins += coinsThisRound;
  save.xp += xpThisRound + (passed ? 20 : 0);
  writeSave();
  refreshTopbar();

  const emoji = !passed ? '💔' : stars===3 ? '👑' : stars===2 ? '🎉' : '🙂';
  const title = !passed ? 'Out of hearts — try again!' : stars===3 ? 'Perfect!' : stars===2 ? 'Well done!' : 'Level cleared!';
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultStars').textContent = passed ? (starsToStr(stars) || '⭐') : '';
  document.getElementById('finalScore').textContent = `${correctCount} / ${quiz.length} correct`;
  document.getElementById('coinsEarnedLine').textContent = `🪙 +${coinsThisRound}`;
  document.getElementById('xpEarnedLine').textContent = `✨ +${xpThisRound + (passed?20:0)} XP`;
  document.getElementById('resultSub').textContent = `${chosenBook} · ${chosenMode==='trivia'?'Trivia':chosenMode==='fill'?'Fill in the Blank':'Verse Builder'} · ${chosenDiff}`;
}
document.getElementById('playAgainBtn').onclick = ()=> beginLevel();
document.getElementById('chooseAnotherBtn').onclick = ()=> showScreen('stepBook');
</script>
