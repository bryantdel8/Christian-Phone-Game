<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scripture Quest</title>
<style>
:root{
  --bg:#181330; --card:#241d47; --accent:#f2c94c; --accent2:#6fe0ab; --accent3:#ff8a65;
  --text:#f4f0ff; --sub:#a99bd6; --wrong:#ef5f6a; --right:#4bd08a; --line:#3a3266;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3efff; --card:#ffffff; --accent:#b8860b; --accent2:#1f9d63; --accent3:#e0672e;
    --text:#251f3d; --sub:#6b6190; --wrong:#c62f2f; --right:#1e8a4c; --line:#e0d9f7;
  }
}
:root[data-theme="dark"]{
  --bg:#181330; --card:#241d47; --accent:#f2c94c; --accent2:#6fe0ab; --accent3:#ff8a65;
  --text:#f4f0ff; --sub:#a99bd6; --wrong:#ef5f6a; --right:#4bd08a; --line:#3a3266;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:Georgia,'Times New Roman',serif; display:flex; justify-content:center;
  padding:14px; padding-top:calc(14px + env(safe-area-inset-top,0px)); padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
}
.wrap{width:100%; max-width:480px;}
h1{ text-align:center; font-size:1.5em; margin:2px 0 0; color:var(--accent); letter-spacing:0.5px;}
.sub{text-align:center; color:var(--sub); margin-bottom:10px; font-size:0.85em;}
.topbar{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  background:var(--card); border-radius:14px; padding:10px 14px; margin-bottom:12px;
  font-size:0.85em; box-shadow:0 4px 14px rgba(0,0,0,0.15);
}
.topbar .pill{display:flex; align-items:center; gap:4px; white-space:nowrap;}
.xpbar{flex:1; height:8px; background:var(--line); border-radius:6px; margin:0 8px; overflow:hidden;}
.xpbar-fill{height:100%; background:var(--accent2); border-radius:6px; transition:width .4s;}
.card{ background:var(--card); border-radius:16px; padding:18px; box-shadow:0 6px 20px rgba(0,0,0,0.18); margin-bottom:12px;}
.hidden{display:none !important;}
.backrow{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.backbtn{background:none; border:none; color:var(--sub); font-size:1.3em; cursor:pointer; padding:0 4px;}
.stepTitle{font-weight:bold; font-size:1.05em;}
.stepSub{color:var(--sub); font-size:0.82em; margin-top:-6px; margin-bottom:10px;}
.book-grid{display:flex; flex-wrap:wrap; gap:8px; max-height:52vh; overflow-y:auto; padding-bottom:2px;}
.book-chip{
  padding:10px 14px; border-radius:14px; border:1.5px solid var(--line); background:transparent;
  color:var(--text); cursor:pointer; font-size:0.9em; font-family:inherit; position:relative;
}
.book-chip .badge{position:absolute; top:-8px; right:-4px; font-size:0.65em; background:var(--accent); color:#221a08; border-radius:8px; padding:1px 5px; font-weight:bold;}
.mode-card{
  display:flex; align-items:center; gap:14px; padding:16px; border-radius:14px; border:2px solid var(--line);
  background:transparent; color:var(--text); cursor:pointer; width:100%; text-align:left; margin-bottom:10px; font-family:inherit;
}
.mode-card .em{font-size:1.8em;}
.mode-card .mname{font-weight:bold; font-size:1.02em;}
.mode-card .mdesc{color:var(--sub); font-size:0.8em; margin-top:2px;}
.mode-card:disabled, .mode-card.disabled{opacity:0.4; cursor:default;}
.chip-row{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0;}
.chip{ padding:10px 16px; border-radius:20px; border:1.5px solid var(--sub); background:transparent; color:var(--text); cursor:pointer; font-size:0.92em; font-family:inherit; position:relative;}
.chip.selected{background:var(--accent); border-color:var(--accent); color:#221a08; font-weight:bold;}
.chip .mini-star{display:block; font-size:0.7em; margin-top:2px;}
button.primary{ width:100%; padding:14px; border-radius:12px; border:none; background:var(--accent2); color:#0e2418; font-weight:bold; font-size:1.02em; cursor:pointer; margin-top:8px;}
button.primary:disabled{opacity:0.5;}
label.toggle{display:flex; align-items:center; gap:8px; font-size:0.85em; color:var(--sub); margin-top:12px; cursor:pointer;}
.hud{display:flex; justify-content:space-between; align-items:center; color:var(--sub); font-size:0.85em; margin-bottom:8px;}
.combo{color:var(--accent); font-weight:bold; font-size:0.85em; min-height:18px; margin-bottom:4px;}
.qref{color:var(--accent); font-size:0.82em; margin-bottom:6px;}
.qtext{font-size:1.12em; margin-bottom:14px; line-height:1.4;}
.opt{ display:block; width:100%; text-align:left; padding:12px 14px; margin-bottom:8px; border-radius:10px; border:1.5px solid var(--sub); background:transparent; color:var(--text); font-family:inherit; font-size:1em; cursor:pointer;}
.opt.right{background:var(--right); border-color:var(--right); color:#0e2418; font-weight:bold;}
.opt.wrong{background:var(--wrong); border-color:var(--wrong); color:#2b0e0e; font-weight:bold;}
.opt:disabled{cursor:default;}
.feedback{min-height:20px; font-size:0.9em; margin-bottom:6px; color:var(--sub);}
.order-strip{min-height:52px; border:2px dashed var(--sub); border-radius:10px; padding:8px; display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
.order-bank{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
.tok{padding:8px 12px; border-radius:8px; background:var(--line); color:var(--text); cursor:pointer; font-size:0.95em; border:none; font-family:inherit;}
.tok.placed{background:var(--accent); color:#221a08;}
.tok:disabled{opacity:0.4; cursor:default;}
.big-emoji{font-size:2.4em; text-align:center; margin-bottom:6px;}
.result{text-align:center;}
.result .stars-big{font-size:2em; margin:8px 0;}
.result .score{font-size:1.7em; color:var(--accent); margin:6px 0;}
.result .rewards{display:flex; justify-content:center; gap:18px; color:var(--sub); font-size:0.95em; margin:10px 0;}
footer{text-align:center; color:var(--sub); font-size:0.72em; margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>📖 Scripture Quest</h1>
  <div class="sub">Bible knowledge · ESV reference</div>

  <div class="topbar">
    <div class="pill">🔥 <span id="streakVal">0</span></div>
    <div class="pill">Lv <span id="xpLevelVal">1</span></div>
    <div class="xpbar"><div class="xpbar-fill" id="xpFill" style="width:0%"></div></div>
    <div class="pill">🪙 <span id="coinVal">0</span></div>
  </div>

  <div id="stepBook" class="card">
    <div class="stepTitle">1. Choose a book</div>
    <div class="stepSub">All 66 books, every mode — hand-written questions, no AI at play time.</div>
    <div class="book-grid" id="bookGrid"></div>
  </div>

  <div id="stepMode" class="card hidden">
    <div class="backrow"><button class="backbtn" id="backToBook">←</button><div class="stepTitle" id="modeBookLabel"></div></div>
    <div class="stepSub">2. Choose a game mode</div>
    <button class="mode-card" id="modeTrivia">
      <span class="em">🧠</span>
      <span><span class="mname">Trivia Challenge</span><br><span class="mdesc">Multiple-choice questions about people, places &amp; events</span></span>
    </button>
    <button class="mode-card" id="modeFill">
      <span class="em">✏️</span>
      <span><span class="mname">Fill in the Blank</span><br><span class="mdesc">Complete the missing word in real ESV verses</span></span>
    </button>
    <button class="mode-card" id="modeOrder">
      <span class="em">🧩</span>
      <span><span class="mname">Verse Builder</span><br><span class="mdesc">Tap words into place to rebuild a verse</span></span>
    </button>
  </div>

  <div id="stepDiff" class="card hidden">
    <div class="backrow"><button class="backbtn" id="backToMode">←</button><div class="stepTitle" id="diffLabel"></div></div>
    <div class="stepSub">3. Choose difficulty</div>
    <div class="chip-row" id="diffChips">
      <button class="chip" data-diff="easy">Easy</button>
      <button class="chip" data-diff="medium">Medium</button>
      <button class="chip" data-diff="hard">Hard</button>
    </div>
    <div id="aiStatus" style="font-size:0.78em;color:var(--sub);margin-top:4px;min-height:16px;"></div>
    <button class="primary" id="playBtn" disabled>Play</button>
  </div>

  <div id="game" class="card hidden">
    <div class="hud">
      <span id="progress">Q1/8</span>
      <span id="livesLive">❤️❤️❤️</span>
    </div>
    <div class="combo" id="comboLine"></div>
    <div class="qref" id="qref"></div>
    <div class="qtext" id="qtext"></div>
    <div id="mcArea"></div>
    <div id="orderArea" class="hidden">
      <div class="order-strip" id="orderStrip"></div>
      <div class="order-bank" id="orderBank"></div>
      <button class="primary" id="orderCheckBtn" disabled>Check</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="primary hidden" id="nextBtn">Next →</button>
  </div>

  <div id="result" class="card result hidden">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <div id="resultTitle" style="font-size:1.2em;font-weight:bold;"></div>
    <div class="stars-big" id="resultStars"></div>
    <div class="score" id="finalScore"></div>
    <div class="rewards"><span id="coinsEarnedLine"></span><span id="xpEarnedLine"></span></div>
    <div id="resultSub" style="color:var(--sub);font-size:0.85em;"></div>
    <button class="primary" id="playAgainBtn">Play Again</button>
    <button class="primary" id="chooseAnotherBtn" style="background:transparent;border:1.5px solid var(--sub);color:var(--text);">Choose Another</button>
  </div>

  <footer>Text references from the ESV (English Standard Version)</footer>
</div>

<script>
/* =========================================================
   QUESTION BANK  (t: mc | fill | order) — hand-checked, ESV-referenced
   ========================================================= */
const BANK = {
Genesis: { easy: [
    {t:"mc", ref:"Genesis 1:1", q:"\"In the beginning, God created the ___ and the earth.\"", opts:["heavens","stars","waters","light"], a:"heavens"},
    {t:"mc", ref:"Genesis 3", q:"What fruit is commonly associated with the tree in Eden, though not named in the text?", opts:["Apple","Fig","Pomegranate","Grape"], a:"Apple"},
    {t:"mc", ref:"Genesis 6-9", q:"Who built the ark?", opts:["Noah","Abraham","Moses","Enoch"], a:"Noah"},
    {t:"order", ref:"Genesis 1:3", verse:"And God said, \"Let there be light,\" and there was light.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Genesis 1:27", q:"\"...in the image of God he created him; male and ___ he created them.\"", opts:["female","man","woman","spirit"], a:"female"},
    {t:"fill", ref:"Genesis 2:7", q:"\"...and the man became a living ___.\"", opts:["creature","soul","spirit","being"], a:"creature"},
    {t:"mc", ref:"Genesis 2:21-22", q:"What did God use to form the first woman?", opts:["One of Adam's ribs","Dust from the ground","Clay","A bone from Adam's foot"], a:"One of Adam's ribs"},
    {t:"mc", ref:"Genesis 2:9,17", q:"What were the two special trees in the Garden of Eden?", opts:["Tree of Life and Tree of the Knowledge of Good and Evil","Tree of Wisdom and Tree of Death","Tree of Eden and Tree of Adam","Tree of Fruit and Tree of Thorns"], a:"Tree of Life and Tree of the Knowledge of Good and Evil"},
    {t:"mc", ref:"Genesis 3:21", q:"What did God make for Adam and Eve to wear after they sinned?", opts:["Garments of skin","Fig leaves","Linen robes","Nothing"], a:"Garments of skin"},
    {t:"mc", ref:"Genesis 4:2", q:"What was Cain's occupation?", opts:["Tiller of the ground (farmer)","Shepherd","Fisherman","Builder"], a:"Tiller of the ground (farmer)"},
    {t:"mc", ref:"Genesis 7:13,2 Peter 2:5", q:"How many people were saved on Noah's ark?", opts:["8","4","6","10"], a:"8"},
    {t:"mc", ref:"Genesis 9:13", q:"What sign did God give Noah as a promise never to flood the earth again?", opts:["A rainbow","A dove","An olive branch","A star"], a:"A rainbow"},
    {t:"fill", ref:"Genesis 9:13", q:"\"I have set my ___ in the cloud, and it shall be a sign of the covenant...\"", opts:["bow","rainbow","light","promise"], a:"bow"},
    {t:"mc", ref:"Genesis 11:4", q:"Genesis 11 says the people wanted to build a tower reaching where?", opts:["To the heavens","Under the sea","To the moon","Into the desert"], a:"To the heavens"},
    {t:"mc", ref:"Genesis 12:1", q:"God called Abram to leave his home and go to which land?", opts:["Canaan","Egypt","Babylon","Moab"], a:"Canaan"},
    {t:"order", ref:"Genesis 15:6", verse:"And he believed the LORD, and he counted it to him as righteousness.", q:"Arrange the verse in order:"},
  ], medium: [
    {t:"mc", ref:"Genesis 4:8", q:"Who did Cain kill?", opts:["Abel","Seth","Enoch","Lamech"], a:"Abel"},
    {t:"mc", ref:"Genesis 11:1-9", q:"What structure did people build that God confused their language over?", opts:["Tower of Babel","Ark","Temple","Ziggurat of Ur"], a:"Tower of Babel"},
    {t:"mc", ref:"Genesis 22", q:"Whom did God ask Abraham to sacrifice?", opts:["Isaac","Ishmael","Jacob","Esau"], a:"Isaac"},
    {t:"mc", ref:"Genesis 11:31", q:"What was Abram's original hometown before he journeyed to Canaan?", opts:["Ur of the Chaldeans","Haran","Bethel","Nineveh"], a:"Ur of the Chaldeans"},
    {t:"mc", ref:"Genesis 16:15", q:"Who was the mother of Ishmael?", opts:["Hagar","Sarah","Rebekah","Leah"], a:"Hagar"},
    {t:"mc", ref:"Genesis 19:26", q:"What happened to Lot's wife when she looked back at the destruction of Sodom?", opts:["She turned into a pillar of salt","She was struck blind","She died instantly","She turned to stone"], a:"She turned into a pillar of salt"},
    {t:"mc", ref:"Genesis 21:1-3", q:"What was the name of Abraham and Sarah's son, born to them in their old age?", opts:["Isaac","Ishmael","Jacob","Esau"], a:"Isaac"},
    {t:"mc", ref:"Genesis 24", q:"Who was chosen as Isaac's wife after Abraham's servant found her at a well?", opts:["Rebekah","Rachel","Leah","Tamar"], a:"Rebekah"},
    {t:"mc", ref:"Genesis 25:29-34", q:"Esau sold his birthright to Jacob for what?", opts:["A bowl of stew","A tent","Silver coins","Livestock"], a:"A bowl of stew"},
    {t:"mc", ref:"Genesis 27", q:"Whose blessing did Jacob receive by disguising himself as his brother Esau?", opts:["Isaac's","Abraham's","Laban's","God's audible blessing"], a:"Isaac's"},
    {t:"mc", ref:"Genesis 29", q:"Jacob worked seven years for Laban to marry Rachel, but was tricked into marrying which sister first?", opts:["Leah","Dinah","Tamar","Zilpah"], a:"Leah"},
    {t:"mc", ref:"Genesis 37:31", q:"What did Joseph's brothers do to his special robe before selling him into slavery?", opts:["Dipped it in goat's blood","Burned it","Gave it to Reuben","Sold it separately"], a:"Dipped it in goat's blood"},
    {t:"mc", ref:"Genesis 39", q:"Who falsely accused Joseph in Egypt, leading to his imprisonment?", opts:["Potiphar's wife","Pharaoh","The cupbearer","The baker"], a:"Potiphar's wife"},
    {t:"fill", ref:"Genesis 17:5", q:"\"...your name shall be Abraham, for I have made you the father of a multitude of ___.\"", opts:["nations","peoples","kings","tribes"], a:"nations"},
    {t:"fill", ref:"Genesis 2:24", q:"\"...and hold fast to his wife, and they shall become one ___.\"", opts:["flesh","body","spirit","people"], a:"flesh"},
  ], hard: [
    {t:"mc", ref:"Genesis 37", q:"How many brothers did Joseph have (not counting himself)?", opts:["11","10","12","9"], a:"11"},
    {t:"mc", ref:"Genesis 32:28", q:"What new name was Jacob given after wrestling with God?", opts:["Israel","Judah","Levi","Ephraim"], a:"Israel"},
    {t:"mc", ref:"Genesis 41", q:"What position did Pharaoh give Joseph after he interpreted his dreams?", opts:["Ruler over all Egypt","High Priest","Chief cupbearer","General of the army"], a:"Ruler over all Egypt"},
    {t:"mc", ref:"Genesis 14:18-20", q:"Who was the mysterious king and priest of Salem who blessed Abram?", opts:["Melchizedek","Abimelech","Chedorlaomer","Lot"], a:"Melchizedek"},
    {t:"mc", ref:"Genesis 18:22-33", q:"Who negotiated with God, asking Him to spare Sodom for the sake of a few righteous people?", opts:["Abraham","Lot","Isaac","Moses"], a:"Abraham"},
    {t:"mc", ref:"Genesis 29:34", q:"Which of Jacob's sons became the ancestor of the priestly line (Levites)?", opts:["Levi","Judah","Reuben","Simeon"], a:"Levi"},
    {t:"mc", ref:"Genesis 38", q:"Judah's daughter-in-law Tamar bore him twin sons. What were their names?", opts:["Perez and Zerah","Ephraim and Manasseh","Er and Onan","Ham and Shem"], a:"Perez and Zerah"},
    {t:"mc", ref:"Genesis 40", q:"Before interpreting Pharaoh's dreams, whose dreams did Joseph interpret in prison?", opts:["The cupbearer's and the baker's","Two guards'","Pharaoh's sons'","The chief steward's"], a:"The cupbearer's and the baker's"},
    {t:"mc", ref:"Genesis 41:1-7", q:"Pharaoh's dream featured seven plump cows and seven lean cows, plus seven full heads of grain and seven what?", opts:["Withered, thin heads of grain","Locusts","Empty jars","Dead fish"], a:"Withered, thin heads of grain"},
    {t:"mc", ref:"Genesis 48:13-20", q:"Jacob blessed Joseph's two sons, giving the greater blessing to the younger over the older. Name them in birth order.", opts:["Manasseh (older), then Ephraim (younger)","Ephraim (older), then Manasseh (younger)","Reuben, then Simeon","Levi, then Judah"], a:"Manasseh (older), then Ephraim (younger)"},
    {t:"mc", ref:"Genesis 49:10", q:"On his deathbed, Jacob prophesied that the ruling scepter would belong to which son?", opts:["Judah","Reuben","Joseph","Benjamin"], a:"Judah"},
    {t:"mc", ref:"Genesis 23", q:"Abraham purchased a burial cave for Sarah at which location?", opts:["The cave of Machpelah","Mount Moriah","Bethel","Hebron's tower"], a:"The cave of Machpelah"},
    {t:"fill", ref:"Genesis 50:20", q:"\"...you meant evil against me, but God meant it for ___...\"", opts:["good","peace","life","mercy"], a:"good"},
    {t:"order", ref:"Genesis 18:14", verse:"Is anything too hard for the LORD?", q:"Arrange the verse in order:"},
  ]},
Exodus: { easy: [
    {t:"mc", ref:"Exodus 2", q:"As a baby, Moses was found floating in a basket on which river?", opts:["Nile","Jordan","Euphrates","Tigris"], a:"Nile"},
    {t:"mc", ref:"Exodus 3", q:"What was burning but not consumed when God spoke to Moses?", opts:["A bush","A tree","An altar","A lamp"], a:"A bush"},
    {t:"mc", ref:"Exodus 20", q:"How many commandments did God give at Sinai?", opts:["10","7","12","5"], a:"10"},
    {t:"mc", ref:"Exodus 2", q:"Who was Moses' sister, who watched over the basket and later led a song of praise after the Red Sea crossing?", opts:["Miriam","Zipporah","Jochebed","Deborah"], a:"Miriam"},
    {t:"mc", ref:"Exodus 2:21", q:"What was the name of Moses' wife?", opts:["Zipporah","Miriam","Rebekah","Rahab"], a:"Zipporah"},
    {t:"mc", ref:"Exodus 3:14", q:"What did God call Himself when Moses asked His name at the burning bush?", opts:["\"I AM WHO I AM\"","\"The Almighty\"","\"El Shaddai\"","\"Adonai\""], a:"\"I AM WHO I AM\""},
    {t:"mc", ref:"Exodus 7:20", q:"What happened to the Nile River in the first plague?", opts:["It turned to blood","It dried up completely","It flooded the land","It froze"], a:"It turned to blood"},
    {t:"mc", ref:"Exodus 11-12", q:"What was the last and most devastating of the ten plagues?", opts:["The death of the firstborn","Total darkness","Locusts","Hail"], a:"The death of the firstborn"},
    {t:"mc", ref:"Exodus 12:7", q:"What were the Israelites told to put on their doorposts so the plague of death would pass over their homes?", opts:["The blood of a lamb","Oil","Ashes","A written blessing"], a:"The blood of a lamb"},
    {t:"fill", ref:"Exodus 20:12", q:"\"Honor your father and your ___, that your days may be long in the land...\"", opts:["mother","family","household","people"], a:"mother"},
    {t:"order", ref:"Exodus 20:13", verse:"You shall not murder.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Exodus 13:21", q:"\"...and by night in a pillar of ___ to give them light.\"", opts:["fire","cloud","smoke","light"], a:"fire"},
    {t:"mc", ref:"Exodus 32", q:"Who made the golden calf while Moses was up on Mount Sinai?", opts:["Aaron","Joshua","Hur","Nadab"], a:"Aaron"},
    {t:"mc", ref:"Exodus 24:18,34:28", q:"How many days did Moses stay on Mount Sinai receiving the Ten Commandments?", opts:["40","7","3","70"], a:"40"},
  ], medium: [
    {t:"mc", ref:"Exodus 7-12", q:"How many plagues struck Egypt?", opts:["10","7","12","9"], a:"10"},
    {t:"mc", ref:"Exodus 14", q:"What body of water did Israel cross on dry ground?", opts:["Red Sea","Jordan River","Sea of Galilee","Dead Sea"], a:"Red Sea"},
    {t:"mc", ref:"Exodus 16", q:"What bread-like food did God provide daily in the wilderness?", opts:["Manna","Quail","Barley loaves","Honeycomb"], a:"Manna"},
    {t:"order", ref:"Exodus 20:3", verse:"You shall have no other gods before me.", q:"Arrange the verse in order:"},
    {t:"mc", ref:"Exodus 15:23-25", q:"At Marah, God made bitter water sweet for the Israelites by having Moses do what?", opts:["Cast a piece of wood into the water","Strike the water with his staff","Pray over it for seven days","Pour salt into it"], a:"Cast a piece of wood into the water"},
    {t:"mc", ref:"Exodus 17:6", q:"Where did water come from when Moses struck a rock with his staff at Horeb?", opts:["Out of the rock itself","A hidden spring nearby","Rain sent by God","A river redirected by angels"], a:"Out of the rock itself"},
    {t:"mc", ref:"Exodus 18", q:"Who advised Moses to appoint other judges to help him lead the people?", opts:["Jethro, his father-in-law","Aaron, his brother","Joshua, his aide","Caleb"], a:"Jethro, his father-in-law"},
    {t:"mc", ref:"Exodus 25:10-22", q:"What was the name of the sacred gold-covered chest that held the Ten Commandment tablets?", opts:["The Ark of the Covenant","The Mercy Chest","The Tabernacle Box","The Sinai Ark"], a:"The Ark of the Covenant"},
    {t:"mc", ref:"Exodus 31:1-6", q:"Which two skilled craftsmen were filled with God's Spirit to build the tabernacle?", opts:["Bezalel and Oholiab","Aaron and Hur","Caleb and Joshua","Nadab and Abihu"], a:"Bezalel and Oholiab"},
    {t:"mc", ref:"Exodus 40:34-35", q:"What covered the tabernacle once it was completed, showing God's presence?", opts:["A cloud (the glory of the LORD)","A rainbow","A pillar of fire only","A flock of doves"], a:"A cloud (the glory of the LORD)"},
    {t:"mc", ref:"Exodus 25:31-40", q:"What object gave light inside the tabernacle's Holy Place?", opts:["The golden lampstand","Torches on the walls","Oil lanterns at the door","A pillar of fire"], a:"The golden lampstand"},
    {t:"mc", ref:"Exodus 25:30", q:"What kind of bread was kept on a table in the tabernacle's Holy Place?", opts:["The bread of the Presence (showbread)","Unleavened Passover bread","Manna cakes","Barley loaves"], a:"The bread of the Presence (showbread)"},
    {t:"fill", ref:"Exodus 16:4", q:"\"...I am about to rain ___ from heaven for you.\"", opts:["bread","manna","food","water"], a:"bread"},

function bookHasType(book, type){
  const b = BANK[book];
  if(!b) return false;
  return ["easy","medium","hard"].some(d => (b[d]||[]).some(q=>q.t===type));
}

/* =========================================================
   SAVE STATE
   ========================================================= */
const SAVE_KEY = "scriptureQuestSave_v2";
function loadSave(){
  try{ const raw = localStorage.getItem(SAVE_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return {stars:{}, xp:0, coins:0, streak:0, lastPlayDate:null};
}
function writeSave(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }
let save = loadSave();
function todayStr(){ return new Date().toISOString().slice(0,10); }
function bumpStreak(){
  const today = todayStr();
  if(save.lastPlayDate === today) return;
  const y = new Date(); y.setDate(y.getDate()-1);
  const yesterday = y.toISOString().slice(0,10);
  save.streak = (save.lastPlayDate === yesterday) ? save.streak+1 : 1;
  save.lastPlayDate = today; writeSave();
}
function refreshTopbar(){
  document.getElementById('streakVal').textContent = save.streak;
  document.getElementById('coinVal').textContent = save.coins;
  const level = Math.floor(save.xp/100)+1;
  document.getElementById('xpLevelVal').textContent = level;
  document.getElementById('xpFill').style.width = (save.xp%100)+'%';
}
refreshTopbar();
function starsToStr(n){ return n>0 ? "⭐".repeat(n) : ""; }
function saveKey(book,mode,diff){ return book+'||'+mode+'||'+diff; }

/* =========================================================
   STEP NAVIGATION
   ========================================================= */
let chosenBook=null, chosenMode=null, chosenDiff=null;
const screens = ['stepBook','stepMode','stepDiff','game','result'];
function showScreen(id){ screens.forEach(s=>document.getElementById(s).classList.toggle('hidden', s!==id)); }

const bookGrid = document.getElementById('bookGrid');
ALL_BOOKS.forEach(b=>{
  const btn = document.createElement('button');
  btn.className = 'book-chip';
  btn.textContent = b;
  const best = Object.keys(save.stars).filter(k=>k.startsWith(b+'||')).reduce((m,k)=>Math.max(m, save.stars[k]),0);
  if(best>0){ const s = document.createElement('span'); s.className='badge'; s.textContent = '⭐'+best; btn.appendChild(s); }
  btn.onclick = ()=> selectBook(b);
  bookGrid.appendChild(btn);
});
function selectBook(b){
  chosenBook = b;
  document.getElementById('modeBookLabel').textContent = b;
  document.getElementById('modeTrivia').classList.remove('disabled');
  document.getElementById('modeTrivia').disabled = false;
  const fillOk = bookHasType(b,'fill');
  const orderOk = bookHasType(b,'order');
  document.getElementById('modeFill').classList.toggle('disabled', !fillOk);
  document.getElementById('modeFill').disabled = !fillOk;
  document.getElementById('modeOrder').classList.toggle('disabled', !orderOk);
  document.getElementById('modeOrder').disabled = !orderOk;
  showScreen('stepMode');
}
document.getElementById('backToBook').onclick = ()=> showScreen('stepBook');

function selectMode(mode){
  chosenMode = mode;
  document.getElementById('diffLabel').textContent = `${chosenBook} · ${mode==='trivia'?'Trivia':mode==='fill'?'Fill in the Blank':'Verse Builder'}`;
  document.querySelectorAll('#diffChips .chip').forEach(c=>{
    c.classList.remove('selected');
    const d = c.dataset.diff;
    const st = save.stars[saveKey(chosenBook,mode,d)] || 0;
    let mini = c.querySelector('.mini-star'); if(mini) mini.remove();
    if(st>0){ const m=document.createElement('span'); m.className='mini-star'; m.textContent=starsToStr(st); c.appendChild(m); }
  });
  chosenDiff = null;
  document.getElementById('playBtn').disabled = true;
  document.getElementById('aiStatus').textContent = '';
  showScreen('stepDiff');
}
document.getElementById('modeTrivia').onclick = ()=>{ if(!document.getElementById('modeTrivia').disabled) selectMode('trivia'); };
document.getElementById('modeFill').onclick = ()=>{ if(!document.getElementById('modeFill').disabled) selectMode('fill'); };
document.getElementById('modeOrder').onclick = ()=>{ if(!document.getElementById('modeOrder').disabled) selectMode('order'); };
document.getElementById('backToMode').onclick = ()=> showScreen('stepMode');

document.querySelectorAll('#diffChips .chip').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('#diffChips .chip').forEach(c=>c.classList.remove('selected'));
    btn.classList.add('selected'); chosenDiff = btn.dataset.diff;
    document.getElementById('playBtn').disabled = false;
  };
});
document.getElementById('playBtn').onclick = async ()=>{ await beginLevel(); };

/* =========================================================
   GAMEPLAY ENGINE  (fully static question bank — no AI at play time)
   ========================================================= */
let quiz = [], idx = 0, lives = 3, combo = 0, correctCount = 0, coinsThisRound = 0, xpThisRound = 0;

function shuffle(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function matchesMode(q){ return q.t===chosenMode || (chosenMode==='trivia' && q.t==='mc'); }

function buildPool(){
  const book = BANK[chosenBook];
  if(!book) return [];
  let pool = (book[chosenDiff]||[]).filter(matchesMode).map(q=>({...q}));
  if(pool.length===0){
    // fall back to any difficulty for this book/mode if the chosen tier is thin
    ["easy","medium","hard"].forEach(d=>{ (book[d]||[]).forEach(q=>{ if(matchesMode(q)) pool.push({...q}); }); });
  }
  return pool;
}

async function beginLevel(){
  document.getElementById('aiStatus').textContent = '';
  let pool = buildPool();
  if(pool.length===0){
    document.getElementById('aiStatus').textContent = '⚠️ No questions available for this combination yet.';
    return;
  }
  shuffle(pool);
  quiz = pool.slice(0, Math.min(8, pool.length));
  idx=0; lives=3; combo=0; correctCount=0; coinsThisRound=0; xpThisRound=0;
  showScreen('game');
  renderQ();
}

function renderQ(){
  const q = quiz[idx];
  document.getElementById('progress').textContent = `Q${idx+1}/${quiz.length}`;
  document.getElementById('livesLive').textContent = '❤️'.repeat(Math.max(lives,0)) + '🖤'.repeat(3-Math.max(lives,0));
  document.getElementById('comboLine').textContent = combo>=2 ? `🔥 Combo x${combo}` : '';
  document.getElementById('qref').textContent = q.ref + (q.t==='fill' ? ' — fill in the blank' : '');
  document.getElementById('qtext').textContent = q.q;
  document.getElementById('feedback').textContent='';
  document.getElementById('nextBtn').classList.add('hidden');

  const mcArea = document.getElementById('mcArea');
  const orderArea = document.getElementById('orderArea');
  if(q.t === 'order'){
    mcArea.classList.add('hidden'); orderArea.classList.remove('hidden');
    renderOrderQ(q);
  } else {
    orderArea.classList.add('hidden'); mcArea.classList.remove('hidden');
    mcArea.innerHTML = '';
    shuffle([...q.opts]).forEach(o=>{
      const b = document.createElement('button');
      b.className='opt'; b.textContent=o;
      b.onclick=()=>answer(o===q.a, b, q);
      mcArea.appendChild(b);
    });
  }
}

let orderPlaced = [];
function renderOrderQ(q){
  const tokens = q.verse.split(' ').map((w,i)=>({w, id:i, used:false}));
  orderPlaced = [];
  function redraw(){
    const strip = document.getElementById('orderStrip');
    const bank = document.getElementById('orderBank');
    strip.innerHTML=''; bank.innerHTML='';
    orderPlaced.forEach(tok=>{
      const b = document.createElement('button'); b.className='tok placed'; b.textContent=tok.w;
      b.onclick=()=>{ orderPlaced = orderPlaced.filter(t=>t.id!==tok.id); tokens.find(t=>t.id===tok.id).used=false; redraw(); };
      strip.appendChild(b);
    });
    tokens.filter(t=>!t.used).forEach(tok=>{
      const b = document.createElement('button'); b.className='tok'; b.textContent=tok.w;
      b.onclick=()=>{ tok.used=true; orderPlaced.push(tok); redraw(); };
      bank.appendChild(b);
    });
    document.getElementById('orderCheckBtn').disabled = orderPlaced.length !== tokens.length;
  }
  shuffle(tokens);
  redraw();
  document.getElementById('orderCheckBtn').onclick = ()=>{
    const built = orderPlaced.map(t=>t.w).join(' ');
    answer(built === q.verse, null, q, built);
  };
}

function answer(correct, btnEl, q){
  document.querySelectorAll('#mcArea .opt').forEach(b=>{
    b.disabled = true;
    if(b.textContent===q.a) b.classList.add('right');
    else if(b===btnEl) b.classList.add('wrong');
  });
  document.querySelectorAll('#orderBank .tok, #orderStrip .tok').forEach(b=>b.disabled=true);
  document.getElementById('orderCheckBtn').disabled = true;
  registerResult(correct, q);
  if(correct){
    document.getElementById('feedback').textContent = combo>=2 ? `✅ Correct! 🔥 x${combo} combo` : '✅ Correct!';
  } else {
    document.getElementById('feedback').textContent = `❌ Correct: ${q.t==='order' ? q.verse : q.a}`;
  }
  document.getElementById('nextBtn').classList.remove('hidden');
}

function registerResult(correct, q){
  if(correct){
    combo++; correctCount++;
    const mult = 1 + Math.min(combo-1, 4)*0.25;
    coinsThisRound += Math.round(10*mult);
    xpThisRound += 5;
  } else {
    combo = 0; lives--;
  }
  document.getElementById('livesLive').textContent = '❤️'.repeat(Math.max(lives,0)) + '🖤'.repeat(3-Math.max(lives,0));
}

document.getElementById('nextBtn').onclick = ()=>{
  idx++;
  if(lives<=0){ finishLevel(false); }
  else if(idx>=quiz.length){ finishLevel(true); }
  else { renderQ(); }
};

function finishLevel(passed){
  showScreen('result');
  bumpStreak();
  let stars = 0;
  if(passed){
    const pct = correctCount/quiz.length;
    if(lives===3 && pct===1) stars = 3;
    else if(pct>=0.7) stars = 2;
    else stars = 1;
  }
  if(passed && stars>0){
    const key = saveKey(chosenBook, chosenMode, chosenDiff);
    save.stars[key] = Math.max(save.stars[key]||0, stars);
  }
  save.coins += coinsThisRound;
  save.xp += xpThisRound + (passed ? 20 : 0);
  writeSave();
  refreshTopbar();

  const emoji = !passed ? '💔' : stars===3 ? '👑' : stars===2 ? '🎉' : '🙂';
  const title = !passed ? 'Out of hearts — try again!' : stars===3 ? 'Perfect!' : stars===2 ? 'Well done!' : 'Level cleared!';
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultStars').textContent = passed ? (starsToStr(stars) || '⭐') : '';
  document.getElementById('finalScore').textContent = `${correctCount} / ${quiz.length} correct`;
  document.getElementById('coinsEarnedLine').textContent = `🪙 +${coinsThisRound}`;
  document.getElementById('xpEarnedLine').textContent = `✨ +${xpThisRound + (passed?20:0)} XP`;
  document.getElementById('resultSub').textContent = `${chosenBook} · ${chosenMode==='trivia'?'Trivia':chosenMode==='fill'?'Fill in the Blank':'Verse Builder'} · ${chosenDiff}`;
}
document.getElementById('playAgainBtn').onclick = ()=> beginLevel();
document.getElementById('chooseAnotherBtn').onclick = ()=> showScreen('stepBook');
</script>
