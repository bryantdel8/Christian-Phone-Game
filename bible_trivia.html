<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scripture Quest</title>
<style>
:root{
  --bg:#181330; --card:#241d47; --accent:#f2c94c; --accent2:#6fe0ab; --accent3:#ff8a65;
  --text:#f4f0ff; --sub:#a99bd6; --wrong:#ef5f6a; --right:#4bd08a; --line:#3a3266;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3efff; --card:#ffffff; --accent:#b8860b; --accent2:#1f9d63; --accent3:#e0672e;
    --text:#251f3d; --sub:#6b6190; --wrong:#c62f2f; --right:#1e8a4c; --line:#e0d9f7;
  }
}
:root[data-theme="dark"]{
  --bg:#181330; --card:#241d47; --accent:#f2c94c; --accent2:#6fe0ab; --accent3:#ff8a65;
  --text:#f4f0ff; --sub:#a99bd6; --wrong:#ef5f6a; --right:#4bd08a; --line:#3a3266;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:Georgia,'Times New Roman',serif; display:flex; justify-content:center;
  padding:14px; padding-top:calc(14px + env(safe-area-inset-top,0px)); padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
}
.wrap{width:100%; max-width:480px;}
h1{ text-align:center; font-size:1.5em; margin:2px 0 0; color:var(--accent); letter-spacing:0.5px;}
.sub{text-align:center; color:var(--sub); margin-bottom:10px; font-size:0.85em;}
.topbar{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  background:var(--card); border-radius:14px; padding:10px 14px; margin-bottom:12px;
  font-size:0.85em; box-shadow:0 4px 14px rgba(0,0,0,0.15);
}
.topbar .pill{display:flex; align-items:center; gap:4px; white-space:nowrap;}
.xpbar{flex:1; height:8px; background:var(--line); border-radius:6px; margin:0 8px; overflow:hidden;}
.xpbar-fill{height:100%; background:var(--accent2); border-radius:6px; transition:width .4s;}
.card{ background:var(--card); border-radius:16px; padding:18px; box-shadow:0 6px 20px rgba(0,0,0,0.18); margin-bottom:12px;}
.hidden{display:none !important;}
.backrow{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.backbtn{background:none; border:none; color:var(--sub); font-size:1.3em; cursor:pointer; padding:0 4px;}
.stepTitle{font-weight:bold; font-size:1.05em;}
.stepSub{color:var(--sub); font-size:0.82em; margin-top:-6px; margin-bottom:10px;}
.book-grid{display:flex; flex-wrap:wrap; gap:8px; max-height:52vh; overflow-y:auto; padding-bottom:2px;}
.book-chip{
  padding:10px 14px; border-radius:14px; border:1.5px solid var(--line); background:transparent;
  color:var(--text); cursor:pointer; font-size:0.9em; font-family:inherit; position:relative;
}
.book-chip .badge{position:absolute; top:-8px; right:-4px; font-size:0.65em; background:var(--accent); color:#221a08; border-radius:8px; padding:1px 5px; font-weight:bold;}
.mode-card{
  display:flex; align-items:center; gap:14px; padding:16px; border-radius:14px; border:2px solid var(--line);
  background:transparent; color:var(--text); cursor:pointer; width:100%; text-align:left; margin-bottom:10px; font-family:inherit;
}
.mode-card .em{font-size:1.8em;}
.mode-card .mname{font-weight:bold; font-size:1.02em;}
.mode-card .mdesc{color:var(--sub); font-size:0.8em; margin-top:2px;}
.mode-card:disabled, .mode-card.disabled{opacity:0.4; cursor:default;}
.chip-row{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0;}
.chip{ padding:10px 16px; border-radius:20px; border:1.5px solid var(--sub); background:transparent; color:var(--text); cursor:pointer; font-size:0.92em; font-family:inherit; position:relative;}
.chip.selected{background:var(--accent); border-color:var(--accent); color:#221a08; font-weight:bold;}
.chip .mini-star{display:block; font-size:0.7em; margin-top:2px;}
button.primary{ width:100%; padding:14px; border-radius:12px; border:none; background:var(--accent2); color:#0e2418; font-weight:bold; font-size:1.02em; cursor:pointer; margin-top:8px;}
button.primary:disabled{opacity:0.5;}
label.toggle{display:flex; align-items:center; gap:8px; font-size:0.85em; color:var(--sub); margin-top:12px; cursor:pointer;}
.hud{display:flex; justify-content:space-between; align-items:center; color:var(--sub); font-size:0.85em; margin-bottom:8px;}
.combo{color:var(--accent); font-weight:bold; font-size:0.85em; min-height:18px; margin-bottom:4px;}
.qref{color:var(--accent); font-size:0.82em; margin-bottom:6px;}
.qtext{font-size:1.12em; margin-bottom:14px; line-height:1.4;}
.opt{ display:block; width:100%; text-align:left; padding:12px 14px; margin-bottom:8px; border-radius:10px; border:1.5px solid var(--sub); background:transparent; color:var(--text); font-family:inherit; font-size:1em; cursor:pointer;}
.opt.right{background:var(--right); border-color:var(--right); color:#0e2418; font-weight:bold;}
.opt.wrong{background:var(--wrong); border-color:var(--wrong); color:#2b0e0e; font-weight:bold;}
.opt:disabled{cursor:default;}
.feedback{min-height:20px; font-size:0.9em; margin-bottom:6px; color:var(--sub);}
.order-strip{min-height:52px; border:2px dashed var(--sub); border-radius:10px; padding:8px; display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
.order-bank{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
.tok{padding:8px 12px; border-radius:8px; background:var(--line); color:var(--text); cursor:pointer; font-size:0.95em; border:none; font-family:inherit;}
.tok.placed{background:var(--accent); color:#221a08;}
.tok:disabled{opacity:0.4; cursor:default;}
.big-emoji{font-size:2.4em; text-align:center; margin-bottom:6px;}
.result{text-align:center;}
.result .stars-big{font-size:2em; margin:8px 0;}
.result .score{font-size:1.7em; color:var(--accent); margin:6px 0;}
.result .rewards{display:flex; justify-content:center; gap:18px; color:var(--sub); font-size:0.95em; margin:10px 0;}
footer{text-align:center; color:var(--sub); font-size:0.72em; margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>📖 Scripture Quest</h1>
  <div class="sub">Bible knowledge · ESV reference</div>

  <div class="topbar">
    <div class="pill">🔥 <span id="streakVal">0</span></div>
    <div class="pill">Lv <span id="xpLevelVal">1</span></div>
    <div class="xpbar"><div class="xpbar-fill" id="xpFill" style="width:0%"></div></div>
    <div class="pill">🪙 <span id="coinVal">0</span></div>
  </div>

  <div id="stepBook" class="card">
    <div class="stepTitle">1. Choose a book</div>
    <div class="stepSub">All 66 books, every mode — hand-written questions, no AI at play time.</div>
    <div class="book-grid" id="bookGrid"></div>
  </div>

  <div id="stepMode" class="card hidden">
    <div class="backrow"><button class="backbtn" id="backToBook">←</button><div class="stepTitle" id="modeBookLabel"></div></div>
    <div class="stepSub">2. Choose a game mode</div>
    <button class="mode-card" id="modeTrivia">
      <span class="em">🧠</span>
      <span><span class="mname">Trivia Challenge</span><br><span class="mdesc">Multiple-choice questions about people, places &amp; events</span></span>
    </button>
    <button class="mode-card" id="modeFill">
      <span class="em">✏️</span>
      <span><span class="mname">Fill in the Blank</span><br><span class="mdesc">Complete the missing word in real ESV verses</span></span>
    </button>
    <button class="mode-card" id="modeOrder">
      <span class="em">🧩</span>
      <span><span class="mname">Verse Builder</span><br><span class="mdesc">Tap words into place to rebuild a verse</span></span>
    </button>
  </div>

  <div id="stepDiff" class="card hidden">
    <div class="backrow"><button class="backbtn" id="backToMode">←</button><div class="stepTitle" id="diffLabel"></div></div>
    <div class="stepSub">3. Choose difficulty</div>
    <div class="chip-row" id="diffChips">
      <button class="chip" data-diff="easy">Easy</button>
      <button class="chip" data-diff="medium">Medium</button>
      <button class="chip" data-diff="hard">Hard</button>
    </div>
    <div id="aiStatus" style="font-size:0.78em;color:var(--sub);margin-top:4px;min-height:16px;"></div>
    <button class="primary" id="playBtn" disabled>Play</button>
  </div>

  <div id="game" class="card hidden">
    <div class="hud">
      <span id="progress">Q1/8</span>
      <span id="livesLive">❤️❤️❤️</span>
    </div>
    <div class="combo" id="comboLine"></div>
    <div class="qref" id="qref"></div>
    <div class="qtext" id="qtext"></div>
    <div id="mcArea"></div>
    <div id="orderArea" class="hidden">
      <div class="order-strip" id="orderStrip"></div>
      <div class="order-bank" id="orderBank"></div>
      <button class="primary" id="orderCheckBtn" disabled>Check</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="primary hidden" id="nextBtn">Next →</button>
  </div>

  <div id="result" class="card result hidden">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <div id="resultTitle" style="font-size:1.2em;font-weight:bold;"></div>
    <div class="stars-big" id="resultStars"></div>
    <div class="score" id="finalScore"></div>
    <div class="rewards"><span id="coinsEarnedLine"></span><span id="xpEarnedLine"></span></div>
    <div id="resultSub" style="color:var(--sub);font-size:0.85em;"></div>
    <button class="primary" id="playAgainBtn">Play Again</button>
    <button class="primary" id="chooseAnotherBtn" style="background:transparent;border:1.5px solid var(--sub);color:var(--text);">Choose Another</button>
  </div>

  <footer>Text references from the ESV (English Standard Version)</footer>
</div>

<script>
/* =========================================================
   QUESTION BANK  (t: mc | fill | order) — hand-checked, ESV-referenced
   ========================================================= */
const BANK = {
Genesis: { easy: [
    {t:"mc", ref:"Genesis 1:1", q:"\"In the beginning, God created the ___ and the earth.\"", opts:["heavens","stars","waters","light"], a:"heavens"},
    {t:"mc", ref:"Genesis 3", q:"What fruit is commonly associated with the tree in Eden, though not named in the text?", opts:["Apple","Fig","Pomegranate","Grape"], a:"Apple"},
    {t:"mc", ref:"Genesis 6-9", q:"Who built the ark?", opts:["Noah","Abraham","Moses","Enoch"], a:"Noah"},
    {t:"order", ref:"Genesis 1:3", verse:"And God said, \"Let there be light,\" and there was light.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Genesis 1:27", q:"\"...in the image of God he created him; male and ___ he created them.\"", opts:["female","man","woman","spirit"], a:"female"},
    {t:"fill", ref:"Genesis 2:7", q:"\"...and the man became a living ___.\"", opts:["creature","soul","spirit","being"], a:"creature"},
    {t:"mc", ref:"Genesis 2:21-22", q:"What did God use to form the first woman?", opts:["One of Adam's ribs","Dust from the ground","Clay","A bone from Adam's foot"], a:"One of Adam's ribs"},
    {t:"mc", ref:"Genesis 2:9,17", q:"What were the two special trees in the Garden of Eden?", opts:["Tree of Life and Tree of the Knowledge of Good and Evil","Tree of Wisdom and Tree of Death","Tree of Eden and Tree of Adam","Tree of Fruit and Tree of Thorns"], a:"Tree of Life and Tree of the Knowledge of Good and Evil"},
    {t:"mc", ref:"Genesis 3:21", q:"What did God make for Adam and Eve to wear after they sinned?", opts:["Garments of skin","Fig leaves","Linen robes","Nothing"], a:"Garments of skin"},
    {t:"mc", ref:"Genesis 4:2", q:"What was Cain's occupation?", opts:["Tiller of the ground (farmer)","Shepherd","Fisherman","Builder"], a:"Tiller of the ground (farmer)"},
    {t:"mc", ref:"Genesis 7:13,2 Peter 2:5", q:"How many people were saved on Noah's ark?", opts:["8","4","6","10"], a:"8"},
    {t:"mc", ref:"Genesis 9:13", q:"What sign did God give Noah as a promise never to flood the earth again?", opts:["A rainbow","A dove","An olive branch","A star"], a:"A rainbow"},
    {t:"fill", ref:"Genesis 9:13", q:"\"I have set my ___ in the cloud, and it shall be a sign of the covenant...\"", opts:["bow","rainbow","light","promise"], a:"bow"},
    {t:"mc", ref:"Genesis 11:4", q:"Genesis 11 says the people wanted to build a tower reaching where?", opts:["To the heavens","Under the sea","To the moon","Into the desert"], a:"To the heavens"},
    {t:"mc", ref:"Genesis 12:1", q:"God called Abram to leave his home and go to which land?", opts:["Canaan","Egypt","Babylon","Moab"], a:"Canaan"},
    {t:"order", ref:"Genesis 15:6", verse:"And he believed the LORD, and he counted it to him as righteousness.", q:"Arrange the verse in order:"},
  ], medium: [
    {t:"mc", ref:"Genesis 4:8", q:"Who did Cain kill?", opts:["Abel","Seth","Enoch","Lamech"], a:"Abel"},
    {t:"mc", ref:"Genesis 11:1-9", q:"What structure did people build that God confused their language over?", opts:["Tower of Babel","Ark","Temple","Ziggurat of Ur"], a:"Tower of Babel"},
    {t:"mc", ref:"Genesis 22", q:"Whom did God ask Abraham to sacrifice?", opts:["Isaac","Ishmael","Jacob","Esau"], a:"Isaac"},
    {t:"mc", ref:"Genesis 11:31", q:"What was Abram's original hometown before he journeyed to Canaan?", opts:["Ur of the Chaldeans","Haran","Bethel","Nineveh"], a:"Ur of the Chaldeans"},
    {t:"mc", ref:"Genesis 16:15", q:"Who was the mother of Ishmael?", opts:["Hagar","Sarah","Rebekah","Leah"], a:"Hagar"},
    {t:"mc", ref:"Genesis 19:26", q:"What happened to Lot's wife when she looked back at the destruction of Sodom?", opts:["She turned into a pillar of salt","She was struck blind","She died instantly","She turned to stone"], a:"She turned into a pillar of salt"},
    {t:"mc", ref:"Genesis 21:1-3", q:"What was the name of Abraham and Sarah's son, born to them in their old age?", opts:["Isaac","Ishmael","Jacob","Esau"], a:"Isaac"},
    {t:"mc", ref:"Genesis 24", q:"Who was chosen as Isaac's wife after Abraham's servant found her at a well?", opts:["Rebekah","Rachel","Leah","Tamar"], a:"Rebekah"},
    {t:"mc", ref:"Genesis 25:29-34", q:"Esau sold his birthright to Jacob for what?", opts:["A bowl of stew","A tent","Silver coins","Livestock"], a:"A bowl of stew"},
    {t:"mc", ref:"Genesis 27", q:"Whose blessing did Jacob receive by disguising himself as his brother Esau?", opts:["Isaac's","Abraham's","Laban's","God's audible blessing"], a:"Isaac's"},
    {t:"mc", ref:"Genesis 29", q:"Jacob worked seven years for Laban to marry Rachel, but was tricked into marrying which sister first?", opts:["Leah","Dinah","Tamar","Zilpah"], a:"Leah"},
    {t:"mc", ref:"Genesis 37:31", q:"What did Joseph's brothers do to his special robe before selling him into slavery?", opts:["Dipped it in goat's blood","Burned it","Gave it to Reuben","Sold it separately"], a:"Dipped it in goat's blood"},
    {t:"mc", ref:"Genesis 39", q:"Who falsely accused Joseph in Egypt, leading to his imprisonment?", opts:["Potiphar's wife","Pharaoh","The cupbearer","The baker"], a:"Potiphar's wife"},
    {t:"fill", ref:"Genesis 17:5", q:"\"...your name shall be Abraham, for I have made you the father of a multitude of ___.\"", opts:["nations","peoples","kings","tribes"], a:"nations"},
    {t:"fill", ref:"Genesis 2:24", q:"\"...and hold fast to his wife, and they shall become one ___.\"", opts:["flesh","body","spirit","people"], a:"flesh"},
  ], hard: [
    {t:"mc", ref:"Genesis 37", q:"How many brothers did Joseph have (not counting himself)?", opts:["11","10","12","9"], a:"11"},
    {t:"mc", ref:"Genesis 32:28", q:"What new name was Jacob given after wrestling with God?", opts:["Israel","Judah","Levi","Ephraim"], a:"Israel"},
    {t:"mc", ref:"Genesis 41", q:"What position did Pharaoh give Joseph after he interpreted his dreams?", opts:["Ruler over all Egypt","High Priest","Chief cupbearer","General of the army"], a:"Ruler over all Egypt"},
    {t:"mc", ref:"Genesis 14:18-20", q:"Who was the mysterious king and priest of Salem who blessed Abram?", opts:["Melchizedek","Abimelech","Chedorlaomer","Lot"], a:"Melchizedek"},
    {t:"mc", ref:"Genesis 18:22-33", q:"Who negotiated with God, asking Him to spare Sodom for the sake of a few righteous people?", opts:["Abraham","Lot","Isaac","Moses"], a:"Abraham"},
    {t:"mc", ref:"Genesis 29:34", q:"Which of Jacob's sons became the ancestor of the priestly line (Levites)?", opts:["Levi","Judah","Reuben","Simeon"], a:"Levi"},
    {t:"mc", ref:"Genesis 38", q:"Judah's daughter-in-law Tamar bore him twin sons. What were their names?", opts:["Perez and Zerah","Ephraim and Manasseh","Er and Onan","Ham and Shem"], a:"Perez and Zerah"},
    {t:"mc", ref:"Genesis 40", q:"Before interpreting Pharaoh's dreams, whose dreams did Joseph interpret in prison?", opts:["The cupbearer's and the baker's","Two guards'","Pharaoh's sons'","The chief steward's"], a:"The cupbearer's and the baker's"},
    {t:"mc", ref:"Genesis 41:1-7", q:"Pharaoh's dream featured seven plump cows and seven lean cows, plus seven full heads of grain and seven what?", opts:["Withered, thin heads of grain","Locusts","Empty jars","Dead fish"], a:"Withered, thin heads of grain"},
    {t:"mc", ref:"Genesis 48:13-20", q:"Jacob blessed Joseph's two sons, giving the greater blessing to the younger over the older. Name them in birth order.", opts:["Manasseh (older), then Ephraim (younger)","Ephraim (older), then Manasseh (younger)","Reuben, then Simeon","Levi, then Judah"], a:"Manasseh (older), then Ephraim (younger)"},
    {t:"mc", ref:"Genesis 49:10", q:"On his deathbed, Jacob prophesied that the ruling scepter would belong to which son?", opts:["Judah","Reuben","Joseph","Benjamin"], a:"Judah"},
    {t:"mc", ref:"Genesis 23", q:"Abraham purchased a burial cave for Sarah at which location?", opts:["The cave of Machpelah","Mount Moriah","Bethel","Hebron's tower"], a:"The cave of Machpelah"},
    {t:"fill", ref:"Genesis 50:20", q:"\"...you meant evil against me, but God meant it for ___...\"", opts:["good","peace","life","mercy"], a:"good"},
    {t:"order", ref:"Genesis 18:14", verse:"Is anything too hard for the LORD?", q:"Arrange the verse in order:"},
  ]},
Exodus: { easy: [
    {t:"mc", ref:"Exodus 2", q:"As a baby, Moses was found floating in a basket on which river?", opts:["Nile","Jordan","Euphrates","Tigris"], a:"Nile"},
    {t:"mc", ref:"Exodus 3", q:"What was burning but not consumed when God spoke to Moses?", opts:["A bush","A tree","An altar","A lamp"], a:"A bush"},
    {t:"mc", ref:"Exodus 20", q:"How many commandments did God give at Sinai?", opts:["10","7","12","5"], a:"10"},
    {t:"mc", ref:"Exodus 2", q:"Who was Moses' sister, who watched over the basket and later led a song of praise after the Red Sea crossing?", opts:["Miriam","Zipporah","Jochebed","Deborah"], a:"Miriam"},
    {t:"mc", ref:"Exodus 2:21", q:"What was the name of Moses' wife?", opts:["Zipporah","Miriam","Rebekah","Rahab"], a:"Zipporah"},
    {t:"mc", ref:"Exodus 3:14", q:"What did God call Himself when Moses asked His name at the burning bush?", opts:["\"I AM WHO I AM\"","\"The Almighty\"","\"El Shaddai\"","\"Adonai\""], a:"\"I AM WHO I AM\""},
    {t:"mc", ref:"Exodus 7:20", q:"What happened to the Nile River in the first plague?", opts:["It turned to blood","It dried up completely","It flooded the land","It froze"], a:"It turned to blood"},
    {t:"mc", ref:"Exodus 11-12", q:"What was the last and most devastating of the ten plagues?", opts:["The death of the firstborn","Total darkness","Locusts","Hail"], a:"The death of the firstborn"},
    {t:"mc", ref:"Exodus 12:7", q:"What were the Israelites told to put on their doorposts so the plague of death would pass over their homes?", opts:["The blood of a lamb","Oil","Ashes","A written blessing"], a:"The blood of a lamb"},
    {t:"fill", ref:"Exodus 20:12", q:"\"Honor your father and your ___, that your days may be long in the land...\"", opts:["mother","family","household","people"], a:"mother"},
    {t:"order", ref:"Exodus 20:13", verse:"You shall not murder.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Exodus 13:21", q:"\"...and by night in a pillar of ___ to give them light.\"", opts:["fire","cloud","smoke","light"], a:"fire"},
    {t:"mc", ref:"Exodus 32", q:"Who made the golden calf while Moses was up on Mount Sinai?", opts:["Aaron","Joshua","Hur","Nadab"], a:"Aaron"},
    {t:"mc", ref:"Exodus 24:18,34:28", q:"How many days did Moses stay on Mount Sinai receiving the Ten Commandments?", opts:["40","7","3","70"], a:"40"},
  ], medium: [
    {t:"mc", ref:"Exodus 7-12", q:"How many plagues struck Egypt?", opts:["10","7","12","9"], a:"10"},
    {t:"mc", ref:"Exodus 14", q:"What body of water did Israel cross on dry ground?", opts:["Red Sea","Jordan River","Sea of Galilee","Dead Sea"], a:"Red Sea"},
    {t:"mc", ref:"Exodus 16", q:"What bread-like food did God provide daily in the wilderness?", opts:["Manna","Quail","Barley loaves","Honeycomb"], a:"Manna"},
    {t:"order", ref:"Exodus 20:3", verse:"You shall have no other gods before me.", q:"Arrange the verse in order:"},
    {t:"mc", ref:"Exodus 15:23-25", q:"At Marah, God made bitter water sweet for the Israelites by having Moses do what?", opts:["Cast a piece of wood into the water","Strike the water with his staff","Pray over it for seven days","Pour salt into it"], a:"Cast a piece of wood into the water"},
    {t:"mc", ref:"Exodus 17:6", q:"Where did water come from when Moses struck a rock with his staff at Horeb?", opts:["Out of the rock itself","A hidden spring nearby","Rain sent by God","A river redirected by angels"], a:"Out of the rock itself"},
    {t:"mc", ref:"Exodus 18", q:"Who advised Moses to appoint other judges to help him lead the people?", opts:["Jethro, his father-in-law","Aaron, his brother","Joshua, his aide","Caleb"], a:"Jethro, his father-in-law"},
    {t:"mc", ref:"Exodus 25:10-22", q:"What was the name of the sacred gold-covered chest that held the Ten Commandment tablets?", opts:["The Ark of the Covenant","The Mercy Chest","The Tabernacle Box","The Sinai Ark"], a:"The Ark of the Covenant"},
    {t:"mc", ref:"Exodus 31:1-6", q:"Which two skilled craftsmen were filled with God's Spirit to build the tabernacle?", opts:["Bezalel and Oholiab","Aaron and Hur","Caleb and Joshua","Nadab and Abihu"], a:"Bezalel and Oholiab"},
    {t:"mc", ref:"Exodus 40:34-35", q:"What covered the tabernacle once it was completed, showing God's presence?", opts:["A cloud (the glory of the LORD)","A rainbow","A pillar of fire only","A flock of doves"], a:"A cloud (the glory of the LORD)"},
    {t:"mc", ref:"Exodus 25:31-40", q:"What object gave light inside the tabernacle's Holy Place?", opts:["The golden lampstand","Torches on the walls","Oil lanterns at the door","A pillar of fire"], a:"The golden lampstand"},
    {t:"mc", ref:"Exodus 25:30", q:"What kind of bread was kept on a table in the tabernacle's Holy Place?", opts:["The bread of the Presence (showbread)","Unleavened Passover bread","Manna cakes","Barley loaves"], a:"The bread of the Presence (showbread)"},
    {t:"fill", ref:"Exodus 16:4", q:"\"...I am about to rain ___ from heaven for you.\"", opts:["bread","manna","food","water"], a:"bread"},

    {t:"mc", ref:"Lamentations", q:"Jeremiah is traditionally credited as the author of which other Old Testament book mourning Jerusalem's fall?", opts:["Lamentations","Ecclesiastes","Obadiah","Joel"], a:"Lamentations"},
    {t:"mc", ref:"Jeremiah 18:4", q:"What happened to the first clay vessel the potter was making, before he reshaped it into another?", opts:["It was spoiled/marred in his hand","It shattered completely","It hardened too quickly","It was stolen"], a:"It was spoiled/marred in his hand"},
    {t:"mc", ref:"Jeremiah 1:1", q:"Where was Jeremiah from, before his prophetic ministry centered on Jerusalem?", opts:["Anathoth","Bethlehem","Shiloh","Hebron"], a:"Anathoth"},
    {t:"mc", ref:"Jeremiah 20:14-18", q:"In Jeremiah 20, what does Jeremiah lament about his own life, similar in tone to Job?", opts:["He wishes he had never been born","He wishes he had died in battle","He wishes he had never met Baruch","He wishes he had remained a priest"], a:"He wishes he had never been born"},
    {t:"mc", ref:"Jeremiah 26", q:"What nearly happened to Jeremiah after he prophesied the Temple's destruction in Jeremiah 26?", opts:["He was nearly put to death","He was nearly crowned king","He was nearly exiled to Egypt","He was nearly made high priest"], a:"He was nearly put to death"},
  ], hard: [
    {t:"mc", ref:"Jeremiah 38", q:"Jeremiah was thrown into what by officials angered at his message?", opts:["A muddy cistern","The Nile River","A lions' den","A furnace"], a:"A muddy cistern"},
    {t:"mc", ref:"Jeremiah 1:1-3", q:"Jeremiah's prophetic ministry spanned the reigns of several kings of Judah, roughly from which king to which?", opts:["From Josiah to Zedekiah","From David to Solomon","From Saul to David","From Hezekiah to Manasseh"], a:"From Josiah to Zedekiah"},
    {t:"mc", ref:"Jeremiah 1:5", q:"What does Jeremiah 1:5 say God did before Jeremiah was even born?", opts:["Knew him and appointed him as a prophet","Gave him a wife","Sent him to Egypt","Made him a priest"], a:"Knew him and appointed him as a prophet"},
    {t:"mc", ref:"Jeremiah 46-51", q:"Besides Judah, what does Jeremiah pronounce oracles of judgment against in later chapters of the book?", opts:["Egypt, Babylon, and other surrounding nations","Only the northern kingdom of Israel","The Philistines exclusively","No other nations are addressed"], a:"Egypt, Babylon, and other surrounding nations"},
    {t:"mc", ref:"Jeremiah 6:14,8:11", q:"What false message did some prophets give the people about coming disaster, which Jeremiah condemned?", opts:["They said \"Peace, peace,\" when there was no peace","They predicted an immediate, total victory","They said God had abandoned Judah forever","They claimed the exile would never end"], a:"They said \"Peace, peace,\" when there was no peace"},
    {t:"mc", ref:"Jeremiah 30-33", q:"Jeremiah's \"Book of Consolation\" (chapters 30-33) primarily promises what amid the coming judgment?", opts:["Future restoration and a new covenant","Immediate deliverance from Babylon","The end of the Babylonian empire within the year","A new law replacing the old entirely"], a:"Future restoration and a new covenant"},
    {t:"mc", ref:"Jeremiah 41", q:"What happened to Gedaliah, the governor appointed over the remaining Jews in the land after Jerusalem's fall?", opts:["He was assassinated","He fled to Egypt","He became king","He was exiled to Babylon"], a:"He was assassinated"},
    {t:"mc", ref:"Jeremiah 13", q:"In Jeremiah 13, what object did God tell Jeremiah to bury and later dig up ruined, symbolizing Judah's corruption?", opts:["A linen loincloth (belt)","A clay jar","A bronze mirror","A silver coin"], a:"A linen loincloth (belt)"},
    {t:"mc", ref:"Jeremiah 52", q:"What does Jeremiah 52, the book's closing chapter, largely retell, closely paralleling 2 Kings 25?", opts:["The fall of Jerusalem and the exile","Jeremiah's own death","The rebuilding of the Temple","Jeremiah's early prophecies"], a:"The fall of Jerusalem and the exile"},
    {t:"mc", ref:"Jeremiah 45", q:"What personal message of comfort does Jeremiah give to his scribe Baruch in chapter 45?", opts:["A promise of Baruch's own safety amid the coming judgment","A command to flee to Egypt immediately","A rebuke for doubting Jeremiah's message","An order to burn the scrolls"], a:"A promise of Baruch's own safety amid the coming judgment"},
  ]},
Daniel: { easy: [
    {t:"mc", ref:"Daniel 6", q:"Who was thrown into the lions' den for praying to God?", opts:["Daniel","Shadrach","Nebuchadnezzar","Belshazzar"], a:"Daniel"},

    {t:"mc", ref:"Daniel 4", q:"What happened to King Nebuchadnezzar after his dream of a great tree, due to his pride?", opts:["He went mad and lived like an animal for a time","He died suddenly","He converted to worship God immediately","He was overthrown at once"], a:"He went mad and lived like an animal for a time"},
    {t:"mc", ref:"Daniel 6:19-23", q:"What did King Darius do the morning after Daniel spent the night in the lions' den?", opts:["He rushed to the den and found Daniel unharmed","He ordered the lions killed","He forgot about Daniel entirely","He sent soldiers to check first"], a:"He rushed to the den and found Daniel unharmed"},

    {t:"mc", ref:"Daniel", q:"What was Daniel's general role in the Babylonian and later Persian royal courts?", opts:["Advisor and interpreter of dreams and visions","Chief military commander","Royal treasurer","High priest of Babylon"], a:"Advisor and interpreter of dreams and visions"},
  ], medium: [
    {t:"mc", ref:"Daniel 3", q:"Who were thrown into the fiery furnace and survived unharmed?", opts:["Shadrach, Meshach, and Abednego","Daniel and his friends","The three wise men","Ezra and Nehemiah"], a:"Shadrach, Meshach, and Abednego"},
    {t:"mc", ref:"Daniel 6:4-9", q:"What tricked King Darius into throwing Daniel into the lions' den?", opts:["Jealous officials passed a law forbidding prayer to anyone but the king","Daniel was caught stealing","Daniel refused to serve the king at all","Daniel insulted the queen"], a:"Jealous officials passed a law forbidding prayer to anyone but the king"},
    {t:"mc", ref:"Daniel 5", q:"At Belshazzar's feast, what mysterious event interrupted the celebration?", opts:["A hand appeared and wrote on the wall","The lamps went out suddenly","An earthquake struck the palace","A voice thundered from the sky"], a:"A hand appeared and wrote on the wall"},
    {t:"mc", ref:"Daniel 5:25", q:"What did the handwriting on the wall famously say, which only Daniel could interpret?", opts:["\"Mene, Mene, Tekel, and Parsin\"","\"The kingdom has fallen\"","\"Repent or perish\"","\"Holy, holy, holy\""], a:"\"Mene, Mene, Tekel, and Parsin\""},
    {t:"mc", ref:"Daniel 5:26-28", q:"What did Daniel's interpretation of the handwriting predict for Belshazzar's kingdom?", opts:["It would be divided and given to the Medes and Persians","It would last another thousand years","It would be destroyed by fire","It would be given to Daniel himself"], a:"It would be divided and given to the Medes and Persians"},

    {t:"mc", ref:"Daniel 7:13", q:"What heavenly figure does Daniel see in his vision, described as \"coming with the clouds of heaven\"?", opts:["\"One like a son of man\"","An archangel with a sword","A great eagle","A lamb with seven horns"], a:"\"One like a son of man\""},
    {t:"mc", ref:"Daniel 7:1-8", q:"What does Daniel's vision in chapter 7 of four successive beasts arising from the sea symbolize?", opts:["Four successive world empires","Four archangels","Four plagues to come","Four tribes of Israel"], a:"Four successive world empires"},
    {t:"mc", ref:"Daniel 9:1-3", q:"In Daniel 9, what does Daniel do upon realizing, from Jeremiah's prophecy, that the seventy years of exile were nearing their end?", opts:["He prays and fasts, seeking understanding and restoration","He plans to lead an armed revolt","He resigns from royal service","He writes a new set of laws"], a:"He prays and fasts, seeking understanding and restoration"},
    {t:"mc", ref:"Daniel 1:7", q:"Why were Daniel and his three friends given new Babylonian names by their captors?", opts:["To assimilate them into Babylonian court culture","As a punishment for disobedience","Because their Hebrew names were forbidden by law","To disguise them from Nebuchadnezzar"], a:"To assimilate them into Babylonian court culture"},
  ], hard: [
    {t:"mc", ref:"Daniel 2", q:"Who interpreted King Nebuchadnezzar's dream of the great statue?", opts:["Daniel","Joseph","Isaiah","The court magicians"], a:"Daniel"},
    {t:"mc", ref:"Daniel 8", q:"In Daniel 8, Daniel's vision of a ram and a goat is understood to represent which two empires?", opts:["Medo-Persia (ram) and Greece (goat)","Babylon and Egypt","Rome and Greece","Assyria and Babylon"], a:"Medo-Persia (ram) and Greece (goat)"},
    {t:"mc", ref:"Daniel 9", q:"What famous prophecy in Daniel 9 concerns a specific number of \"weeks\" (periods of years) determined for Israel's future?", opts:["The prophecy of the seventy weeks","The prophecy of the four kingdoms","The prophecy of the great tree","The prophecy of the ram and goat"], a:"The prophecy of the seventy weeks"},
    {t:"mc", ref:"Daniel 10:4", q:"Where was Daniel when he had an extended vision after three weeks of fasting?", opts:["By the Tigris River","By the Euphrates River","In the king's palace","On Mount Carmel"], a:"By the Tigris River"},
    {t:"mc", ref:"Daniel 8:16,9:21", q:"Which angel appears to Daniel to explain the meaning of his visions?", opts:["Gabriel","Michael","Raphael","Uriel"], a:"Gabriel"},
    {t:"mc", ref:"Daniel 1:7", q:"What was Daniel's original Hebrew name changed to by the Babylonians?", opts:["Belteshazzar","Shadrach","Nebo","Ashpenaz"], a:"Belteshazzar"},
    {t:"mc", ref:"Daniel", q:"What repeated pattern shows Daniel's faithfulness to God even under pressure to compromise, throughout the book?", opts:["Refusing to violate his convictions despite personal risk","Avoiding all contact with Babylonian officials","Refusing to interpret any dreams","Hiding his faith completely from the king"], a:"Refusing to violate his convictions despite personal risk"},
    {t:"mc", ref:"Daniel 12:2", q:"What does Daniel 12 describe as happening \"at the time of the end,\" involving the dead?", opts:["Many who sleep in the dust will awake, some to life and some to shame","All nations will be destroyed at once","The Temple will be rebuilt instantly","The sun and moon will vanish forever"], a:"Many who sleep in the dust will awake, some to life and some to shame"},
    {t:"mc", ref:"Daniel", q:"What overall two-part structure does the book of Daniel have?", opts:["Narrative stories in chapters 1-6; apocalyptic visions in chapters 7-12","Poetry throughout with no narrative at all","A single continuous vision with no breaks","Genealogies followed by laws"], a:"Narrative stories in chapters 1-6; apocalyptic visions in chapters 7-12"},
    {t:"mc", ref:"Daniel 10:5-6", q:"What kind of heavenly figure appears to Daniel in chapter 10, described in glorious, overwhelming terms?", opts:["A radiant heavenly being, commonly understood as an angel","A pillar of fire only","A talking animal","An ordinary human messenger"], a:"A radiant heavenly being, commonly understood as an angel"},
  ]},
Jonah: { easy: [
    {t:"mc", ref:"Jonah 1-2", q:"What swallowed Jonah after he was thrown overboard?", opts:["A great fish","A whale specifically named","A shark","A sea monster called Leviathan by name"], a:"A great fish"},

    {t:"mc", ref:"Jonah 2", q:"What did Jonah do inside the fish, showing his changed heart?", opts:["He prayed to God","He fell asleep","He tried to escape","He argued with God"], a:"He prayed to God"},
    {t:"mc", ref:"Jonah 3", q:"What happened when Jonah finally preached to Nineveh?", opts:["The people repented and God relented","They ignored him completely","They killed him","They laughed at his message"], a:"The people repented and God relented"},
    {t:"mc", ref:"Jonah 4:6-7", q:"What did God cause to grow to give Jonah shade, then had it wither?", opts:["A plant/vine","A fig tree","A palm tree","A grapevine"], a:"A plant/vine"},

    {t:"mc", ref:"Jonah 1:5", q:"What did the sailors do first when the storm arose, before learning that Jonah caused it?", opts:["Each cried out to his own god and threw cargo overboard","Immediately turned back to port","Prayed together to the LORD","Abandoned the ship in lifeboats"], a:"Each cried out to his own god and threw cargo overboard"},
    {t:"mc", ref:"Jonah 1:7", q:"How did the sailors determine that Jonah was responsible for the storm?", opts:["By casting lots","By asking each passenger directly","By consulting the captain's log","By waiting for a sign in the sky"], a:"By casting lots"},
    {t:"mc", ref:"Jonah 1:12", q:"What did Jonah tell the sailors to do to calm the storm?", opts:["Throw him overboard","Turn the ship around","Pray to his God together","Lighten the ship of all cargo first"], a:"Throw him overboard"},
    {t:"mc", ref:"Jonah 1:16", q:"What did the sailors do after the storm miraculously calmed, once Jonah was thrown overboard?", opts:["Feared the LORD greatly, offered a sacrifice, and made vows","Celebrated and forgot the incident","Turned the ship back to Joppa immediately","Threw the rest of the cargo overboard in relief"], a:"Feared the LORD greatly, offered a sacrifice, and made vows"},

    {t:"mc", ref:"Jonah 4", q:"Why was Jonah angry after Nineveh repented and was spared?", opts:["He wanted them punished and resented God's mercy","He was afraid of the king","He had lost a bet","He wanted to preach longer"], a:"He wanted them punished and resented God's mercy"},
    {t:"fill", ref:"Jonah 4:2", q:"\"...for I knew that you are a gracious God and merciful, slow to anger and abounding in steadfast ___.\"", opts:["love","mercy","grace","kindness"], a:"love"},
    {t:"mc", ref:"Jonah 1:15", q:"What did the sailors do to Jonah when they realized his disobedience had caused the storm?", opts:["Threw him overboard","Tied him to the mast","Locked him below deck","Turned the ship back to shore"], a:"Threw him overboard"},
    {t:"mc", ref:"2 Kings 14:25", q:"From which town was Jonah originally from, according to 2 Kings 14:25?", opts:["Gath-hepher","Tekoa","Anathoth","Bethlehem"], a:"Gath-hepher"},
    {t:"mc", ref:"Jonah 2", q:"How is Jonah's prayer from inside the fish, in chapter 2, best described in literary form?", opts:["A psalm-like prayer of thanksgiving","A legal complaint","A list of commands","A genealogy"], a:"A psalm-like prayer of thanksgiving"},
    {t:"mc", ref:"Jonah 3:3", q:"How is the size of Nineveh described in Jonah 3:3?", opts:["An exceedingly great city, three days' journey across","A small village of a few hundred people","A city smaller than Jerusalem","A city with no walls at all"], a:"An exceedingly great city, three days' journey across"},
    {t:"mc", ref:"Jonah 3:6", q:"Who else in Nineveh, besides the ordinary people, participated in the citywide repentance?", opts:["The king himself","Only foreign visitors","Only the priests","No one of importance"], a:"The king himself"},
    {t:"mc", ref:"Jonah 3:7-8", q:"What unusual detail does Jonah 3 include about who was required to fast during Nineveh's repentance?", opts:["Even the animals","Only pregnant women were exempt","Only the wealthy","Only children under ten"], a:"Even the animals"},
    {t:"mc", ref:"Jonah 4:5", q:"What did Jonah do after preaching to Nineveh, waiting to see what would happen to the city?", opts:["Sat outside the city under a shelter he made","Returned home to Gath-hepher immediately","Left the region entirely","Joined the city's celebration"], a:"Sat outside the city under a shelter he made"},
    {t:"mc", ref:"Jonah 3:4", q:"What single message, kept brief, does Jonah preach to Nineveh once he finally arrives?", opts:["That the city would be overthrown in forty days","A detailed history of Israel","A call to worship the LORD in the Temple","A warning about a coming famine only"], a:"That the city would be overthrown in forty days"},
  ], hard: [
    {t:"mc", ref:"Jonah 1,4", q:"Why did Jonah initially flee toward Tarshish instead of obeying God?", opts:["He didn't want Nineveh to be spared","He was afraid of dying","He didn't believe God existed","He wanted a different mission"], a:"He didn't want Nineveh to be spared"},
    {t:"mc", ref:"Matthew 12:40", q:"Jesus references Jonah's three days in the fish as a sign pointing to what future event of his own?", opts:["His three days in the tomb before resurrection","His forty days in the wilderness","His transfiguration","His ascension"], a:"His three days in the tomb before resurrection"},
    {t:"mc", ref:"Jonah", q:"What does the book of Jonah ultimately reveal about God's character toward foreign, Gentile nations?", opts:["His compassion and mercy extend to all nations","He only cares about Israel","He is indifferent to repentance","He punishes all foreigners equally"], a:"His compassion and mercy extend to all nations"},
    {t:"mc", ref:"Jonah 1:2,3:3", q:"Nineveh, where Jonah was sent, was the capital of which empire notorious for cruelty toward Israel?", opts:["Assyria","Babylon","Persia","Egypt"], a:"Assyria"},
    {t:"mc", ref:"Jonah", q:"What is unusual about the book of Jonah's literary form, compared to most other prophetic books?", opts:["It is mostly a narrative story rather than a collection of oracles","It contains no prophet's name at all","It is written entirely in poetry","It has no ending"], a:"It is mostly a narrative story rather than a collection of oracles"},
    {t:"mc", ref:"Jonah 4:10-11", q:"What closing rhetorical question does God ask Jonah, contrasting his pity for a plant with Nineveh's people and animals?", opts:["Should I not pity Nineveh, with its many people and animals, as you pitied the plant?","Why did you flee to Tarshish in the first place?","Do you not know that I am the LORD?","Have you forgotten my mercy toward you?"], a:"Should I not pity Nineveh, with its many people and animals, as you pitied the plant?"},
    {t:"mc", ref:"Matthew 12,Luke 11", q:"Which Gospel passages record Jesus referring to Jonah as \"a sign to this generation\"?", opts:["Matthew 12 and Luke 11","Mark 1 and John 1","Matthew 5 and Luke 6","John 6 and John 11"], a:"Matthew 12 and Luke 11"},
    {t:"mc", ref:"Jonah", q:"What does Jonah's story ultimately reveal about the scope of God's mercy, beyond Israel alone?", opts:["It extends even to Israel's Gentile enemies","It applies only to repentant Israelites","It excludes all Gentiles permanently","It is limited only to sailors and kings"], a:"It extends even to Israel's Gentile enemies"},

  ]},

    {t:"mc", ref:"Lamentations 4:1-2", q:"What contrast does Lamentations 4 draw between Jerusalem's former nobles and their state during the famine?", opts:["They went from splendor to being unrecognizable with hunger","They remained wealthy throughout","They fled before any suffering began","They were untouched by the famine"], a:"They went from splendor to being unrecognizable with hunger"},
    {t:"mc", ref:"Lamentations", q:"What overall theological tension does Lamentations hold together throughout its five chapters?", opts:["Deep grief over judgment alongside enduring hope in God's faithfulness","Complete despair with no hope at all","Total denial that any judgment occurred","Pure celebration disguised as mourning"], a:"Deep grief over judgment alongside enduring hope in God's faithfulness"},
    {t:"mc", ref:"Lamentations 4:20", q:"What happened to \"the LORD's anointed,\" a reference to the king, according to Lamentations 4?", opts:["He was captured/taken in the disaster","He escaped safely to Egypt","He successfully repelled Babylon","He was crowned king of Babylon instead"], a:"He was captured/taken in the disaster"},
    {t:"mc", ref:"Lamentations 2:9", q:"What does Lamentations 2 say happened to Jerusalem's gates and king as part of the city's downfall?", opts:["The gates sank into the ground and the king went into exile","The gates were rebuilt stronger than before","The king successfully defended the gates","Nothing changed regarding the gates"], a:"The gates sank into the ground and the king went into exile"},
    {t:"mc", ref:"Lamentations 4:7-8", q:"What contrast does Lamentations 4 draw regarding the appearance of Jerusalem's nobles, before and during the siege?", opts:["From glowing and radiant to blackened and unrecognizable","From poor to suddenly wealthy","From young to elderly overnight","From foreign to native-born"], a:"From glowing and radiant to blackened and unrecognizable"},

Ezekiel: { easy: [

    {t:"mc", ref:"Ezekiel 16,23", q:"What kind of imagery does Ezekiel often use to describe Israel's covenant unfaithfulness to God?", opts:["An unfaithful wife/adultery imagery","A rebellious army","A wandering shepherd","A broken vessel only"], a:"An unfaithful wife/adultery imagery"},

    {t:"mc", ref:"Joel 2:28,Acts 2:16-17", q:"Joel's prophecy about the Spirit poured out on \"all flesh\" is explicitly said in Acts to be fulfilled at which event?", opts:["Pentecost","The Transfiguration","The Ascension","The Last Supper"], a:"Pentecost"},
    {t:"mc", ref:"Joel 2:11", q:"What imagery does Joel 2 use to describe the sound of the approaching locust army?", opts:["The sound of chariots/a mighty army","Complete silence before disaster","Distant thunder only","Birds fleeing in panic"], a:"The sound of chariots/a mighty army"},

    {t:"mc", ref:"Joel", q:"What theological pattern does Joel establish, connecting a present crisis to a future reality?", opts:["Historical judgment as a foretaste of final eschatological judgment","A purely historical account with no future application","A cycle that repeats every locust season only","An isolated, unrepeatable event"], a:"Historical judgment as a foretaste of final eschatological judgment"},

    {t:"mc", ref:"Nahum / Jonah", q:"Nahum's message of judgment on Nineveh comes roughly a century after which other prophet preached repentance there?", opts:["Jonah","Amos","Hosea","Joel"], a:"Jonah"},
    {t:"mc", ref:"Nahum 1-2", q:"What imagery does Nahum use to describe Nineveh's coming destruction?", opts:["Flooding waters and fire","A swarm of locusts","A great famine","An earthquake"], a:"Flooding waters and fire"},
    {t:"mc", ref:"Nahum 1:7", q:"What does Nahum 1:7 say about the LORD, describing him as good and a stronghold for whom?", opts:["Those who take refuge in him","Only the priests of Israel","Every nation equally, without exception","Only the king of Judah"], a:"Those who take refuge in him"},
    {t:"mc", ref:"Nahum 1:11", q:"What accusation does Nahum 1:11 make against a figure who \"plotted evil against the LORD\"?", opts:["Being a worthless counselor against God","Being a false prophet within Judah","Being a corrupt Israelite priest","Being an unnamed foreign merchant"], a:"Being a worthless counselor against God"},
    {t:"mc", ref:"Nahum 1:14", q:"What does Nahum 1:14 prophesy will happen to Nineveh's carved and metal images of its gods?", opts:["They will be cut off/destroyed","They will be taken to Babylon","They will be melted into new idols","They will be preserved as trophies"], a:"They will be cut off/destroyed"},
    {t:"mc", ref:"Nahum 3:4", q:"What comparison does Nahum 3 make between Nineveh and a seductive figure who \"betrays nations\"?", opts:["A prostitute","A sorceress","A queen","A false prophetess"], a:"A prostitute"},
    {t:"mc", ref:"Nahum 3:8", q:"What earlier Egyptian city does Nahum 3:8 compare Nineveh to, warning that strong defenses didn't save it either?", opts:["Thebes (No-amon)","Memphis","Alexandria","Heliopolis"], a:"Thebes (No-amon)"},
    {t:"mc", ref:"Nahum 3:12", q:"What image does Nahum 3:12 use for Nineveh's fortresses, describing how easily they would fall?", opts:["Fig trees with ripe figs, easily shaken down","Sandcastles washed away by the tide","Glass towers shattering","Paper walls burning instantly"], a:"Fig trees with ripe figs, easily shaken down"},
    {t:"mc", ref:"Nahum 3:13", q:"What insult does Nahum 3:13 direct at Nineveh's soldiers, questioning their courage?", opts:["\"Your troops are women in your midst\"","\"Your troops are children\"","\"Your troops have fled already\"","\"Your troops serve a false god\""], a:"\"Your troops are women in your midst\""},
    {t:"mc", ref:"Nahum 3:15-17", q:"What insect imagery does Nahum 3:15-17 use to describe Nineveh's merchants and officials vanishing?", opts:["Locusts that fly away when the sun rises","Bees swarming a hive","Ants building endlessly","Spiders spinning webs"], a:"Locusts that fly away when the sun rises"},
  ], hard: [
    {t:"mc", ref:"Nahum", q:"Nahum's book is largely structured as what kind of literary piece against Nineveh?", opts:["A judgment oracle/poem of doom","A legal contract","A genealogy","A love poem"], a:"A judgment oracle/poem of doom"},
    {t:"mc", ref:"Nahum", q:"What is unique about Nahum's message compared to most other prophetic books?", opts:["It focuses almost entirely on judging one foreign city, without addressing Israel's own sins","It never mentions God","It is written entirely in prose","It addresses only Israel's sins"], a:"It focuses almost entirely on judging one foreign city, without addressing Israel's own sins"},
    {t:"mc", ref:"Nahum 1:2-3", q:"What theological paradox does Nahum 1:2-3 hold together concerning God's character?", opts:["He is avenging and jealous, yet also slow to anger","He is loving but powerless to punish","He is angry but forgetful of sin","He is distant and uninvolved in judgment"], a:"He is avenging and jealous, yet also slow to anger"},
    {t:"mc", ref:"Nahum 1:3", q:"What poetic phrase does Nahum 1:3 use to describe God's approach in the storm, emphasizing his majesty?", opts:["\"The clouds are the dust of his feet\"","\"The mountains are his throne\"","\"The stars are his crown\"","\"The seas are his footstool\""], a:"\"The clouds are the dust of his feet\""},
    {t:"mc", ref:"Nahum 2:8", q:"What metaphor does Nahum 2:8 use for Nineveh at the height of its power, before comparing its people fleeing like water draining away?", opts:["A pool of water","A blazing furnace","A towering mountain","A fortified vineyard"], a:"A pool of water"},
    {t:"mc", ref:"Nahum 3:18", q:"What accusation does Nahum 3:18 make against Assyria's \"shepherds\" (rulers), explaining why the people are scattered?", opts:["They slumber/sleep while the people are scattered","They have fled to Egypt","They have converted to worship the LORD","They have made peace with Babylon"], a:"They slumber/sleep while the people are scattered"},
    {t:"mc", ref:"Nahum 3:19", q:"What reaction does Nahum 3:19 say all who hear of Nineveh's fall will have?", opts:["They will clap their hands over her downfall","They will mourn her loss","They will rebuild her","They will send tribute"], a:"They will clap their hands over her downfall"},
    {t:"mc", ref:"Nahum", q:"What overarching theological theme unites Nahum's oracle, balancing God's patience with certain justice?", opts:["God is patient with sinners but will not let evil go unpunished forever","God abandons justice in favor of mercy alone","God only judges Israel, never foreign nations","God's justice depends on human effort"], a:"God is patient with sinners but will not let evil go unpunished forever"},
    {t:"mc", ref:"Nahum / 2 Kings", q:"Nahum's prophecy against Nineveh using Thebes as a historical warning implies Thebes had already fallen to which empire?", opts:["Assyria itself","Babylon","Persia","Greece"], a:"Assyria itself"},
    {t:"mc", ref:"Nahum / 2 Kings 19", q:"Nahum's prophecy of Nineveh's fall was historically fulfilled in 612 BC by a coalition of which two powers?", opts:["Babylon and the Medes","Egypt and Persia","Israel and Judah","Greece and Rome"], a:"Babylon and the Medes"},
  ]},
Habakkuk: { easy: [
    {t:"mc", ref:"Habakkuk", q:"Habakkuk is unique among the prophets for doing what with God?", opts:["Questioning and dialoguing with Him","Refusing to speak to Him","Worshiping idols alongside Him","Fighting a physical battle"], a:"Questioning and dialoguing with Him"},
    {t:"fill", ref:"Habakkuk 2:4", q:"\"...but the righteous shall live by his ___.\"", opts:["faith","works","hope","word"], a:"faith"},
    {t:"mc", ref:"Habakkuk 1:2", q:"What does Habakkuk cry out to the LORD about in his opening complaint?", opts:["\"Violence!\"","\"Famine!\"","\"Exile!\"","\"Betrayal!\""], a:"\"Violence!\""},
    {t:"mc", ref:"Habakkuk 1:4", q:"What does Habakkuk say has happened to \"the law\" because the wicked surround the righteous?", opts:["It is paralyzed","It is perfected","It is forgotten","It is rewritten"], a:"It is paralyzed"},
    {t:"mc", ref:"Habakkuk 2:1", q:"Where does Habakkuk say he will take his stand to wait for God's answer?", opts:["At my watchpost, on the tower","In the Temple courtyard","At the city gate","On the mountain of Sinai"], a:"At my watchpost, on the tower"},
    {t:"mc", ref:"Habakkuk 2:2", q:"God tells Habakkuk to write the vision and make it plain on what?", opts:["Tablets","Scrolls","A wall","Papyrus"], a:"Tablets"},
    {t:"fill", ref:"Habakkuk 2:14", q:"\"For the earth will be filled with the knowledge of the glory of the LORD as the waters cover the ___.\"", opts:["sea","mountains","desert","earth"], a:"sea"},
    {t:"mc", ref:"Habakkuk 2:18-19", q:"What does Habakkuk mock idols of wood and stone for being unable to do?", opts:["Speak or teach anything","Reflect light","Stay standing","Hold gold or silver"], a:"Speak or teach anything"},
    {t:"fill", ref:"Habakkuk 2:20", q:"\"But the LORD is in his holy ___; let all the earth keep silence before him.\"", opts:["temple","heaven","mountain","city"], a:"temple"},
    {t:"mc", ref:"Habakkuk 3:17-18", q:"Even if the fig tree does not blossom and the fields yield no food, what does Habakkuk resolve to do?", opts:["Rejoice in the LORD","Leave Judah","Stop praying","Blame the priests"], a:"Rejoice in the LORD"},
    {t:"mc", ref:"Habakkuk 3:19", q:"What does Habakkuk say the LORD makes his feet like?", opts:["The deer's","The eagle's wings","Iron chains","A soldier's boots"], a:"The deer's"},
    {t:"mc", ref:"Habakkuk 1:6", q:"Habakkuk 1:6 describes the Chaldeans as what kind of nation, marching to seize dwellings not their own?", opts:["Bitter and hasty","Slow and cautious","Weak and divided","Wise and just"], a:"Bitter and hasty"},
    {t:"mc", ref:"Habakkuk 1:8", q:"Habakkuk 1:8 says the Chaldean horses are swifter than what animal?", opts:["Leopards","Horses of Egypt","Deer","Eagles alone"], a:"Leopards"},
  ], medium: [
    {t:"mc", ref:"Habakkuk 2:4", q:"Habakkuk's statement \"the righteous shall live by his faith\" is later quoted prominently by which New Testament author?", opts:["Paul","Peter","John","James"], a:"Paul"},
    {t:"mc", ref:"Habakkuk 1:6", q:"What nation does God tell Habakkuk He will use to punish Judah, surprising the prophet?", opts:["Babylon (the Chaldeans)","Assyria","Egypt","Persia"], a:"Babylon (the Chaldeans)"},
    {t:"mc", ref:"Habakkuk 1:12", q:"What confidence does Habakkuk express in 1:12 even while foreseeing the coming judgment?", opts:["\"We shall not die\"","\"We shall not be punished\"","\"We shall not sin again\"","\"We shall not be seen\""], a:"\"We shall not die\""},
    {t:"mc", ref:"Habakkuk 1:13", q:"Habakkuk asks why God, who is \"of purer eyes than to see evil,\" stays silent while the wicked swallow up whom?", opts:["The man more righteous than he","The king of Babylon","The priests of Jerusalem","The prophets of Baal"], a:"The man more righteous than he"},
    {t:"mc", ref:"Habakkuk 2:9-11", q:"In the woe oracles, what does Habakkuk say will \"cry out from the wall\" against a man who built his house by unjust gain?", opts:["The stone","The wind","The dust","The gate"], a:"The stone"},
    {t:"mc", ref:"Habakkuk 3:3", q:"Habakkuk 3:3 says God came from Teman and from which mountain, \"the Holy One\"?", opts:["Mount Paran","Mount Sinai","Mount Carmel","Mount Horeb"], a:"Mount Paran"},
    {t:"mc", ref:"Habakkuk 3:6", q:"What happened to \"the eternal mountains\" when God appeared, according to Habakkuk 3:6?", opts:["They were scattered","They were rebuilt","They sang for joy","They turned to gold"], a:"They were scattered"},
    {t:"mc", ref:"Habakkuk 2:15-16", q:"The woe oracles condemn a man who makes his neighbors do what, to gaze at their shame?", opts:["Get drunk","Bow to idols","Sign false contracts","Pay unjust taxes"], a:"Get drunk"},
    {t:"mc", ref:"Habakkuk 2:18-19", q:"Habakkuk 2:18-19 mocks idols as \"a metal image, a teacher of\" what?", opts:["Lies","Wisdom","Fear","Silence"], a:"Lies"},
    {t:"mc", ref:"Habakkuk 3:8", q:"Habakkuk 3:8 asks whether the LORD's wrath in his coming is against rivers or against what, when he rides his chariot of salvation?", opts:["The sea","The mountains","The desert","The forests"], a:"The sea"},
  ], hard: [
    {t:"mc", ref:"Habakkuk 3", q:"Habakkuk's book closes with what kind of joyful declaration despite hardship?", opts:["A hymn of trust in God even amid loss","A curse on his enemies","A genealogy","A legal complaint"], a:"A hymn of trust in God even amid loss"},
    {t:"mc", ref:"Habakkuk 2:4,Hebrews 10:38", q:"Habakkuk 2:4's statement about living by faith is quoted in Romans, Galatians, and also which other New Testament letter?", opts:["Hebrews","1 Peter","James","1 John"], a:"Hebrews"},
    {t:"mc", ref:"Habakkuk", q:"How is the overall structure of Habakkuk best described?", opts:["A dialogue of complaints and divine answers, closing with a prayer of praise","A strict chronological narrative","A collection of unrelated proverbs","A single unbroken genealogy"], a:"A dialogue of complaints and divine answers, closing with a prayer of praise"},
    {t:"mc", ref:"Habakkuk 1:1", q:"Habakkuk 1:1 calls the book \"the oracle that Habakkuk the prophet ___,\" using an unusual verb for a spoken message.", opts:["Saw","Heard","Wrote","Received"], a:"Saw"},
    {t:"mc", ref:"Habakkuk 2:5", q:"Habakkuk 2:5 compares the Chaldean tyrant's greed to something \"as wide as\" what?", opts:["Sheol","The sea","The desert","The heavens"], a:"Sheol"},
    {t:"mc", ref:"Habakkuk 3:1", q:"Habakkuk 3 is labeled \"according to Shigionoth,\" a term generally understood to refer to what?", opts:["A musical or poetic notation of uncertain meaning","A geographic region","A tribe of Israel","A type of sacrifice"], a:"A musical or poetic notation of uncertain meaning"},
    {t:"mc", ref:"Habakkuk 3:13", q:"Habakkuk 3:13 says God went out for the salvation of his people and of whom else?", opts:["\"Your anointed\"","\"The nations\"","\"The Gentiles\"","\"The remnant of Israel\""], a:"\"Your anointed\""},
    {t:"mc", ref:"Habakkuk 3:19", q:"Habakkuk's closing musical notation, \"To the choirmaster: with stringed instruments,\" echoes endings found throughout which other Old Testament book?", opts:["Psalms","Proverbs","Lamentations","Song of Solomon"], a:"Psalms"},
    {t:"mc", ref:"Habakkuk 3:16", q:"How does Habakkuk 3:16 describe his own physical reaction upon hearing of God's coming judgment?", opts:["His body trembles and rottenness enters his bones","He falls asleep peacefully","He laughs with confidence","He feels nothing at all"], a:"His body trembles and rottenness enters his bones"},
    {t:"mc", ref:"Habakkuk 3:10-11", q:"Habakkuk 3:10-11 says that at God's appearing, the sun and moon did what?", opts:["Stood still in their place","Turned to blood","Disappeared completely","Grew brighter than ever"], a:"Stood still in their place"},
  ]},
Zephaniah: { easy: [
    {t:"mc", ref:"Zephaniah", q:"Zephaniah prophesied primarily about the coming of what?", opts:["The Day of the LORD","The Messiah's birth","The rebuilding of the Temple","The return from exile"], a:"The Day of the LORD"},
    {t:"fill", ref:"Zephaniah 3:17", q:"\"The LORD your God is in your midst, a mighty one who will ___.\"", opts:["save","reign","judge","provide"], a:"save"},
    {t:"mc", ref:"Zephaniah 1:1", q:"Zephaniah prophesied during the reign of which reforming king of Judah?", opts:["Josiah","Hezekiah","Manasseh","Jehoiakim"], a:"Josiah"},
    {t:"mc", ref:"Zephaniah 1:7", q:"What does Zephaniah 1:7 command everyone to do because \"the day of the LORD is near\"?", opts:["Be silent before the Lord GOD","Sound the trumpet","Flee to the mountains","Gather in the Temple"], a:"Be silent before the Lord GOD"},
    {t:"mc", ref:"Zephaniah 2:3", q:"What three things does Zephaniah 2:3 urge \"all you humble of the land\" to seek?", opts:["The LORD, righteousness, and humility","Wealth, peace, and safety","Wisdom, knowledge, and honor","Justice, mercy, and truth"], a:"The LORD, righteousness, and humility"},
    {t:"fill", ref:"Zephaniah 3:14", q:"\"Sing aloud, O daughter of Zion; shout, O ___!\"", opts:["Israel","Judah","Jerusalem","the LORD"], a:"Israel"},
    {t:"mc", ref:"Zephaniah 3:15", q:"What does Zephaniah 3:15 say the LORD has done for Jerusalem, removing her fear?", opts:["Taken away the judgments against her","Rebuilt her walls","Sent her a new king","Restored the Ark of the Covenant"], a:"Taken away the judgments against her"},
    {t:"mc", ref:"Zephaniah 3:19", q:"What does Zephaniah 3:19 say the LORD will do for \"the lame\" and \"the outcast\"?", opts:["Save and gather them","Judge and scatter them","Ignore them","Send them into exile"], a:"Save and gather them"},
    {t:"mc", ref:"Zephaniah 1:3", q:"Zephaniah 1:3 says God will sweep away man and beast along with the birds of the heavens and what else?", opts:["The fish of the sea","The trees of the field","The stars of the sky","The cattle of the plain"], a:"The fish of the sea"},
    {t:"mc", ref:"Zephaniah 2:4", q:"Zephaniah 2:4 pronounces judgment on which coastal Philistine cities, saying Gaza would be deserted?", opts:["Gaza, Ashkelon, Ashdod, and Ekron","Tyre and Sidon","Jerusalem and Bethlehem","Samaria and Shechem"], a:"Gaza, Ashkelon, Ashdod, and Ekron"},
    {t:"mc", ref:"Zephaniah 1:18", q:"What does Zephaniah 1:18 say will fail to deliver anyone on the day of the LORD's wrath?", opts:["Silver and gold","Weapons and armies","Prayers and sacrifices","Priests and prophets"], a:"Silver and gold"},
    {t:"mc", ref:"Zephaniah 3:16", q:"What comforting words does Zephaniah 3:16 say will be spoken to Jerusalem on that day?", opts:["\"Fear not, O Zion\"","\"Rebuild your walls\"","\"Return from exile\"","\"Rejoice always\""], a:"\"Fear not, O Zion\""},
  ], medium: [
    {t:"mc", ref:"Zephaniah", q:"Zephaniah traces his ancestry back several generations to which king?", opts:["Hezekiah","David","Solomon","Josiah"], a:"Hezekiah"},
    {t:"mc", ref:"Zephaniah 3:17", q:"Zephaniah 3:17 describes God doing what joyful action over His people?", opts:["Rejoicing/singing over them with gladness","Weeping over their sin","Silently watching them","Sending them away"], a:"Rejoicing/singing over them with gladness"},
    {t:"mc", ref:"Zephaniah 2", q:"Zephaniah warns of judgment on Judah's neighbors, including Philistia, Moab, Ammon, and which African/Middle Eastern empire?", opts:["Cush (Ethiopia) and Assyria","Egypt and Babylon","Persia and Media","Greece and Rome"], a:"Cush (Ethiopia) and Assyria"},
    {t:"mc", ref:"Zephaniah 1:12", q:"Zephaniah 1:12 condemns those who are complacent, saying in their hearts what about the LORD?", opts:["\"The LORD will not do good, nor will he do ill\"","\"The LORD has forgotten us\"","\"The LORD favors only the rich\"","\"The LORD has left the land\""], a:"\"The LORD will not do good, nor will he do ill\""},
    {t:"mc", ref:"Zephaniah 2:13", q:"Zephaniah 2:13 prophesies that God will stretch out his hand against the north to destroy which empire, making Nineveh a desolation?", opts:["Assyria","Babylon","Persia","Egypt"], a:"Assyria"},
    {t:"mc", ref:"Zephaniah 3:9", q:"Zephaniah 3:9 promises God will change the speech of the peoples to a \"pure speech\" so that they may do what?", opts:["Call upon the name of the LORD and serve him together","Speak only Hebrew","Cease speaking altogether","Write new scriptures"], a:"Call upon the name of the LORD and serve him together"},
    {t:"mc", ref:"Zephaniah 3:12-13", q:"What does Zephaniah 3:12-13 say the LORD will leave behind in Jerusalem after judgment?", opts:["A people humble and lowly who seek refuge in him","A remnant of proud rulers","An army to defend the city","A council of foreign kings"], a:"A people humble and lowly who seek refuge in him"},
    {t:"mc", ref:"Zephaniah 2:8-10", q:"Zephaniah 2:8-10 says Moab and Ammon are judged because they taunted and boasted against whom?", opts:["The people of the LORD","The Egyptians","The Assyrians","Each other"], a:"The people of the LORD"},
    {t:"mc", ref:"Zephaniah 2:7", q:"Zephaniah 2:7 promises the seacoast of Philistia will become the possession of which group?", opts:["The remnant of the house of Judah","The Egyptians","The Babylonians","The Edomites"], a:"The remnant of the house of Judah"},
    {t:"mc", ref:"Zephaniah 3:20", q:"What does Zephaniah 3:20 say God will make his people among all the peoples of the earth?", opts:["Renowned and praised","Feared and hated","Forgotten and scattered","Enslaved and poor"], a:"Renowned and praised"},
  ], hard: [
    {t:"mc", ref:"Zephaniah 3", q:"Despite its warnings, Zephaniah ends with what tone?", opts:["Joyful hope and restoration","Continued doom","Silence","A call to war"], a:"Joyful hope and restoration"},
    {t:"mc", ref:"Zephaniah 1:2-3", q:"What does Zephaniah say will happen to false idols and their worshipers on the coming Day of the LORD?", opts:["They will be cut off/destroyed","They will be exiled only","They will be forgiven","They will be enslaved"], a:"They will be cut off/destroyed"},
    {t:"mc", ref:"Zephaniah 3:3", q:"Zephaniah 3:3 compares Jerusalem's corrupt officials to roaring lions and her judges to what?", opts:["Evening wolves that leave nothing till morning","Sleeping shepherds","Wandering sheep","Silent serpents"], a:"Evening wolves that leave nothing till morning"},
    {t:"mc", ref:"Zephaniah 2:15", q:"Zephaniah 2:15 describes Nineveh as \"the exultant city\" that said in her heart what boastful claim?", opts:["\"I am, and there is no one else\"","\"I will never fall\"","\"I rule the whole earth\"","\"No god can touch me\""], a:"\"I am, and there is no one else\""},
    {t:"mc", ref:"Zephaniah 1:5", q:"Zephaniah 1:5 condemns those who bow down to the host of heaven and also swear by the LORD while also swearing by which pagan god?", opts:["Milcom","Baal","Chemosh","Dagon"], a:"Milcom"},
    {t:"mc", ref:"Zephaniah 1:14-16", q:"How does Zephaniah 1:14-16 pile up descriptive phrases for the coming Day of the LORD?", opts:["As a day of wrath, distress, ruin, darkness, and battle cry","As a day of feasting and rest","As a day of silence and peace","As a day of harvest and joy"], a:"As a day of wrath, distress, ruin, darkness, and battle cry"},
    {t:"mc", ref:"Zephaniah 3:5", q:"Zephaniah 3:5 contrasts Jerusalem's corrupt leaders with the LORD, who is described within her as what?", opts:["Righteous, doing no injustice","Silent and absent","Angry beyond mercy","Distant and unconcerned"], a:"Righteous, doing no injustice"},
    {t:"mc", ref:"Zephaniah 2:11", q:"Zephaniah 2:11 says the LORD will be awesome against the nations because he will do what to \"all the gods of the earth\"?", opts:["Famish them","Exalt them","Ignore them","Enslave them"], a:"Famish them"},
    {t:"mc", ref:"Zephaniah 3:9", q:"Zephaniah's vision of nations gaining \"a pure speech\" to call on the LORD together is often read as a reversal of what earlier judgment in Genesis?", opts:["The scattering of languages at Babel","The flood of Noah","The expulsion from Eden","The curse on Cain"], a:"The scattering of languages at Babel"},
    {t:"mc", ref:"Zephaniah 1:14-15 / Joel", q:"Zephaniah's vivid \"day of wrath\" language in 1:14-15 closely parallels similar Day-of-the-LORD imagery found in which other minor prophet?", opts:["Joel","Obadiah","Micah","Nahum"], a:"Joel"},
  ]},
Haggai: { easy: [
    {t:"mc", ref:"Haggai", q:"Haggai urged the returned exiles to prioritize rebuilding what?", opts:["The Temple","The city walls","Their homes","The palace"], a:"The Temple"},
    {t:"fill", ref:"Haggai 1:5", q:"\"...thus says the LORD of hosts: Consider your ___.\"", opts:["ways","hearts","houses","future"], a:"ways"},
    {t:"mc", ref:"Haggai 1:1", q:"Haggai delivered his message to Zerubbabel the governor and to which high priest?", opts:["Joshua","Ezra","Jeshua the elder","Eliashib"], a:"Joshua"},
    {t:"mc", ref:"Haggai 1:6", q:"What frustrating cycle does Haggai 1:6 say the people experienced because of their misplaced priorities?", opts:["Sowing much but harvesting little, never having enough","Harvesting abundantly but losing it to thieves","Having plenty but no desire to eat it","Working little yet gaining great wealth"], a:"Sowing much but harvesting little, never having enough"},
    {t:"mc", ref:"Haggai 1:12", q:"How did the people respond after hearing Haggai's message?", opts:["They obeyed the voice of the LORD and feared him","They ignored the prophet entirely","They exiled Haggai","They demanded a new governor"], a:"They obeyed the voice of the LORD and feared him"},
    {t:"mc", ref:"Haggai 1:13", q:"What reassurance did Haggai give the people after they obeyed and began the work?", opts:["\"I am with you, declares the LORD\"","\"You are forgiven completely\"","\"Your king will return soon\"","\"The exile is now over\""], a:"\"I am with you, declares the LORD\""},
    {t:"mc", ref:"Haggai 2:3", q:"Haggai 2:3 asks who among the people remembered this house, the Temple, in its former glory, implying whose Temple?", opts:["Solomon's Temple","Herod's Temple","The Tabernacle","Zerubbabel's own house"], a:"Solomon's Temple"},
    {t:"mc", ref:"Haggai 2:8", q:"What does the LORD declare belongs to him in Haggai 2:8, showing he can supply the Temple's needs?", opts:["The silver and the gold","The cedar and the stone","The land and the sea","The priests and the Levites"], a:"The silver and the gold"},
    {t:"mc", ref:"Haggai 2:23", q:"What object does the LORD compare Zerubbabel to in the book's closing promise?", opts:["A signet ring","A crown","A sword","A shepherd's staff"], a:"A signet ring"},
    {t:"mc", ref:"Haggai 1:9", q:"Haggai 1:9 says the people looked for much but it came to little, and when they brought it home, what did God do?", opts:["Blew it away","Doubled it","Turned it to gold","Hid it from them"], a:"Blew it away"},
    {t:"mc", ref:"Haggai 2:4", q:"What repeated command does the LORD give to Zerubbabel, Joshua, and the people in Haggai 2:4?", opts:["\"Be strong\"","\"Be silent\"","\"Be patient\"","\"Be humble\""], a:"\"Be strong\""},
  ], medium: [
    {t:"mc", ref:"Haggai", q:"Haggai prophesied during the reign of which Persian king?", opts:["Darius","Cyrus","Xerxes","Artaxerxes"], a:"Darius"},
    {t:"mc", ref:"Haggai 1:4", q:"What did Haggai say about the people's own houses compared to God's house, the Temple, which still lay in ruins?", opts:["They lived in finished, paneled houses while the Temple lay unfinished","They had no houses of their own","They had built the Temple first, correctly","They had abandoned their houses entirely"], a:"They lived in finished, paneled houses while the Temple lay unfinished"},
    {t:"mc", ref:"Haggai 1:14", q:"Whose spirits did the LORD stir up to begin the work on the Temple, according to Haggai 1:14?", opts:["Zerubbabel, Joshua, and the remnant of the people","Only Zerubbabel","Only the priests","The elders of Babylon"], a:"Zerubbabel, Joshua, and the remnant of the people"},
    {t:"mc", ref:"Haggai 2:6-7", q:"Haggai 2:6-7 says God will shake the heavens, earth, sea, and dry land, and shake the nations so that what would happen?", opts:["The treasures of all nations would come in to fill the house with glory","All idols would be destroyed permanently","All nations would be exiled","The Temple would be moved to Babylon"], a:"The treasures of all nations would come in to fill the house with glory"},
    {t:"mc", ref:"Haggai 2:12-13", q:"Haggai's illustration about holy meat and a dead body teaches the priests that uncleanness spreads more easily than what?", opts:["Holiness","Wealth","Blessing","Fear"], a:"Holiness"},
    {t:"mc", ref:"Haggai 2:17", q:"What three agricultural disasters does Haggai 2:17 say God used to strike the people's crops?", opts:["Blight, mildew, and hail","Drought, locusts, and fire","Flood, frost, and famine","Wind, hail, and pestilence"], a:"Blight, mildew, and hail"},
    {t:"mc", ref:"Haggai 2:19", q:"Haggai 2:19 lists which four plants that had yielded nothing before the people resumed the Temple work?", opts:["The vine, fig tree, pomegranate, and olive","Wheat, barley, flax, and grapes","Cedar, oak, myrtle, and palm","Wheat, olive, fig, and cedar"], a:"The vine, fig tree, pomegranate, and olive"},
    {t:"mc", ref:"Haggai 1:10-11", q:"What did the LORD withhold from the land because the people neglected the Temple, according to Haggai 1:10-11?", opts:["Dew and produce, sending a drought","Rain only, but not dew","Sunlight during the day","Wind for the harvest"], a:"Dew and produce, sending a drought"},
