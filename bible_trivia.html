<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scripture Quest</title>
<style>
:root{
  --bg:#181330; --card:#241d47; --accent:#f2c94c; --accent2:#6fe0ab; --accent3:#ff8a65;
  --text:#f4f0ff; --sub:#a99bd6; --wrong:#ef5f6a; --right:#4bd08a; --line:#3a3266;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3efff; --card:#ffffff; --accent:#b8860b; --accent2:#1f9d63; --accent3:#e0672e;
    --text:#251f3d; --sub:#6b6190; --wrong:#c62f2f; --right:#1e8a4c; --line:#e0d9f7;
  }
}
:root[data-theme="dark"]{
  --bg:#181330; --card:#241d47; --accent:#f2c94c; --accent2:#6fe0ab; --accent3:#ff8a65;
  --text:#f4f0ff; --sub:#a99bd6; --wrong:#ef5f6a; --right:#4bd08a; --line:#3a3266;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:Georgia,'Times New Roman',serif; display:flex; justify-content:center;
  padding:14px; padding-top:calc(14px + env(safe-area-inset-top,0px)); padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
}
.wrap{width:100%; max-width:480px;}
h1{ text-align:center; font-size:1.5em; margin:2px 0 0; color:var(--accent); letter-spacing:0.5px;}
.sub{text-align:center; color:var(--sub); margin-bottom:10px; font-size:0.85em;}
.topbar{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  background:var(--card); border-radius:14px; padding:10px 14px; margin-bottom:12px;
  font-size:0.85em; box-shadow:0 4px 14px rgba(0,0,0,0.15);
}
.topbar .pill{display:flex; align-items:center; gap:4px; white-space:nowrap;}
.xpbar{flex:1; height:8px; background:var(--line); border-radius:6px; margin:0 8px; overflow:hidden;}
.xpbar-fill{height:100%; background:var(--accent2); border-radius:6px; transition:width .4s;}
.card{ background:var(--card); border-radius:16px; padding:18px; box-shadow:0 6px 20px rgba(0,0,0,0.18); margin-bottom:12px;}
.hidden{display:none !important;}
.backrow{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.backbtn{background:none; border:none; color:var(--sub); font-size:1.3em; cursor:pointer; padding:0 4px;}
.stepTitle{font-weight:bold; font-size:1.05em;}
.stepSub{color:var(--sub); font-size:0.82em; margin-top:-6px; margin-bottom:10px;}
.book-grid{display:flex; flex-wrap:wrap; gap:8px; max-height:52vh; overflow-y:auto; padding-bottom:2px;}
.book-chip{
  padding:10px 14px; border-radius:14px; border:1.5px solid var(--line); background:transparent;
  color:var(--text); cursor:pointer; font-size:0.9em; font-family:inherit; position:relative;
}
.book-chip .badge{position:absolute; top:-8px; right:-4px; font-size:0.65em; background:var(--accent); color:#221a08; border-radius:8px; padding:1px 5px; font-weight:bold;}
.mode-card{
  display:flex; align-items:center; gap:14px; padding:16px; border-radius:14px; border:2px solid var(--line);
  background:transparent; color:var(--text); cursor:pointer; width:100%; text-align:left; margin-bottom:10px; font-family:inherit;
}
.mode-card .em{font-size:1.8em;}
.mode-card .mname{font-weight:bold; font-size:1.02em;}
.mode-card .mdesc{color:var(--sub); font-size:0.8em; margin-top:2px;}
.mode-card:disabled, .mode-card.disabled{opacity:0.4; cursor:default;}
.chip-row{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0;}
.chip{ padding:10px 16px; border-radius:20px; border:1.5px solid var(--sub); background:transparent; color:var(--text); cursor:pointer; font-size:0.92em; font-family:inherit; position:relative;}
.chip.selected{background:var(--accent); border-color:var(--accent); color:#221a08; font-weight:bold;}
.chip .mini-star{display:block; font-size:0.7em; margin-top:2px;}
button.primary{ width:100%; padding:14px; border-radius:12px; border:none; background:var(--accent2); color:#0e2418; font-weight:bold; font-size:1.02em; cursor:pointer; margin-top:8px;}
button.primary:disabled{opacity:0.5;}
label.toggle{display:flex; align-items:center; gap:8px; font-size:0.85em; color:var(--sub); margin-top:12px; cursor:pointer;}
.hud{display:flex; justify-content:space-between; align-items:center; color:var(--sub); font-size:0.85em; margin-bottom:8px;}
.combo{color:var(--accent); font-weight:bold; font-size:0.85em; min-height:18px; margin-bottom:4px;}
.qref{color:var(--accent); font-size:0.82em; margin-bottom:6px;}
.qtext{font-size:1.12em; margin-bottom:14px; line-height:1.4;}
.opt{ display:block; width:100%; text-align:left; padding:12px 14px; margin-bottom:8px; border-radius:10px; border:1.5px solid var(--sub); background:transparent; color:var(--text); font-family:inherit; font-size:1em; cursor:pointer;}
.opt.right{background:var(--right); border-color:var(--right); color:#0e2418; font-weight:bold;}
.opt.wrong{background:var(--wrong); border-color:var(--wrong); color:#2b0e0e; font-weight:bold;}
.opt:disabled{cursor:default;}
.feedback{min-height:20px; font-size:0.9em; margin-bottom:6px; color:var(--sub);}
.order-strip{min-height:52px; border:2px dashed var(--sub); border-radius:10px; padding:8px; display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;}
.order-bank{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
.tok{padding:8px 12px; border-radius:8px; background:var(--line); color:var(--text); cursor:pointer; font-size:0.95em; border:none; font-family:inherit;}
.tok.placed{background:var(--accent); color:#221a08;}
.tok:disabled{opacity:0.4; cursor:default;}
.big-emoji{font-size:2.4em; text-align:center; margin-bottom:6px;}
.result{text-align:center;}
.result .stars-big{font-size:2em; margin:8px 0;}
.result .score{font-size:1.7em; color:var(--accent); margin:6px 0;}
.result .rewards{display:flex; justify-content:center; gap:18px; color:var(--sub); font-size:0.95em; margin:10px 0;}
footer{text-align:center; color:var(--sub); font-size:0.72em; margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>📖 Scripture Quest</h1>
  <div class="sub">Bible knowledge · ESV reference</div>

  <div class="topbar">
    <div class="pill">🔥 <span id="streakVal">0</span></div>
    <div class="pill">Lv <span id="xpLevelVal">1</span></div>
    <div class="xpbar"><div class="xpbar-fill" id="xpFill" style="width:0%"></div></div>
    <div class="pill">🪙 <span id="coinVal">0</span></div>
  </div>

  <div id="stepBook" class="card">
    <div class="stepTitle">1. Choose a book</div>
    <div class="stepSub">All 66 books, every mode — hand-written questions, no AI at play time.</div>
    <div class="book-grid" id="bookGrid"></div>
  </div>

  <div id="stepMode" class="card hidden">
    <div class="backrow"><button class="backbtn" id="backToBook">←</button><div class="stepTitle" id="modeBookLabel"></div></div>
    <div class="stepSub">2. Choose a game mode</div>
    <button class="mode-card" id="modeTrivia">
      <span class="em">🧠</span>
      <span><span class="mname">Trivia Challenge</span><br><span class="mdesc">Multiple-choice questions about people, places &amp; events</span></span>
    </button>
    <button class="mode-card" id="modeFill">
      <span class="em">✏️</span>
      <span><span class="mname">Fill in the Blank</span><br><span class="mdesc">Complete the missing word in real ESV verses</span></span>
    </button>
    <button class="mode-card" id="modeOrder">
      <span class="em">🧩</span>
      <span><span class="mname">Verse Builder</span><br><span class="mdesc">Tap words into place to rebuild a verse</span></span>
    </button>
  </div>

  <div id="stepDiff" class="card hidden">
    <div class="backrow"><button class="backbtn" id="backToMode">←</button><div class="stepTitle" id="diffLabel"></div></div>
    <div class="stepSub">3. Choose difficulty</div>
    <div class="chip-row" id="diffChips">
      <button class="chip" data-diff="easy">Easy</button>
      <button class="chip" data-diff="medium">Medium</button>
      <button class="chip" data-diff="hard">Hard</button>
    </div>
    <div id="aiStatus" style="font-size:0.78em;color:var(--sub);margin-top:4px;min-height:16px;"></div>
    <button class="primary" id="playBtn" disabled>Play</button>
  </div>

  <div id="game" class="card hidden">
    <div class="hud">
      <span id="progress">Q1/8</span>
      <span id="livesLive">❤️❤️❤️</span>
    </div>
    <div class="combo" id="comboLine"></div>
    <div class="qref" id="qref"></div>
    <div class="qtext" id="qtext"></div>
    <div id="mcArea"></div>
    <div id="orderArea" class="hidden">
      <div class="order-strip" id="orderStrip"></div>
      <div class="order-bank" id="orderBank"></div>
      <button class="primary" id="orderCheckBtn" disabled>Check</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="primary hidden" id="nextBtn">Next →</button>
  </div>

  <div id="result" class="card result hidden">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <div id="resultTitle" style="font-size:1.2em;font-weight:bold;"></div>
    <div class="stars-big" id="resultStars"></div>
    <div class="score" id="finalScore"></div>
    <div class="rewards"><span id="coinsEarnedLine"></span><span id="xpEarnedLine"></span></div>
    <div id="resultSub" style="color:var(--sub);font-size:0.85em;"></div>
    <button class="primary" id="playAgainBtn">Play Again</button>
    <button class="primary" id="chooseAnotherBtn" style="background:transparent;border:1.5px solid var(--sub);color:var(--text);">Choose Another</button>
  </div>

  <footer>Text references from the ESV (English Standard Version)</footer>
</div>

<script>
/* =========================================================

   ========================================================= */

    {t:"mc", ref:"Genesis 19:26", q:"What happened to Lot's wife when she looked back at the destruction of Sodom?", opts:["She turned into a pillar of salt","She was struck blind","She died instantly","She turned to stone"], a:"She turned into a pillar of salt"},

    {t:"mc", ref:"Ruth 4:2", q:"How many elders did Boaz gather at the town gate to witness his legal transaction?", opts:["Ten","Twelve","Seven","Three"], a:"Ten"},
    {t:"mc", ref:"Ruth 1:8-14", q:"What did Naomi tell her two daughters-in-law to do, right after her husband and sons had died?", opts:["Return to their own mothers' homes in Moab","Follow her to Bethlehem immediately","Remarry Moabite priests","Join a temple as servants"], a:"Return to their own mothers' homes in Moab"},
    {t:"mc", ref:"Ruth 1:4", q:"Besides Ruth, what was the name of Naomi's other daughter-in-law who initially set out with her?", opts:["Orpah","Dinah","Tamar","Zilpah"], a:"Orpah"},
    {t:"mc", ref:"Ruth 1:16-17", q:"What did Ruth vow to Naomi that showed her total commitment, refusing to turn back to Moab?", opts:["That she would go wherever Naomi went and die where she died","That she would return once Naomi remarried","That she would only stay one year","That she would go only if Orpah went too"], a:"That she would go wherever Naomi went and die where she died"},
    {t:"mc", ref:"Ruth 2:11-12", q:"What did Boaz say he had heard about Ruth, praising her loyalty to Naomi?", opts:["That she had left her home to care for her mother-in-law","That she was a skilled weaver","That she was of royal Moabite blood","That she had rejected many suitors in Moab"], a:"That she had left her home to care for her mother-in-law"},
    {t:"mc", ref:"Ruth 3:9", q:"What did Ruth ask Boaz to do for her at the threshing floor, using the language of the kinsman-redeemer custom?", opts:["Spread his garment's corner over her, i.e. take her as his wife","Give her more grain","Speak to Naomi on her behalf","Send her back to Moab safely"], a:"Spread his garment's corner over her, i.e. take her as his wife"},
    {t:"order", ref:"Ruth 1:16", verse:"For where you go I will go, and where you lodge I will lodge.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Ruth 3:10", q:"\"...You have made this last kindness greater than the first in that you have not gone after young men, whether poor or ___.\"", opts:["rich","proud","foreign","idle"], a:"rich"},
    {t:"fill", ref:"Ruth 4:15", q:"\"...He shall be to you a restorer of life and a nourisher of your old age, for your daughter-in-law who loves you, who is more to you than seven ___...\"", opts:["sons","daughters","children","brothers"], a:"sons"},
    {t:"order", ref:"Ruth 1:9", verse:"The LORD grant that you may find rest, each of you in the house of her husband!", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Ruth 1:17", q:"\"...May the LORD do so to me and more also if anything but ___ parts me from you.\"", opts:["death","time","distance","fear"], a:"death"},
    {t:"fill", ref:"Ruth 2:4", q:"\"...And behold, Boaz came from ___.\"", opts:["Bethlehem","Moab","the field","town"], a:"Bethlehem"},
    {t:"fill", ref:"Ruth 2:20", q:"\"...The man is a close relative of ours, one of our ___.\"", opts:["redeemers","kinsmen alone","elders","judges"], a:"redeemers"},
    {t:"fill", ref:"Ruth 4:14", q:"\"...and may his name be renowned in ___!\"", opts:["Israel","Bethlehem","Judah","the land"], a:"Israel"},
    {t:"order", ref:"Ruth 3:11", verse:"I will do for you all that you ask, for all my fellow townsmen know that you are a worthy woman.", q:"Arrange the verse in order:"},
  ], hard: [
    {t:"mc", ref:"Ruth 4", q:"Ruth married Boaz and became an ancestor of which king?", opts:["David","Saul","Solomon","Josiah"], a:"David"},
    {t:"mc", ref:"Matthew 1:5", q:"Ruth is listed in the genealogy of Jesus in which New Testament Gospel?", opts:["Matthew","Mark","Luke","John"], a:"Matthew"},
    {t:"fill", ref:"Ruth 4:17", q:"\"...They named him ___. He was the father of Jesse, the father of David.\"", opts:["Obed","Boaz","Mahlon","Chilion"], a:"Obed"},
    {t:"mc", ref:"Ruth 1", q:"Who was Naomi's other daughter-in-law, who chose to stay in Moab instead of following her?", opts:["Orpah","Dinah","Tamar","Zilpah"], a:"Orpah"},
    {t:"mc", ref:"Ruth 4:1-6", q:"Who was the unnamed nearer kinsman-redeemer who declined to redeem Elimelech's land and marry Ruth?", opts:["An unnamed relative closer than Boaz","Naomi's brother","Elimelech's own brother, named in the text","Obed's grandfather"], a:"An unnamed relative closer than Boaz"},
    {t:"mc", ref:"Ruth 4:11", q:"What large-family blessing did the elders and people at the gate speak over Ruth, comparing her to two matriarchs?", opts:["Rachel and Leah","Sarah and Hagar","Deborah and Miriam","Esther and Vashti"], a:"Rachel and Leah"},
    {t:"mc", ref:"Ruth", q:"In the Hebrew Bible's arrangement, the book of Ruth is grouped among which section, rather than with the historical books as in Christian Bibles?", opts:["The Writings (Ketuvim)","The Prophets (Nevi'im)","The Torah","The Wisdom Literature only"], a:"The Writings (Ketuvim)"},
    {t:"mc", ref:"Ruth", q:"Along with Ruth, name another Old Testament book named after a woman who is also its central character.", opts:["Esther","Judith (Old Testament)","Deborah","Miriam"], a:"Esther"},
    {t:"mc", ref:"Ruth 4:14-15", q:"What did the women of Bethlehem say about Obed to Naomi, regarding her old age?", opts:["That he would be a comfort and sustain her in her old age","That he would leave for Moab someday","That he would never marry","That he would become a priest"], a:"That he would be a comfort and sustain her in her old age"},
    {t:"mc", ref:"Ruth", q:"What overall theme does Ruth's story of loyalty, provision, and redemption foreshadow, according to many Christian readings?", opts:["God's providence and the coming kinsman-redeemer, Christ","Israel's military conquests","The dangers of foreign marriage","The role of the judges"], a:"God's providence and the coming kinsman-redeemer, Christ"},
    {t:"mc", ref:"Ruth 1:1", q:"During the time period of which book of the Bible is Ruth's story explicitly said to take place?", opts:["Judges","Joshua","1 Samuel","Exodus"], a:"Judges"},
    {t:"order", ref:"Ruth 1:17", verse:"Where you die I will die, and there will I be buried.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Ruth 2:12", q:"\"...under whose wings you have come to take ___!\"", opts:["refuge","shelter","comfort","hope"], a:"refuge"},
    {t:"fill", ref:"Ruth 1:16", q:"\"...For where you go I will go, and where you lodge I will ___.\"", opts:["lodge","stay","remain","abide"], a:"lodge"},
    {t:"fill", ref:"Ruth 4:15", q:"\"...for your daughter-in-law who loves you, who is more to you than seven sons, has given ___ to him.\"", opts:["birth","life","name","hope"], a:"birth"},
    {t:"order", ref:"Ruth 4:14", verse:"Blessed be the LORD, who has not left you this day without a redeemer, and may his name be renowned in Israel!", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Ruth 3:10", q:"\"...May you be blessed by the LORD, my ___.\"", opts:["daughter","child","dear one","friend"], a:"daughter"},
    {t:"fill", ref:"Ruth 2:20", q:"\"...whose kindness has not forsaken the living or the ___!\"", opts:["dead","lost","poor","weary"], a:"dead"},
    {t:"fill", ref:"Ruth 1:9", q:"\"...Then she kissed them, and they lifted up their voices and ___.\"", opts:["wept","mourned","cried out","prayed"], a:"wept"},
    {t:"fill", ref:"Ruth 2:4", q:"\"...The LORD be with you!' And they answered, 'The LORD bless ___.'\"", opts:["you","him","us","her"], a:"you"},
  ]},
"1 Samuel": { easy: [
    {t:"mc", ref:"1 Samuel 17", q:"Who killed the giant Goliath?", opts:["David","Saul","Jonathan","Samuel"], a:"David"},

    {t:"mc", ref:"1 Samuel 1-3", q:"Where did young Samuel serve and grow up, under the priest Eli?", opts:["The tabernacle at Shiloh","The Temple in Jerusalem","Bethel","Ramah"], a:"The tabernacle at Shiloh"},
    {t:"mc", ref:"1 Samuel 17", q:"What weapon did David use to defeat Goliath?", opts:["A sling and stone","A sword","A spear","A bow and arrow"], a:"A sling and stone"},

    {t:"order", ref:"1 Samuel 3:10", verse:"Speak, for your servant hears.", q:"Arrange the verse in order:"},

    {t:"fill", ref:"1 Samuel 2:2", q:"\"...There is none holy like the LORD; there is none besides you; there is no ___ like our God.\"", opts:["rock","king","shepherd","judge"], a:"rock"},

    {t:"fill", ref:"1 Samuel 25:32", q:"\"...Blessed be the LORD, the God of Israel, who sent you this day to meet ___!\"", opts:["me","us","David","him"], a:"me"},
    {t:"fill", ref:"1 Samuel 20:42", q:"\"...Go in peace, because we have sworn both of us in the name of the ___...\"", opts:["LORD","covenant","Almighty","King"], a:"LORD"},

    {t:"mc", ref:"1 Samuel", q:"Who was Israel's first king?", opts:["Saul","David","Solomon","Samuel"], a:"Saul"},

    {t:"mc", ref:"1 Samuel 5", q:"What happened to the statue of the god Dagon after the Philistines placed the captured Ark of the Covenant in its temple?", opts:["It fell down before the Ark","It came to life","It was destroyed by fire","Nothing happened"], a:"It fell down before the Ark"},
    {t:"mc", ref:"1 Samuel 6", q:"How did the Ark of the Covenant return to Israel after the Philistines sent it back?", opts:["On a cart pulled by cows","Carried by priests on foot","By ship","Buried and later found"], a:"On a cart pulled by cows"},
    {t:"mc", ref:"1 Samuel 15", q:"Why did God reject Saul as king after his war with the Amalekites?", opts:["He disobeyed by sparing King Agag and the best plunder","He refused to fight","He worshiped idols","He fled the battle"], a:"He disobeyed by sparing King Agag and the best plunder"},
    {t:"mc", ref:"1 Samuel 16", q:"What did Samuel secretly do to David, the youngest son of Jesse, in 1 Samuel 16?", opts:["Anointed him as future king","Gave him Goliath's armor","Made him a priest","Sent him to fight the Philistines"], a:"Anointed him as future king"},
    {t:"mc", ref:"1 Samuel 17:4", q:"How tall was Goliath, according to 1 Samuel 17?", opts:["Six cubits and a span (about 9-10 feet)","About 6 feet","Ten cubits","Three cubits"], a:"Six cubits and a span (about 9-10 feet)"},
    {t:"mc", ref:"1 Samuel 18:3", q:"What covenant did David and Jonathan make with each other?", opts:["A covenant of loyal friendship","A covenant of silence","A covenant to overthrow Saul","A covenant of marriage between families"], a:"A covenant of loyal friendship"},
    {t:"mc", ref:"1 Samuel 22", q:"Where did David hide from Saul while gathering a band of followers, in a well-known cave?", opts:["The cave of Adullam","The cave of Machpelah","The cave at En Gedi","The cave of Makkedah"], a:"The cave of Adullam"},

    {t:"mc", ref:"1 Samuel 1-4", q:"What were the names of Eli's two corrupt sons, priests at Shiloh?", opts:["Hophni and Phinehas","Nadab and Abihu","Er and Onan","Hur and Nun"], a:"Hophni and Phinehas"},
    {t:"mc", ref:"1 Samuel 13", q:"What act of disobedience by Saul, offering sacrifices himself rather than waiting for Samuel, foreshadowed his rejection as king?", opts:["Offering an unauthorized burnt offering","Marrying a foreign wife","Refusing to fight the Philistines","Consulting a medium"], a:"Offering an unauthorized burnt offering"},
    {t:"mc", ref:"1 Samuel 28", q:"Whom did Saul consult through a medium at En-dor, near the end of his life?", opts:["The spirit of the prophet Samuel","The spirit of Moses","An angel of the LORD","A demon impersonating God"], a:"The spirit of the prophet Samuel"},
    {t:"mc", ref:"1 Samuel 26", q:"In addition to cutting Saul's robe at En Gedi, David later spared Saul's life again by taking what from beside the sleeping king in his camp?", opts:["His spear and water jug","His crown and sword","His robe and sandals","His shield and helmet"], a:"His spear and water jug"},

    {t:"mc", ref:"1 Samuel 13:13-14", q:"What did Samuel tell Saul after his unauthorized sacrifice in 1 Samuel 13?", opts:["That his kingdom would not endure","That God had already forgiven him fully","That Jonathan would be punished instead","That the Philistines would retreat immediately"], a:"That his kingdom would not endure"},

"2 Samuel": { easy: [
    {t:"mc", ref:"2 Samuel 5", q:"What city did David make his capital after becoming king over all Israel?", opts:["Jerusalem","Hebron","Bethlehem","Shechem"], a:"Jerusalem"},

    {t:"mc", ref:"2 Chronicles 19", q:"What did King Jehoshaphat establish throughout Judah's cities, alongside his religious reforms?", opts:["A system of judges to administer justice","A new army draft","A network of Temple storehouses","A national census"], a:"A system of judges to administer justice"},

Ezra: { easy: [
    {t:"mc", ref:"Ezra", q:"What event does the book of Ezra primarily describe?", opts:["The return from Babylonian exile and rebuilding the Temple","The exodus from Egypt","The conquest of Canaan","The reign of Solomon"], a:"The return from Babylonian exile and rebuilding the Temple"},

    {t:"mc", ref:"Ezra 1:7-8", q:"What specific objects did Cyrus's decree order returned to Jerusalem, originally taken by Nebuchadnezzar?", opts:["The Temple's gold and silver vessels","The Ark of the Covenant","The city gates","The royal throne of David"], a:"The Temple's gold and silver vessels"},

    {t:"mc", ref:"Ezra 6:15", q:"Under which Persian king was the rebuilt Temple finally completed and dedicated?", opts:["Darius","Cyrus","Xerxes","Cambyses"], a:"Darius"},
    {t:"mc", ref:"Ezra 7:1-5", q:"To which ancient priestly ancestor does Ezra's genealogy trace back?", opts:["Aaron","Levi alone, without further detail","Moses","Zadok"], a:"Aaron"},
    {t:"mc", ref:"Ezra 8:21-23", q:"Instead of requesting a Persian military escort for the journey to Jerusalem, what did Ezra call the people to do?", opts:["Fast and pray","Hire mercenaries","Travel only by night","Bribe local officials"], a:"Fast and pray"},
    {t:"fill", ref:"Ezra 1:2", q:"\"...The LORD, the God of heaven, has given me all the kingdoms of the earth, and he has charged me to build him a house at ___.\"", opts:["Jerusalem","Zion","Judah","Bethel"], a:"Jerusalem"},
    {t:"fill", ref:"Ezra 1:3", q:"\"...Whoever is among you of all his people, may his God be with him, and let him go up to ___...\"", opts:["Jerusalem","Judah","Zion","Israel"], a:"Jerusalem"},
    {t:"order", ref:"Ezra 3:11", verse:"For he is good, for his steadfast love endures forever toward Israel.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Ezra 6:22", q:"\"...for the LORD had made them joyful and had turned the heart of the king of ___ to them...\"", opts:["Assyria","Babylon","Persia","Egypt"], a:"Assyria"},
    {t:"fill", ref:"Ezra 7:6", q:"\"...He was a scribe skilled in the Law of Moses that the LORD, the God of Israel, had given, and the king granted him all that he ___...\"", opts:["asked","requested alone","sought","desired"], a:"asked"},
    {t:"fill", ref:"Ezra 7:27", q:"\"...Blessed be the LORD, the God of our fathers, who put such a thing as this into the heart of the ___...\"", opts:["king","governor","priest","people"], a:"king"},
    {t:"fill", ref:"Ezra 7:28", q:"\"...I took courage, for the hand of the LORD my God was on ___.\"", opts:["me","us","Israel","Jerusalem"], a:"me"},
    {t:"fill", ref:"Ezra 8:22", q:"\"...The hand of our God is for good on all who seek him, and the power of his wrath is against all who ___ him.\"", opts:["forsake","oppose","deny","reject"], a:"forsake"},
    {t:"fill", ref:"Ezra 9:8", q:"\"...to give us a secure hold within his holy place, that our God may brighten our eyes and grant us a little ___ in our slavery.\"", opts:["reviving","hope","mercy","relief"], a:"reviving"},
    {t:"fill", ref:"Ezra 9:15", q:"\"...O LORD, the God of Israel, you are ___, for we are left a remnant that has escaped, as it is today.\"", opts:["just","righteous","holy","faithful"], a:"just"},

    {t:"mc", ref:"Ezra 9-10", q:"What did Ezra do when he learned many Israelites, including leaders, had intermarried with pagan neighbors against the Law?", opts:["He mourned, tore his clothes, and led the people to confess and repent","He ignored it as unimportant","He had the offenders exiled","He resigned his position"], a:"He mourned, tore his clothes, and led the people to confess and repent"},
    {t:"mc", ref:"Ezra 5", q:"Which two prophets encouraged the people to resume building the Temple after the work had stalled?", opts:["Haggai and Zechariah","Isaiah and Jeremiah","Malachi and Joel","Obadiah and Nahum"], a:"Haggai and Zechariah"},

    {t:"mc", ref:"Ezra 7:10", q:"What was Ezra specifically noted to have prepared his heart to do?", opts:["Study, observe, and teach the Law of the LORD","Build a new palace","Lead a military campaign","Found a new city"], a:"Study, observe, and teach the Law of the LORD"},

    {t:"fill", ref:"Ezra 5:11", q:"\"...We are the servants of the God of heaven and ___...\"", opts:["earth","Israel","glory","truth"], a:"earth"},
    {t:"fill", ref:"Ezra 6:10", q:"\"...that they may offer pleasing sacrifices to the God of heaven and pray for the life of the king and his ___.\"", opts:["sons","officials","people","house"], a:"sons"},
    {t:"fill", ref:"Ezra 7:9", q:"\"...for the good hand of his God was on ___.\"", opts:["him","them","Israel","Ezra alone"], a:"him"},

    {t:"order", ref:"Ezra 10:4", verse:"Arise, for it is your task, and we are with you; be strong and do it.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Ezra 8:23", q:"\"...So we fasted and implored our God for this, and he listened to our ___.\"", opts:["entreaty","prayer","plea","cry"], a:"entreaty"},
    {t:"fill", ref:"Ezra 9:6", q:"\"...I am ashamed and blush to lift my face to you, my God, for our iniquities have risen higher than our ___...\"", opts:["heads","hearts","sins","hopes"], a:"heads"},
    {t:"fill", ref:"Ezra 9:9", q:"\"...Yet our God has not forsaken us in our slavery, but has extended to us his steadfast love before the kings of ___...\"", opts:["Persia","Babylon","the earth","the nations"], a:"Persia"},
    {t:"fill", ref:"Ezra 10:11", q:"\"...Separate yourselves from the peoples of the land and from the foreign ___.\"", opts:["wives","gods","ways","nations"], a:"wives"},

    {t:"mc", ref:"Ezra 2-3", q:"What was Zerubbabel's role in the return from exile?", opts:["He led the first group of returning exiles as governor","He was the Persian king's chief advisor","He was Ezra's scribe","He led the military conquest of Jerusalem"], a:"He led the first group of returning exiles as governor"},

    {t:"fill", ref:"Job 1:8", q:"\"...that there is none like him on the earth, a blameless and ___ man, who fears God and turns away from evil?\"", opts:["upright","honest","faithful","devout"], a:"upright"},

  ], medium: [

    {t:"mc", ref:"Job 42:5", q:"What does Job say in chapter 42 about his knowledge of God, comparing hearing to seeing?", opts:["He had only heard of God before, but now had seen Him","He had seen God clearly all along","He still had no understanding of God","He claimed to know more than his friends"], a:"He had only heard of God before, but now had seen Him"},

    {t:"mc", ref:"Job 2:13", q:"What did Job's friends do first, before beginning to argue with him?", opts:["Sat with him in silence for seven days and nights","Immediately began accusing him","Left him alone to suffer","Offered sacrifices on his behalf"], a:"Sat with him in silence for seven days and nights"},
    {t:"mc", ref:"Job 42:15", q:"What unusual inheritance did Job give his daughters at the end of the book?", opts:["An inheritance alongside their brothers","No inheritance, per custom","Only a dowry for marriage","Land far from the family estate"], a:"An inheritance alongside their brothers"},

    {t:"mc", ref:"Job", q:"What poetic structure characterizes most of the book of Job, aside from its prose opening and closing?", opts:["Extended poetic dialogue/speeches","A single continuous prayer","A series of short proverbs","A historical chronicle"], a:"Extended poetic dialogue/speeches"},
    {t:"mc", ref:"Job 2:9", q:"What role does Job's wife play, appearing briefly to suggest something drastic?", opts:["She urges Job to curse God and die","She defends Job against his friends","She leaves him permanently","She prays for his healing"], a:"She urges Job to curse God and die"},
    {t:"mc", ref:"Job 42:7-9", q:"What did God command Job's friends to do at the very end, requiring Job's intercession?", opts:["Offer a sacrifice while Job prayed for them","Publicly apologize to Job in the town square","Pay Job a large sum of restitution","Leave the region permanently"], a:"Offer a sacrifice while Job prayed for them"},

Ecclesiastes: { easy: [
    {t:"mc", ref:"Ecclesiastes", q:"Ecclesiastes' famous refrain calls much of life what (ESV wording)?", opts:["Vanity","Foolishness","A blessing","A mystery"], a:"Vanity"},
    {t:"order", ref:"Ecclesiastes 1:2", verse:"Vanity of vanities, says the Preacher, vanity of vanities! All is vanity.", q:"Arrange the verse in order:"},
    {t:"order", ref:"Ecclesiastes 3:1", verse:"For everything there is a season, and a time for every matter under heaven:", q:"Arrange the verse in order:"},

    {t:"fill", ref:"Ecclesiastes 5:10", q:"\"...He who loves money will not be satisfied with money, nor he who loves wealth with his ___...\"", opts:["income","gain","riches","harvest"], a:"income"},
    {t:"order", ref:"Ecclesiastes 7:8", verse:"Better is the end of a thing than its beginning, and the patient in spirit is better than the proud in spirit.", q:"Arrange the verse in order:"},

    {t:"fill", ref:"Ecclesiastes 12:7", q:"\"...and the dust returns to the earth as it was, and the spirit returns to God who gave ___.\"", opts:["it","him breath","life","them"], a:"it"},
    {t:"mc", ref:"Ecclesiastes", q:"What repeated phrase throughout Ecclesiastes emphasizes an earthly, temporal perspective on life's pursuits?", opts:["\"under the sun\"","\"in the beginning\"","\"forever and ever\"","\"in those days\""], a:"\"under the sun\""},
    {t:"mc", ref:"Ecclesiastes", q:"What Hebrew title, meaning roughly \"the Preacher\" or \"the Teacher,\" is used for the book's speaker?", opts:["Qoheleth","Mishlei","Shaddai","Adonai"], a:"Qoheleth"},
    {t:"mc", ref:"Ecclesiastes 1:9", q:"What does Ecclesiastes 1:9 famously claim about new things happening in the world?", opts:["\"There is nothing new under the sun\"","\"All things are becoming new\"","\"The old has passed away entirely\"","\"Newness brings only sorrow\""], a:"\"There is nothing new under the sun\""},
    {t:"mc", ref:"Ecclesiastes 2", q:"What large-scale personal experiment did the Preacher undertake in Ecclesiastes 2?", opts:["Pursuing pleasure, wealth, and great projects","Living as a hermit in the wilderness","Traveling to foreign lands","Studying only the Law of Moses"], a:"Pursuing pleasure, wealth, and great projects"},
    {t:"mc", ref:"Ecclesiastes 1:7", q:"What image does Ecclesiastes 1 use to illustrate life's repetitive cycles, alongside the sun and wind?", opts:["Rivers flowing into a sea that never becomes full","Mountains slowly eroding","Stars endlessly circling","Trees growing and never falling"], a:"Rivers flowing into a sea that never becomes full"},
    {t:"mc", ref:"Ecclesiastes 5:4-5", q:"What does Ecclesiastes 5 warn about, regarding promises made to God?", opts:["Not to delay in fulfilling vows","Never making any vow at all","Making vows only in the Temple","Repeating vows for emphasis"], a:"Not to delay in fulfilling vows"},
    {t:"mc", ref:"Ecclesiastes 7:2", q:"According to Ecclesiastes 7, which is said to be better, in a surprising way — a house of mourning or a house of feasting?", opts:["A house of mourning","A house of feasting","Neither is better than the other","Both are equally meaningless"], a:"A house of mourning"},
    {t:"mc", ref:"Ecclesiastes 11:1", q:"What generosity metaphor does Ecclesiastes 11:1 use, about casting bread upon what?", opts:["The waters","The wind","The fire","The ground"], a:"The waters"},
    {t:"mc", ref:"Ecclesiastes 12:6", q:"What vivid extended image does Ecclesiastes 12 use to describe the process of aging and death?", opts:["The breaking of a golden bowl and silver cord","A withering fig tree","A lamp running out of oil","A ship sinking at sea"], a:"The breaking of a golden bowl and silver cord"},
  ], medium: [

    {t:"fill", ref:"Ecclesiastes 12:12", q:"\"...Of making many books there is no end, and much study is a weariness of the ___.\"", opts:["flesh","body","mind","soul"], a:"flesh"},
    {t:"mc", ref:"Ecclesiastes 9:11", q:"What does Ecclesiastes 9:11 say about \"the race,\" challenging the idea that skill alone guarantees success?", opts:["The race is not always to the swift; time and chance affect everyone","The race always favors the strongest","Only the wise ever succeed","Success depends solely on effort"], a:"The race is not always to the swift; time and chance affect everyone"},
    {t:"mc", ref:"Ecclesiastes 4:12", q:"What does Ecclesiastes 4:9-12 say about a \"cord of three strands,\" reinforcing the value of companionship?", opts:["It is not quickly broken","It is stronger than iron","It can still be cut easily","It represents the Trinity directly"], a:"It is not quickly broken"},

    {t:"mc", ref:"Ecclesiastes 2:4-6", q:"What large-scale building projects does the Preacher describe undertaking in Ecclesiastes 2?", opts:["Houses, vineyards, gardens, and parks","Temples and altars only","City walls and fortresses","Ships and harbors"], a:"Houses, vineyards, gardens, and parks"},
    {t:"mc", ref:"Ecclesiastes 10", q:"Ecclesiastes 10 contrasts wisdom and folly especially in relation to what kind of figures?", opts:["Kings and rulers","Priests and prophets","Merchants and farmers","Soldiers and generals"], a:"Kings and rulers"},
    {t:"mc", ref:"Ecclesiastes 2:16", q:"What does Ecclesiastes say is ultimately the same fate for both the wise person and the fool?", opts:["Both die and are eventually forgotten","Only the fool is forgotten","Only the wise are remembered forever","Neither is ever truly forgotten"], a:"Both die and are eventually forgotten"},
    {t:"mc", ref:"Ecclesiastes 2:24", q:"What repeated activity does the Preacher say people should find enjoyment in, as a gift from God despite life's toil?", opts:["Eating, drinking, and finding satisfaction in one's work","Solitude and silence","Accumulating wealth","Avoiding all labor"], a:"Eating, drinking, and finding satisfaction in one's work"},

Joel: { easy: [

    {t:"mc", ref:"Joel 2:1", q:"What does Joel 2:1 instruct to be blown in Zion, sounding an alarm about the coming Day of the LORD?", opts:["A trumpet","A ram's horn shofar only at night","A drum","A cymbal"], a:"A trumpet"},
    {t:"mc", ref:"Joel 2:12-13", q:"What does Joel 2:12-13 call the people to do sincerely, rather than merely tearing their clothes?", opts:["Rend/turn their hearts in genuine repentance","Offer more sacrifices","Build a new altar","Exile the wicked among them"], a:"Rend/turn their hearts in genuine repentance"},
    {t:"mc", ref:"Joel 2:23", q:"What agricultural blessing does Joel 2:23 promise will be restored, alongside repaying the locusts' damage?", opts:["Rain (the early and latter rains)","Sunshine year-round","A permanent harvest with no seasons","New irrigation canals"], a:"Rain (the early and latter rains)"},

    {t:"order", ref:"Joel 1:4", verse:"What the cutting locust left, the swarming locust has eaten. What the swarming locust left, the hopping locust has eaten, and what the hopping locust left, the destroying locust has eaten.", q:"Arrange the verse in order:"},

    {t:"fill", ref:"Joel 2:13", q:"\"Return to the LORD your God, for he is gracious and ___, slow to anger, and abounding in steadfast love; and he relents over disaster.\"", opts:["merciful","kind","patient","loving"], a:"merciful"},
    {t:"order", ref:"Joel 1:15", verse:"Alas for the day! For the day of the LORD is near, and as destruction from the Almighty it comes.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Joel 1:15", q:"\"Alas for the day! For the day of the LORD is ___, and as destruction from the Almighty it comes.\"", opts:["near","coming","dark","certain"], a:"near"},

    {t:"mc", ref:"Joel 2:31", q:"What sign does Joel say will accompany the coming \"day of the LORD,\" involving the sun and moon?", opts:["The sun turned to darkness and the moon to blood","A double sunrise","A permanent eclipse","The stars falling to earth"], a:"The sun turned to darkness and the moon to blood"},
    {t:"fill", ref:"Joel 2:28", q:"\"...afterward, that I will pour out my ___ on all flesh.\"", opts:["Spirit","blessing","glory","mercy"], a:"Spirit"},

    {t:"mc", ref:"Joel 2:25", q:"What does Joel 2:25 promise regarding the years the locust plague consumed?", opts:["That God will restore/repay those years","That those years are lost forever","That the locusts will never return","That the years will be forgotten entirely"], a:"That God will restore/repay those years"},
    {t:"mc", ref:"Joel", q:"What emotional and thematic shift occurs between Joel's early chapters and its later chapters?", opts:["From national lament and crisis to promised restoration and blessing","From celebration to sudden despair","From military victory to defeat","From praise to total silence"], a:"From national lament and crisis to promised restoration and blessing"},

    {t:"mc", ref:"Joel 2:17", q:"What do the priests do in Joel 2, weeping between the porch and the altar, pleading for the people?", opts:["Intercede for mercy on behalf of the nation","Perform the daily sacrifice as usual","Refuse to serve until the crisis ends","Leave the Temple entirely"], a:"Intercede for mercy on behalf of the nation"},

    {t:"fill", ref:"Joel 2:25", q:"\"I will ___ to you the years that the swarming locust has eaten, the hopper, the destroyer, and the cutter, my great army, which I sent among you.\"", opts:["restore","repay","return","give"], a:"restore"},

    {t:"fill", ref:"Joel 3:10", q:"\"Beat your plowshares into swords, and your pruning hooks into ___;\"", opts:["spears","arrows","blades","weapons"], a:"spears"},

    {t:"fill", ref:"Joel 3:17", q:"\"So you shall know that I am the LORD your God, who dwells in Zion, my holy mountain. And Jerusalem shall be holy, and strangers shall never again pass through ___.\"", opts:["it","her","the city","the gate"], a:"it"},

Obadiah: { easy: [

    {t:"mc", ref:"Obadiah", q:"What is Obadiah's overall genre?", opts:["A prophecy/oracle of judgment","A historical narrative","A wisdom poem","A personal lament"], a:"A prophecy/oracle of judgment"},
    {t:"mc", ref:"Obadiah 1:3", q:"Where did Edom's people famously live, described as \"clefts of the rock\" and \"lofty dwelling\"?", opts:["In rock cliffs (like the region later called Petra)","In tents on open plains","In river valleys","In coastal port cities"], a:"In rock cliffs (like the region later called Petra)"},
    {t:"mc", ref:"Obadiah 1:4", q:"What bird's nest does Obadiah use to describe Edom's proud, seemingly untouchable position?", opts:["An eagle's","A dove's","A sparrow's","A vulture's"], a:"An eagle's"},

    {t:"mc", ref:"Obadiah 1:7", q:"What did Edom's own allies do to betray them, according to Obadiah 7?", opts:["Set a trap for them despite eating their bread","Declared open war immediately","Refused to trade with them","Warned Israel of Edom's plans"], a:"Set a trap for them despite eating their bread"},

    {t:"mc", ref:"Obadiah 1:11", q:"What did Edom do while foreigners cast lots for Jerusalem and carried off its wealth?", opts:["Stood aloof, acting like one of the attackers","Rushed to defend the city","Warned Jerusalem in advance","Offered refuge to the fleeing citizens"], a:"Stood aloof, acting like one of the attackers"},

    {t:"mc", ref:"Obadiah 1:15", q:"What does Obadiah 15 say is \"near upon all the nations,\" not just Edom?", opts:["The day of the LORD","A great famine","A new census","A worldwide flood"], a:"The day of the LORD"},

    {t:"fill", ref:"Obadiah 1:3", q:"\"The pride of your heart has ___ you, you who live in the clefts of the rock, in your lofty dwelling,\"", opts:["deceived","blinded","hardened","ruined"], a:"deceived"},
    {t:"order", ref:"Obadiah 1:4", verse:"Though you soar aloft like the eagle, though your nest is set among the stars, from there I will bring you down, declares the LORD.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Obadiah 1:4", q:"\"Though you soar aloft like the ___, though your nest is set among the stars, from there I will bring you down, declares the LORD.\"", opts:["eagle","hawk","falcon","vulture"], a:"eagle"},
    {t:"order", ref:"Obadiah 1:6", verse:"How Esau has been pillaged, his treasures sought out!", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Obadiah 1:6", q:"\"How Esau has been pillaged, his ___ sought out!\"", opts:["treasures","riches","cities","children"], a:"treasures"},
    {t:"order", ref:"Obadiah 1:7", verse:"All your allies have driven you to your border; those at peace with you have deceived you;", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Obadiah 1:7", q:"\"All your allies have driven you to your border; those at peace with you have ___ you;\"", opts:["deceived","betrayed","forsaken","attacked"], a:"deceived"},
  ], medium: [
    {t:"mc", ref:"Obadiah", q:"Edom is condemned in Obadiah largely for its treatment of which nation in its time of distress?", opts:["Judah/Israel","Egypt","Assyria","Philistia"], a:"Judah/Israel"},

    {t:"mc", ref:"Obadiah 1:16", q:"What does Obadiah say \"all the nations\" will do on God's holy mountain, using the imagery of drinking?", opts:["Drink continually (drink the cup of judgment) and be as though they never existed","Drink in celebration of peace","Refuse to drink at all","Drink only water, not wine"], a:"Drink continually (drink the cup of judgment) and be as though they never existed"},
    {t:"mc", ref:"Obadiah 1:18", q:"What three \"houses\" does Obadiah 18 describe as fire, flame, and stubble?", opts:["The house of Jacob (fire), house of Joseph (flame), and house of Esau (stubble)","The house of David, Solomon, and Saul","The house of Levi, Judah, and Benjamin","The house of Israel, Egypt, and Assyria"], a:"The house of Jacob (fire), house of Joseph (flame), and house of Esau (stubble)"},
    {t:"mc", ref:"Obadiah 1:18", q:"What ultimate fate does Obadiah 18 pronounce for the house of Esau (Edom)?", opts:["No survivor will remain","A remnant will be spared","They will be enslaved instead","They will be exiled but survive"], a:"No survivor will remain"},
    {t:"mc", ref:"Obadiah 1:19-20", q:"According to Obadiah 19-20, which territories will be repossessed by God's restored people?", opts:["The Negeb, Shephelah, Ephraim, Samaria, Benjamin, and Gilead, among others","Only the city of Jerusalem itself","Egypt and its surrounding lands","Babylon and Persia"], a:"The Negeb, Shephelah, Ephraim, Samaria, Benjamin, and Gilead, among others"},
    {t:"mc", ref:"Obadiah 1:20", q:"How far will the exiles of Israel possess land, according to Obadiah 20?", opts:["As far as Zarephath","As far as Egypt's border only","As far as the Euphrates only","As far as Babylon itself"], a:"As far as Zarephath"},
    {t:"mc", ref:"Obadiah 1:8", q:"What does Obadiah 8 say God will destroy specifically among Edom's people, despite their reputation?", opts:["The wise men/wisdom of Edom","Their fortresses alone","Their trade routes","Their written records"], a:"The wise men/wisdom of Edom"},
    {t:"mc", ref:"Obadiah 1:14", q:"What warning does Obadiah 14 give about standing \"at the crossroads\"?", opts:["Not to cut off Edom's fugitives fleeing from Judah's disaster","Not to trade with foreign merchants","Not to build new roads","Not to travel during a fast"], a:"Not to cut off Edom's fugitives fleeing from Judah's disaster"},
    {t:"mc", ref:"Obadiah 1:6", q:"What does Obadiah 6 say happened to Esau's treasures, emphasizing the thoroughness of Edom's coming plunder?", opts:["They were pillaged and sought out","They were hidden safely underground","They were given away willingly","They were doubled in value"], a:"They were pillaged and sought out"},
    {t:"order", ref:"Obadiah 1:8", verse:"Will I not on that day, declares the LORD, destroy the wise men out of Edom, and understanding out of Mount Esau?", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Obadiah 1:8", q:"\"...destroy the wise men out of Edom, and understanding out of Mount ___?\"", opts:["Esau","Zion","Seir","Teman"], a:"Esau"},
    {t:"order", ref:"Obadiah 1:9", verse:"And your mighty men shall be dismayed, O Teman, so that every man from Mount Esau will be cut off by slaughter.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Obadiah 1:9", q:"\"And your mighty men shall be dismayed, O ___, so that every man from Mount Esau will be cut off by slaughter.\"", opts:["Teman","Edom","Sela","Bozrah"], a:"Teman"},
    {t:"order", ref:"Obadiah 1:10", verse:"Because of the violence done to your brother Jacob, shame shall cover you, and you shall be cut off forever.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Obadiah 1:10", q:"\"Because of the violence done to your brother Jacob, shame shall cover you, and you shall be cut off ___.\"", opts:["forever","completely","in that day","by the sword"], a:"forever"},
    {t:"order", ref:"Obadiah 1:11", verse:"On the day that you stood aloof, on the day that strangers carried off his wealth and foreigners entered his gates and cast lots for Jerusalem, you were like one of them.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Obadiah 1:11", q:"\"...and foreigners entered his gates and cast lots for ___, you were like one of them.\"", opts:["Jerusalem","Zion","Judah","Samaria"], a:"Jerusalem"},

    {t:"mc", ref:"Obadiah", q:"What relationship does Obadiah repeatedly emphasize between Edom and Israel/Judah, heightening the sense of betrayal?", opts:["They were brothers, descended from Esau and Jacob","They were unrelated rival empires","They had never had any contact before","They shared no common ancestry at all"], a:"They were brothers, descended from Esau and Jacob"},
    {t:"mc", ref:"Obadiah", q:"What does Obadiah's brevity as a single chapter contribute to its literary character, compared to longer prophetic books?", opts:["A tightly focused, single-themed oracle","A broad survey of many different nations","A detailed historical chronicle","An extended poetic hymn of praise"], a:"A tightly focused, single-themed oracle"},
    {t:"mc", ref:"Obadiah 1:17", q:"What does Obadiah 17 promise will happen on Mount Zion, in contrast to Edom's total destruction?", opts:["There shall be those who escape, and it shall be holy","It too will be leveled completely","It will be renamed after Edom","It will remain empty forever"], a:"There shall be those who escape, and it shall be holy"},

    {t:"fill", ref:"Obadiah 1:19", q:"\"Those of the Negeb shall possess Mount Esau, and those of the Shephelah shall possess the land of the ___;\"", opts:["Philistines","Edomites","Canaanites","Ammonites"], a:"Philistines"},

  ], hard: [

    {t:"mc", ref:"Micah 4,Isaiah 2", q:"Micah 4 shares an almost identical \"swords into plowshares\" prophecy of peace with which other prophetic book?", opts:["Isaiah","Jeremiah","Zechariah","Joel"], a:"Isaiah"},
    {t:"mc", ref:"Micah", q:"Micah's prophetic ministry was roughly contemporary with which two other prophets?", opts:["Isaiah and Hosea","Jeremiah and Ezekiel","Elijah and Elisha","Nahum and Zephaniah"], a:"Isaiah and Hosea"},
    {t:"mc", ref:"Micah 6:6-7", q:"What does Micah 6:6-7 rhetorically ask about sacrifices, even of thousands of rams?", opts:["Whether such sacrifices alone could ever satisfy God without justice and mercy","Whether God requires any sacrifice at all","Whether only priests may offer them","Whether sacrifices should be doubled"], a:"Whether such sacrifices alone could ever satisfy God without justice and mercy"},
    {t:"mc", ref:"Micah,Amos", q:"What theme connects Micah's condemnation of Judah's leaders with Amos's earlier prophecies against Israel?", opts:["Social injustice and oppression of the poor by those in power","Foreign military alliances","Improper Temple architecture","Neglect of the Sabbath"], a:"Social injustice and oppression of the poor by those in power"},
    {t:"mc", ref:"Micah 7:19", q:"What does Micah 7:19 say God will do with Israel's sins, using an image of the sea?", opts:["Cast them into the depths of the sea","Wash them away with rain","Burn them with fire","Bury them in the desert"], a:"Cast them into the depths of the sea"},
    {t:"mc", ref:"Micah", q:"What overall balance does Micah strike between judgment and hope throughout the book?", opts:["Severe judgment on injustice paired with hope for a future righteous king","Judgment alone, with no hope offered","Hope alone, with no judgment described","A focus only on foreign nations, not Israel"], a:"Severe judgment on injustice paired with hope for a future righteous king"},
    {t:"mc", ref:"Micah 1:16", q:"What mourning custom does Micah 1 describe the people adopting, shaving their heads like a certain bird?", opts:["Shaving their heads bald like an eagle/vulture","Wearing sackcloth for a full year","Cutting their garments in half","Painting their faces with ash"], a:"Shaving their heads bald like an eagle/vulture"},
    {t:"mc", ref:"Micah 3:12", q:"What does Micah 3 prophesy will happen to Mount Zion and Jerusalem's Temple, due to the leaders' corruption?", opts:["It would become a desolate heap, overgrown like a forest","It would be expanded into a great empire","It would be given to a foreign king to rule","It would remain untouched forever"], a:"It would become a desolate heap, overgrown like a forest"},

    {t:"fill", ref:"Micah 3:8", q:"\"But as for me, I am filled with ___, with the Spirit of the LORD, and with justice and might, to declare to Jacob his transgression and to Israel his sin.\"", opts:["power","strength","boldness","zeal"], a:"power"},

    {t:"fill", ref:"Micah 7:19", q:"\"He will again have ___ on us; he will tread our iniquities underfoot. You will cast all our sins into the depths of the sea.\"", opts:["compassion","mercy","pity","favor"], a:"compassion"},

    {t:"fill", ref:"Micah 1:3", q:"\"For behold, the LORD is coming out of his ___, and will come down and tread upon the high places of the earth.\"", opts:["place","temple","throne","dwelling"], a:"place"},

    {t:"fill", ref:"Micah 5:4", q:"\"And he shall stand and shepherd his flock in the strength of the LORD, in the majesty of the name of the LORD his ___.\"", opts:["God","Father","King","Savior"], a:"God"},

Nahum: { easy: [
    {t:"mc", ref:"Nahum", q:"Nahum pronounces judgment on which great and cruel city?", opts:["Nineveh","Babylon","Tyre","Damascus"], a:"Nineveh"},
    {t:"mc", ref:"Nahum", q:"What overall tone dominates the short book of Nahum?", opts:["Fierce, uncompromising judgment","Gentle encouragement","Personal lament","Joyful celebration"], a:"Fierce, uncompromising judgment"},
    {t:"mc", ref:"Nahum 1:1", q:"From which town did the prophet Nahum come, according to Nahum 1:1?", opts:["Elkosh","Tekoa","Moresheth","Gath-hepher"], a:"Elkosh"},
    {t:"mc", ref:"Nahum 1:3", q:"What does Nahum 1:3 say about God's anger, echoing language also found in Exodus 34?", opts:["He is slow to anger but will not leave the guilty unpunished","He never becomes angry at all","He is angry only at foreign nations","His anger lasts only a moment"], a:"He is slow to anger but will not leave the guilty unpunished"},

    {t:"mc", ref:"Nahum 2:6", q:"What happens to Nineveh's \"palace\" in the vivid description of its fall in Nahum 2?", opts:["It melts away","It is rebuilt stronger","It is sold to Babylon","It survives untouched"], a:"It melts away"},
    {t:"mc", ref:"Nahum 2:11-12", q:"What animal metaphor does Nahum 2 use to describe Assyria's history of brutally preying on other nations?", opts:["A lion's den","A wolf pack","An eagle's nest","A serpent's pit"], a:"A lion's den"},
    {t:"mc", ref:"Nahum 1:1", q:"How is the book of Nahum introduced in 1:1, describing its content?", opts:["\"An oracle concerning Nineveh, the book of the vision of Nahum\"","\"A letter to the exiles in Babylon\"","\"A psalm of praise for Jerusalem\"","\"A genealogy of the house of David\""], a:"\"An oracle concerning Nineveh, the book of the vision of Nahum\""},

    {t:"order", ref:"Nahum 1:3", verse:"The LORD is slow to anger and great in power, and the LORD will by no means clear the guilty.", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Nahum 1:3", q:"\"The LORD is slow to ___ and great in power, and the LORD will by no means clear the guilty.\"", opts:["anger","judge","speak","act"], a:"anger"},

    {t:"fill", ref:"Nahum 1:5", q:"\"The mountains quake before him; the hills ___; the earth heaves before him, the world and all who dwell in it.\"", opts:["melt","tremble","shake","crumble"], a:"melt"},
    {t:"order", ref:"Nahum 1:7", verse:"The LORD is good, a stronghold in the day of trouble; he knows those who take refuge in him.", q:"Arrange the verse in order:"},

    {t:"order", ref:"Nahum 1:15", verse:"Behold, upon the mountains, the feet of him who brings good news, who publishes peace!", q:"Arrange the verse in order:"},
    {t:"fill", ref:"Nahum 1:15", q:"\"...Keep your feasts, O Judah; fulfill your ___, for never again shall the worthless pass through you; he is utterly cut off.\"", opts:["vows","promises","offerings","songs"], a:"vows"},
  ], medium: [

    {t:"mc", ref:"Nahum 1:7", q:"What does Nahum 1:7 say about the LORD, describing him as good and a stronghold for whom?", opts:["Those who take refuge in him","Only the priests of Israel","Every nation equally, without exception","Only the king of Judah"], a:"Those who take refuge in him"},
    {t:"mc", ref:"Nahum 1:11", q:"What accusation does Nahum 1:11 make against a figure who \"plotted evil against the LORD\"?", opts:["Being a worthless counselor against God","Being a false prophet within Judah","Being a corrupt Israelite priest","Being an unnamed foreign merchant"], a:"Being a worthless counselor against God"},

    {t:"mc", ref:"Nahum 3:4", q:"What comparison does Nahum 3 make between Nineveh and a seductive figure who \"betrays nations\"?", opts:["A prostitute","A sorceress","A queen","A false prophetess"], a:"A prostitute"},
    {t:"mc", ref:"Nahum 3:8", q:"What earlier Egyptian city does Nahum 3:8 compare Nineveh to, warning that strong defenses didn't save it either?", opts:["Thebes (No-amon)","Memphis","Alexandria","Heliopolis"], a:"Thebes (No-amon)"},

    {t:"mc", ref:"Nahum 3:15-17", q:"What insect imagery does Nahum 3:15-17 use to describe Nineveh's merchants and officials vanishing?", opts:["Locusts that fly away when the sun rises","Bees swarming a hive","Ants building endlessly","Spiders spinning webs"], a:"Locusts that fly away when the sun rises"},

    {t:"fill", ref:"Nahum 1:6", q:"\"Who can stand before his ___? Who can endure the heat of his anger?\"", opts:["indignation","fury","power","glory"], a:"indignation"},

    {t:"fill", ref:"Nahum 2:1", q:"\"The scatterer has come up against you. Man the ramparts; watch the road; dress for battle; collect all your ___.\"", opts:["strength","might","weapons","courage"], a:"strength"},

    {t:"fill", ref:"Nahum 3:1", q:"\"Woe to the bloody city, all full of lies and plunder— no end to the ___!\"", opts:["prey","blood","spoil","sin"], a:"prey"},

    {t:"fill", ref:"Nahum 3:19", q:"\"There is no easing your hurt; your wound is ___.\"", opts:["grievous","fatal","endless","mortal"], a:"grievous"},

    {t:"fill", ref:"Nahum 1:9", q:"\"What do you plot against the LORD? He will make a complete end; trouble will not rise up a second ___.\"", opts:["time","day","year","hour"], a:"time"},
  ], hard: [
    {t:"mc", ref:"Nahum", q:"Nahum's book is largely structured as what kind of literary piece against Nineveh?", opts:["A judgment oracle/poem of doom","A legal contract","A genealogy","A love poem"], a:"A judgment oracle/poem of doom"},
    {t:"mc", ref:"Nahum", q:"What is unique about Nahum's message compared to most other prophetic books?", opts:["It focuses almost entirely on judging one foreign city, without addressing Israel's own sins","It never mentions God","It is written entirely in prose","It addresses only Israel's sins"], a:"It focuses almost entirely on judging one foreign city, without addressing Israel's own sins"},
    {t:"mc", ref:"Nahum 1:2-3", q:"What theological paradox does Nahum 1:2-3 hold together concerning God's character?", opts:["He is avenging and jealous, yet also slow to anger","He is loving but powerless to punish","He is angry but forgetful of sin","He is distant and uninvolved in judgment"], a:"He is avenging and jealous, yet also slow to anger"},
    {t:"mc", ref:"Nahum 1:3", q:"What poetic phrase does Nahum 1:3 use to describe God's approach in the storm, emphasizing his majesty?", opts:["\"The clouds are the dust of his feet\"","\"The mountains are his throne\"","\"The stars are his crown\"","\"The seas are his footstool\""], a:"\"The clouds are the dust of his feet\""},
    {t:"mc", ref:"Nahum 2:8", q:"What metaphor does Nahum 2:8 use for Nineveh at the height of its power, before comparing its people fleeing like water draining away?", opts:["A pool of water","A blazing furnace","A towering mountain","A fortified vineyard"], a:"A pool of water"},
    {t:"mc", ref:"Nahum 3:18", q:"What accusation does Nahum 3:18 make against Assyria's \"shepherds\" (rulers), explaining why the people are scattered?", opts:["They slumber/sleep while the people are scattered","They have fled to Egypt","They have converted to worship the LORD","They have made peace with Babylon"], a:"They slumber/sleep while the people are scattered"},
    {t:"mc", ref:"Nahum 3:19", q:"What reaction does Nahum 3:19 say all who hear of Nineveh's fall will have?", opts:["They will clap their hands over her downfall","They will mourn her loss","They will rebuild her","They will send tribute"], a:"They will clap their hands over her downfall"},
    {t:"mc", ref:"Nahum", q:"What overarching theological theme unites Nahum's oracle, balancing God's patience with certain justice?", opts:["God is patient with sinners but will not let evil go unpunished forever","God abandons justice in favor of mercy alone","God only judges Israel, never foreign nations","God's justice depends on human effort"], a:"God is patient with sinners but will not let evil go unpunished forever"},

    {t:"fill", ref:"Nahum 3:12", q:"\"All your fortresses are like fig trees with first-ripe figs— if shaken they fall into the mouth of the ___.\"", opts:["eater","enemy","locust","devourer"], a:"eater"},
